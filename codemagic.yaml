workflows:
  android-debug:
    name: SPARTA Android (debug APK)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      node: latest
      java: 17
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Copy latest app into www
        script: cp finalspartan.html www/index.html
      - name: Sync Capacitor Android assets
        script: npx cap sync android
      - name: Build debug APK
        script: cd android && chmod +x gradlew && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk

  ios-sideload-unsigned:
    name: SPARTA iOS (unsigned, for Sideloadly/AltStore)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Copy latest app into www
        script: cp finalspartan.html www/index.html
      - name: Sync Capacitor iOS assets
        script: npx cap sync ios
      - name: Build unsigned .xcarchive
        script: |
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/ios/App.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive
      - name: Package unsigned .ipa
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/App.xcarchive/Products/Applications/*.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r SPARTA-unsigned.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa

  ios-sparta:
    name: SPARTA iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pantheon.sparta
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync Capacitor iOS assets
        script: npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
