<html lang="en">

<title>SPARTA — Pantheon System</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
  :root {
    /* === PANTHEON REFORGED — 5-hue Olympus palette ===
       Bronze (primary accent), Crimson (combat/PR), Aegean (agility/sea),
       Olive (recovery), Royal violet (king-tier). Backgrounds run warm
       so the bronze doesn't fight a cold blue-black. */
    --bg:        #0c0a08;          /* Warm near-black */
    --bg-2:      #16120e;
    --bg-3:      #221c14;
    --panel:     rgba(28, 23, 17, 0.92);
    --panel-2:   rgba(40, 33, 24, 0.95);
    /* Ambient background mood (overridden per-theme, see THEMES + ambient-bg) */
    --ambient-a: rgba(122,140,58,0.16);
    --ambient-b: rgba(168,72,24,0.18);
    --ash-color: #b9ad96;
    --shadow:    #050403;

    /* Lines warm-bronzy so they blend on warm bg */
    --line:      rgba(190, 158, 110, 0.16);
    --line-2:    rgba(190, 158, 110, 0.42);

    /* === Bronze/Gold (PRIMARY accent — UI, XP, ranks) === */
    --gold:      #c9892a;          /* Sun-touched bronze */
    --gold-2:    #e8a93a;          /* Brighter solar gold */
    --bronze:    #8a5a23;          /* Aged bronze */

    /* === Crimson/Blood (SECONDARY — PR, boss, combat) === */
    --crimson:   #c2342a;
    --blood:     #a81f18;
    --blood-2:   #e64a3a;          /* Brighter blood, stands out vs bronze */

    /* === Aegean (TERTIARY — sea, scout, agility, calisthenics) === */
    --aegean:    #2f8fa0;
    --aegean-2:  #4dbac8;
    --blue:      #5d97a8;          /* Now actually teal-blue */
    --blue-2:    #88c0cc;          /* Light aegean */

    /* === Royal violet (rare — king ranks, machines) === */
    --magenta:   #b03a64;          /* Wine */
    --magenta-2: #d65580;
    --royal:     #8a6acc;
    --violet:    #8a6acc;          /* alias for legacy refs */
    --indigo:    #4a5078;          /* Deep midnight */

    /* === Olive/Jade (recovery — yoga, stretching, running) === */
    --jade:      #9aa356;
    --moss:      #6f7c44;
    --olive:     #b8c266;

    /* === Metal === */
    --steel:     #c2cdd6;          /* Polished steel */
    --iron:      #6f7480;
    --bone:      #f0e8d8;          /* Warm marble white */
    --ice:       #c6d6dc;

    /* === Text — warm to match palette === */
    --text:      #f2eadc;          /* Warm marble */
    --text-dim:  #c0b59c;          /* Aged parchment (was #9aa1a8 — too cold) */
    --text-faint:#928774;          /* Faded ink (still ≥4.5:1 on warm-black) */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-text-size-adjust: 100%;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  body { background: var(--bg); background-attachment: fixed; transition: background-color 0.6s ease; }
  #root { min-height: 100vh; min-height: 100dvh; }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  /* Ambient atmosphere: the world's weather mirrors story progress. Early on the gods'
     realm is a dying storm (drifting fog + Zeus's distant lightning + gloom); as the hero
     levels up it calms, the fog thins and the lightning fades, then it clears into sunbeams
     and golden motes. Lore/copy never changes — this is purely an environmental "the world
     is healing" layer, independent of the chosen THEME palette (which only tints the
     warm/cool glow blobs below). */
  .ambient-bg {
    position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    --weather-speed: 1; --p-w: 2.5px; --p-h: 2.5px; --p-radius: 50%; --p-color: var(--ash-color); --p-glow: 3px;
    --gloom-opacity: 0.3; --rays-opacity: 0; --fog-opacity: 0; --lightning-mult: 0; --skyline-glow-opacity: 0;
    /* City skyline: ordinary flat-roofed skyscrapers of varying width/height, a couple
       with antenna spikes. Shared between the dark silhouette and its golden "lights
       coming on" glow below so both layers trace the exact same buildings. */
    --skyline-shape: polygon(
      0% 100%, 0% 50%, 5% 50%, 5% 100%, 6% 100%, 6% 65%, 13% 65%, 13% 100%, 14% 100%, 14% 40%,
      16% 40%, 16.5% 28%, 17% 40%, 20% 40%, 20% 100%, 21% 100%, 21% 75%, 27% 75%, 27% 100%,
      28% 100%, 28% 55%, 36% 55%, 36% 100%, 37% 100%, 37% 85%, 44% 85%, 44% 100%, 45% 100%,
      45% 30%, 47% 30%, 47.5% 16%, 48% 30%, 52% 30%, 52% 100%, 53% 100%, 53% 68%, 60% 68%,
      60% 100%, 61% 100%, 61% 48%, 68% 48%, 68% 100%, 69% 100%, 69% 72%, 77% 72%, 77% 100%,
      78% 100%, 78% 58%, 85% 58%, 85% 100%, 86% 100%, 86% 40%, 93% 40%, 93% 100%, 94% 100%,
      94% 62%, 100% 62%, 100% 100%
    );
  }
  .ambient-bg.weather-storm    { --weather-speed: 0.07; --p-w: 1.5px; --p-h: 26px; --p-radius: 1px; --p-color: rgba(200,218,235,0.8); --p-glow: 0px; --gloom-opacity: 0.6;  --rays-opacity: 0;    --fog-opacity: 0.55; --lightning-mult: 1;    --skyline-glow-opacity: 0; }
  .ambient-bg.weather-fading   { --weather-speed: 0.28; --p-w: 2px;   --p-h: 9px;  --p-radius: 2px; --p-color: rgba(205,215,225,0.5);  --p-glow: 1px; --gloom-opacity: 0.34; --rays-opacity: 0;    --fog-opacity: 0.26; --lightning-mult: 0.35; --skyline-glow-opacity: 0.06; }
  .ambient-bg.weather-clearing { --weather-speed: 0.7;  --p-w: 4px;   --p-h: 4px;  --p-radius: 50%; --p-color: rgba(255,255,255,0.75); --p-glow: 4px; --gloom-opacity: 0.12; --rays-opacity: 0.28; --fog-opacity: 0.08; --lightning-mult: 0;    --skyline-glow-opacity: 0.24; }
  .ambient-bg.weather-clear    { --weather-speed: 1.1;  --p-w: 2.5px; --p-h: 2.5px; --p-radius: 50%; --p-color: var(--gold-2);          --p-glow: 6px; --gloom-opacity: 0;    --rays-opacity: 0.55; --fog-opacity: 0;    --lightning-mult: 0;    --skyline-glow-opacity: 0.5; }
  .ambient-bg::before, .ambient-bg::after {
    content: ''; position: absolute; border-radius: 50%; filter: blur(70px); will-change: transform, opacity;
  }
  .ambient-bg::before {
    width: 75vmax; height: 75vmax; top: -28vmax; left: -22vmax;
    background: radial-gradient(circle, var(--ambient-a), transparent 70%);
    animation: ambient-drift-a 30s ease-in-out infinite;
  }
  .ambient-bg::after {
    width: 65vmax; height: 65vmax; bottom: -24vmax; right: -20vmax;
    background: radial-gradient(circle, var(--ambient-b), transparent 70%);
    animation: ambient-drift-b 36s ease-in-out infinite;
  }
  @keyframes ambient-drift-a { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(4vmax, 5vmax) scale(1.12); } }
  @keyframes ambient-drift-b { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-3vmax, -4vmax) scale(1.1); } }
  /* City skyline silhouette: dark and prominent always, the backdrop the hero trains
     against. */
  .ambient-skyline {
    position: absolute; left: 0; right: 0; bottom: 0; height: 30vh; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.78) 75%);
    clip-path: var(--skyline-shape);
    opacity: 0.62; filter: blur(0.4px);
  }
  /* Same skyline, lit from within with warm gold — barely an ember while the storm rages,
     a steady glow once the world has healed, as if the city's lights are coming back on. */
  .ambient-skyline-glow {
    position: absolute; left: 0; right: 0; bottom: 0; height: 30vh; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,205,130,0.65), rgba(255,170,80,0.2) 55%, transparent 82%);
    clip-path: var(--skyline-shape);
    mix-blend-mode: screen; filter: blur(1.5px);
    opacity: var(--skyline-glow-opacity); transition: opacity 1.8s ease;
  }
  /* Gloom vignette: corrupted/stormy world darkens the edges; fades to nothing once clear. */
  .gloom-overlay {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 28%, transparent 0%, rgba(4,6,8,0.85) 100%);
    opacity: var(--gloom-opacity); transition: opacity 1.4s ease;
  }
  /* Drifting fog banks crossing the realm — thick and slow while the world is corrupted,
     thinning to nothing once it heals. Reads as atmosphere, not a UI artifact. */
  .fog-layer {
    position: absolute; inset: -15% -25%; pointer-events: none; filter: blur(26px);
    background:
      linear-gradient(98deg, transparent 0%, rgba(180,190,205,0.5) 18%, transparent 34%),
      linear-gradient(98deg, transparent 50%, rgba(150,165,185,0.4) 66%, transparent 82%);
    background-size: 160% 160%;
    animation: fog-drift 42s linear infinite;
    opacity: var(--fog-opacity); transition: opacity 1.8s ease;
  }
  @keyframes fog-drift { from { background-position: 0% 0%, 0% 0%; } to { background-position: -140% 30%, -120% -20%; } }
  /* Zeus's distant wrath: a soft double-flash that flickers low on the horizon while the
     world is still a storm, then dies out entirely once it calms — no harsh strobing. */
  .lightning-flash {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
    background: radial-gradient(circle at 72% 20%, rgba(215,228,255,0.95), transparent 55%);
    animation: lightning-strike 11s ease-in-out infinite;
  }
  @keyframes lightning-strike {
    0%, 36%, 39%, 41%, 100% { opacity: 0; }
    37%   { opacity: calc(0.85 * var(--lightning-mult)); }
    37.6% { opacity: calc(0.1 * var(--lightning-mult)); }
    38.2% { opacity: calc(0.6 * var(--lightning-mult)); }
  }
  /* Sunbeams: only meaningfully visible once the storm has cleared (high tier). */
  .rays-layer {
    position: absolute; inset: -30%; pointer-events: none; mix-blend-mode: screen;
    background: repeating-conic-gradient(from 0deg at 50% -10%, rgba(255,221,150,0.11) 0deg 4deg, transparent 4deg 18deg);
    animation: rays-rotate 110s linear infinite;
    opacity: var(--rays-opacity); transition: opacity 1.4s ease;
  }
  @keyframes rays-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  /* Weather particles: thin sleet motes early on, fattening into snow/mist, then
     into slow golden fireflies once the world is calm — same 14 spans, different costume. */
  .embers { position: absolute; inset: 0; }
  .embers span {
    position: absolute; top: -10px; width: var(--p-w); height: var(--p-h); border-radius: var(--p-radius);
    background: var(--p-color); box-shadow: 0 0 var(--p-glow) 0.5px var(--p-color); opacity: 0;
    animation: ash-fall linear infinite; transition: width 1s ease, height 1s ease, background 1s ease;
  }
  @keyframes ash-fall {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.55; }
    90% { opacity: 0.2; }
    100% { transform: translateY(100vh) translateX(var(--drift, 20px)) rotate(40deg); opacity: 0; }
  }
  .embers span:nth-child(1)  { left: 4%;  animation-duration: calc(17s * var(--weather-speed)); animation-delay: 0s;   --drift: 18px; }
  .embers span:nth-child(2)  { left: 12%; animation-duration: calc(21s * var(--weather-speed)); animation-delay: 3s;   --drift: -24px; }
  .embers span:nth-child(3)  { left: 21%; animation-duration: calc(15s * var(--weather-speed)); animation-delay: 7s;   --drift: 14px; }
  .embers span:nth-child(4)  { left: 30%; animation-duration: calc(24s * var(--weather-speed)); animation-delay: 1s;   --drift: -16px; }
  .embers span:nth-child(5)  { left: 39%; animation-duration: calc(19s * var(--weather-speed)); animation-delay: 9s;   --drift: 22px; }
  .embers span:nth-child(6)  { left: 48%; animation-duration: calc(23s * var(--weather-speed)); animation-delay: 4s;   --drift: -20px; }
  .embers span:nth-child(7)  { left: 57%; animation-duration: calc(16s * var(--weather-speed)); animation-delay: 11s;  --drift: 16px; }
  .embers span:nth-child(8)  { left: 65%; animation-duration: calc(25s * var(--weather-speed)); animation-delay: 2s;   --drift: -18px; }
  .embers span:nth-child(9)  { left: 73%; animation-duration: calc(18s * var(--weather-speed)); animation-delay: 13s;  --drift: 20px; }
  .embers span:nth-child(10) { left: 81%; animation-duration: calc(22s * var(--weather-speed)); animation-delay: 6s;   --drift: -14px; }
  .embers span:nth-child(11) { left: 89%; animation-duration: calc(20s * var(--weather-speed)); animation-delay: 10s;  --drift: 18px; }
  .embers span:nth-child(12) { left: 96%; animation-duration: calc(26s * var(--weather-speed)); animation-delay: 0.5s; --drift: -22px; }
  .embers span:nth-child(13) { left: 55%; animation-duration: calc(14s * var(--weather-speed)); animation-delay: 15s;  --drift: 12px; }
  .embers span:nth-child(14) { left: 17%; animation-duration: calc(27s * var(--weather-speed)); animation-delay: 5s;   --drift: -12px; }
  @media (prefers-reduced-motion: reduce) {
    .ambient-bg::before, .ambient-bg::after, .embers span, .rays-layer, .fog-layer, .lightning-flash { animation: none; }
  }
  .font-display { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: -0.005em; font-weight: 700; }
  .font-ui      { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  .font-rune    { font-family: 'Cinzel', 'Inter', serif; }
  .font-saga    { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; letter-spacing: 0.05em; }
  .carved { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .carved-blood { border-color: rgba(184, 38, 28, 0.35); }
  .carved-iron  { border-color: rgba(106, 114, 128, 0.35); }
  .knot-divider { height: 1px; background: var(--line); margin: 8px 0; }
  .glow-gold   { box-shadow: 0 1px 0 rgba(201, 137, 42, 0.30) inset, 0 4px 12px rgba(201, 137, 42, 0.18); }
  .glow-blood  { box-shadow: 0 1px 0 rgba(201, 137, 42, 0.30) inset, 0 4px 12px rgba(201, 137, 42, 0.18); }
  .glow-iron   { box-shadow: 0 1px 0 rgba(106, 114, 128, 0.2) inset, 0 4px 12px rgba(0,0,0,0.18); }
  .text-glow-gold  { color: var(--gold); }
  .text-glow-blood { color: var(--crimson); }
  @keyframes pulse-glow { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.65; } }
  .pulse-glow { animation: pulse-glow 3.2s ease-in-out infinite; }
  @keyframes two-step-swing { 0%, 100% { transform: rotate(-16deg) scale(1); } 50% { transform: rotate(16deg) scale(1.12); } }
  .two-step-anim { display: inline-block; animation: two-step-swing 1.1s ease-in-out infinite; transform-origin: center; }
  @keyframes float-up { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-80px); opacity: 0; } }
  @keyframes flicker { 0%, 100% { opacity: 1; } 45% { opacity: 1; } 50% { opacity: 0.4; } 55% { opacity: 1; } }
  .flicker { animation: flicker 3.2s infinite; }
  @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spin-slow { animation: spin-slow 24s linear infinite; }
  @keyframes rise { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .rise { animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
  @keyframes shockwave { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(4); opacity: 0; } }
  @keyframes burst { 0% { transform: scale(0.5); opacity: 0; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .burst { animation: burst 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
  @keyframes ember { 0% { transform: translateY(0) scale(1); opacity: 0.9; } 100% { transform: translateY(-40px) scale(0.4); opacity: 0; } }
  @keyframes shine { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  @keyframes orbit { 0% { transform: rotate(0deg) translateX(36px) rotate(0deg); } 100% { transform: rotate(360deg) translateX(36px) rotate(-360deg); } }
  button { font-family: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  .btn {
    font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; letter-spacing: 0.01em; padding: 12px 22px;
    background: linear-gradient(180deg, #1c1f22, #141619); border: 1px solid rgba(201, 137, 42, 0.45); border-radius: 8px;
    color: var(--gold-2); cursor: pointer; position: relative; font-size: 14px;
    min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  @media (hover: hover) and (pointer: fine) { .btn:hover { background: linear-gradient(180deg, #25292d, #1c1f22); border-color: var(--gold); } }
  .btn:active { background: linear-gradient(180deg, #0f1113, #0a0c0d); border-color: var(--gold); }
  .btn-blood { background: linear-gradient(180deg, #3a1714, #271010); border-color: rgba(201, 137, 42, 0.55); color: #e0635a; }
  @media (hover: hover) and (pointer: fine) { .btn-blood:hover { background: linear-gradient(180deg, #4a1c18, #321411); border-color: var(--crimson); } }
  .btn-blood:active { background: linear-gradient(180deg, #271010, #19090a); border-color: var(--crimson); }
  .btn-iron { background: transparent; border: 1px solid rgba(158, 166, 173, 0.35); color: var(--text-dim); }
  @media (hover: hover) and (pointer: fine) { .btn-iron:hover { color: var(--text); border-color: var(--text-dim); } }
  .btn-iron:active { color: var(--text); border-color: var(--text-dim); background: rgba(232, 220, 192, 0.04); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .panel-strong { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; }
  .card {
    display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; color: inherit; cursor: pointer; transition: border-color 0.18s ease, background 0.18s ease; font-family: inherit;
  }
  @media (hover: hover) and (pointer: fine) { .card:hover { border-color: rgba(201, 137, 42, 0.5); background: var(--panel-2); } }
  .card:active { border-color: rgba(201, 137, 42, 0.6); background: var(--panel-2); }
  input[type="number"], input[type="text"] {
    background: rgba(0, 0, 0, 0.5); border: 1px solid var(--line); color: var(--text); padding: 10px 14px;
    font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; outline: none; width: 100%; text-align: center;
    letter-spacing: 0.05em; -webkit-appearance: none; appearance: none; border-radius: 0;
  }
  input[type="number"]:focus, input[type="text"]:focus { border-color: var(--gold); box-shadow: 0 0 12px rgba(201, 137, 42, 0.35); }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  .container-app { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; position: relative; z-index: 10; padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
  .safe-top { padding-top: env(safe-area-inset-top); }
  .nav-bottom {
    position: fixed; bottom: 0; left: 0; right: 0; margin: 0 auto; max-width: 480px;
    background: linear-gradient(180deg, rgba(11, 12, 14, 0.82), rgba(11, 12, 14, 0.98) 30%);
    backdrop-filter: blur(10px); border-top: 1px solid var(--line-2);
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom)); z-index: 50; display: flex; overflow: hidden;
  }
  .nav-indicator { position: absolute; top: 0; left: 0; height: 2px; background: var(--gold); transition: transform 0.28s cubic-bezier(0.3, 0.9, 0.3, 1); will-change: transform; }
  .nav-btn {
    flex: 1; background: transparent; border: none; color: var(--text-faint); padding: 14px 4px 12px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.01em;
    transition: color 0.18s; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }

function urlBase64ToUint8Array(base64) {
  const padded = (base64 + '='.repeat((4 - (base64.length % 4)) % 4)).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(padded);
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

async function subscribeToReminders(licenseKey) {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return { ok: false, reason: 'unsupported' };
  const permission = await Notification.requestPermission();
  if (permission !== 'granted') return { ok: false, reason: 'denied' };
  const reg = await navigator.serviceWorker.ready;
  const subscription = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
  });
  const r = await api('/api/push-subscribe', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: licenseKey, subscription: subscription.toJSON() }),
  });
  return { ok: !!r };
}

async function api(path, opts) {
  if (!PANTHEON_PLUS_API || PANTHEON_PLUS_API.includes('YOUR-SUBDOMAIN')) return null;
  try {
    const res = await fetch(`${PANTHEON_PLUS_API}${path}`, opts);
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}

const storage = {
  async get(key) {
    try { if (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function') { try { const r = await window.storage.get(key); return r ? r.value : null; } catch { return null; } } } catch {}
    try { return localStorage.getItem(key); } catch { return null; }
  },
  async set(key, value) {
    try { if (typeof window !== 'undefined' && window.storage && typeof window.storage.set === 'function') { try { await window.storage.set(key, value); return; } catch {} } } catch {}

  }
};

function getExerciseById(exId) {
  for (const c of EXERCISE_CATEGORIES) { for (const e of c.exercises) if (e.id === exId) return { exercise: e, category: c }; }
  return null;
}

function formatTimePR(seconds) {
  if (!seconds || seconds <= 0) return '—';
  if (seconds < 60) return `${seconds.toFixed(1)}s`;
  if (seconds < 3600) { const m = Math.floor(seconds / 60); const s = Math.round(seconds % 60); return `${m}:${s.toString().padStart(2, '0')}`; }
  const h = Math.floor(seconds / 3600); const m = Math.floor((seconds % 3600) / 60); const s = Math.round(seconds % 60);
  return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

function getISOWeek(d = new Date()) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  const weekNo = Math.ceil(((date - yearStart) / 86400000 + 1)/7);
  return `${date.getUTCFullYear()}-W${weekNo}`;
}

function getWeeklyQuests() {
  const week = getISOWeek();
  let seed = 0; for (const c of week) seed = (seed * 31 + c.charCodeAt(0)) & 0xffffffff;
  const pool = [...QUEST_POOL];
  const rng = () => { seed = (seed * 1664525 + 1013904223) & 0xffffffff; return ((seed >>> 0) / 0xffffffff); };
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  return pool.slice(0, 3);
}

function computeStats(state) {
  const lvl = state.level || 1;
  const base = 10 + lvl * 2;
  let str = base, agi = base, vit = base;
  if (state.class === 'strength') str = Math.floor(base * 1.5);
  if (state.class === 'speed')    agi = Math.floor(base * 1.5);
  if (state.class === 'hybrid') { str = Math.floor(base * 1.2); agi = Math.floor(base * 1.2); vit = Math.floor(base * 1.2); }
  const totalVolume = (state.stats?.totalVolume) || 0;
  const totalPulls  = (state.stats?.totalPulls) || 0;
  const totalRun    = (state.stats?.totalRunMinutes) || 0;
  str += Math.floor(totalVolume / 1000);
  agi += Math.floor(totalPulls / 20) + Math.floor(totalRun / 30);
  vit += Math.floor((state.workoutsCompleted || 0) / 3);
  return { STR: str, AGI: agi, VIT: vit };
}

function Toast({ message, type, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 2400); return () => clearTimeout(t); }, [onClose]);
  return <div className={`toast ${type || ''}`}>{message}</div>;
}

        if (validTimes.length > 0) { const best = Math.max(...validTimes); const prev = prs[exercise.id]?.value;
          if (!prev || best > prev) { prValue = best; prDetail = `${best.toFixed(1)} s`; prHit = !!prev; prs[exercise.id] = { value: best, detail: prDetail, date: todayStr, ts: Date.now(), manual: false }; } }
      } else if (exercise.weighted) {
        const validSets = payload.sets.filter(x => Number(x.weight) > 0 && Number(x.reps) > 0);
        if (validSets.length > 0) { const bestSet = validSets.reduce((a, b) => Number(a.weight) > Number(b.weight) ? a : b); const w = Number(bestSet.weight); const r = Number(bestSet.reps); const prev = prs[exercise.id]?.value;
          if (!prev || w > prev) { prValue = w; prDetail = `${w} kg × ${r}`; prHit = !!prev; prs[exercise.id] = { value: w, detail: prDetail, date: todayStr, ts: Date.now(), manual: false }; } }
      } else {
        const validSets = payload.sets.filter(x => Number(x.reps) > 0);
        if (validSets.length > 0) { const bestReps = Math.max(...validSets.map(x => Number(x.reps))); const prev = prs[exercise.id]?.value;
          if (!prev || bestReps > prev) { prValue = bestReps; prDetail = `${bestReps} reps`; prHit = !!prev; prs[exercise.id] = { value: bestReps, detail: prDetail, date: todayStr, ts: Date.now(), manual: false }; } }
      }

      if (payload.markAsPR && !prHit) {
        let v = 0, d = '';
        if (category.id === 'running') { const t = payload.sets.map(x => Number(x.time)).filter(t => t > 0); if (t.length) { v = Math.min(...t); d = formatTimePR(v); } }
        else if (exercise.timed) { const t = payload.sets.map(x => Number(x.time)).filter(t => t > 0); if (t.length) { v = Math.max(...t); d = `${v.toFixed(1)} s`; } }
        else if (exercise.weighted) { const vs = payload.sets.filter(x => Number(x.weight) > 0 && Number(x.reps) > 0); if (vs.length) { const b = vs.reduce((a, b) => Number(a.weight) > Number(b.weight) ? a : b); v = Number(b.weight); d = `${v} kg × ${Number(b.reps)}`; } }
        else { const vs = payload.sets.filter(x => Number(x.reps) > 0); if (vs.length) { v = Math.max(...vs.map(x => Number(x.reps))); d = `${v} reps`; } }
        if (v > 0) { prs[exercise.id] = { value: v, detail: d, date: todayStr, ts: Date.now(), manual: true }; prHit = true; prValue = v; prDetail = d; }
      }

      // ===== Quest progress + completion detection =====
      const questProgress = { ...s.questProgress };
      const quests = getWeeklyQuests();
      let completionBonus = 0;
      const completedQuests = [];
      quests.forEach(q => {
        const cur = questProgress[q.id] || 0;
        let next = cur;
        if (q.metric === 'workouts') { if (isNewSessionDay) next = cur + 1; }
        else if (q.metric === 'volume' && category.id !== 'running') next = cur + totalKg;
        else if (q.metric === 'reps_cali' && category.id === 'calisthenics') next = cur + totalReps;
        else if (q.metric === 'minutes_run' && category.id === 'running') next = cur + (totalSeconds / 60);
        else if (q.metric === 'pulls' && ['pullup','wpullup','muscleup','wmuscleup'].includes(exercise.id)) next = cur + totalReps;
        else if (q.metric === 'distance' && category.id === 'running') next = cur + distanceM;
        else if (q.metric === 'streak') next = streak;
        else if (q.metric === 'pr' && prHit) next = cur + 1; // q7 'A New Legend' was unreachable before
        questProgress[q.id] = next;
        // Target crossing → pay the promised XP exactly once
        if (cur < q.target && next >= q.target) {
          completionBonus += q.xp;
          completedQuests.push(q);
        }
      });

      // ===== Boss progress + completion detection =====
      const boss = getWeeklyBoss();
      const prevBoss = s.bossProgress || 0;
      let bossProgress = prevBoss;
      if (boss.metric === 'pulls' && ['pullup','wpullup','muscleup','wmuscleup'].includes(exercise.id)) bossProgress += totalReps;
      else if (boss.metric === 'pushpulls' && ['pullup','wpullup','muscleup','wmuscleup','dip','wdip','pushup'].includes(exercise.id)) bossProgress += totalReps;
      else if (boss.metric === 'distance' && category.id === 'running') bossProgress += distanceM;
      else if (boss.metric === 'workouts') { if (isNewSessionDay) bossProgress += 1; }
      let bossSlain = false;
      if (prevBoss < boss.target && bossProgress >= boss.target) {
        completionBonus += boss.reward;
        bossSlain = true;
      }

      const mult = xpMultiplier(streak) * (s.premium ? (1 + PREMIUM_XP_BONUS) : 1);
      const prBonus = prHit ? 75 : 0;
      const xpFinal = Math.floor(xpGained * mult) + prBonus + completionBonus;
      const history = [{ date: todayStr, time: today.toISOString(), exerciseId: exercise.id, exerciseName: exercise.name, categoryId: category.id, sets: payload.sets, xp: xpFinal, totalReps, totalKg, totalSeconds, distanceM, prHit }, ...s.history].slice(0, 50);

      // ===== Sequential toasts: base XP → PR → quests → boss =====
      setTimeout(() => awardXP(xpFinal), 80);
      let toastDelay = 120;
      const queueToast = (msg, type) => { setTimeout(() => showToast(msg, type), toastDelay); toastDelay += 2500; };
      queueToast(`+${xpFinal} XP — STREAK ${streak}`, 'success');
      if (prHit) queueToast(`★ NEW PR! ${exercise.name.toUpperCase()} → ${prDetail} (+${prBonus})`, 'warn');
      completedQuests.forEach(q => {
        const title = (s.mode === 'story' && q.storyTitle) ? q.storyTitle : q.title;
        queueToast(`✓ QUEST DONE: ${title.toUpperCase()} +${q.xp} XP`, 'warn');
      });
      if (bossSlain) {
        const bname = (s.mode === 'story' && boss.storyName) ? boss.storyName : boss.name;
        queueToast(`☠ ${bname} SLAIN — +${boss.reward} XP`, 'danger');
      }

      const newWorkoutsCompleted = isNewSessionDay ? (s.workoutsCompleted || 0) + 1 : (s.workoutsCompleted || 0);
      return { ...s, streak, lastWorkoutDate: today.toISOString(), workoutsCompleted: newWorkoutsCompleted, workoutDates, stats: { ...s.stats, totalVolume, totalPulls, totalRunMinutes: totalRunMin, totalDistance: totalDist, prs }, questProgress, bossProgress, history };
    });
  }

  if (!loaded) return <LoadingScreen />;

  if (!state.ready) {
    if (state.step === 'intro')    return <IntroScreen onAwaken={() => update({ step: 'consent' })} />;
    if (state.step === 'consent')  return <ConsentScreen onBack={() => update({ step: 'intro' })} onAccept={(consent) => update({ consent, step: 'name' })} />;
    if (state.step === 'name')     return <NameScreen initial={state.name} onSubmit={(n) => update({ name: n, step: 'gender' })} />;
    if (state.step === 'gender')   return <GenderScreen onSelect={(g) => update({ gender: g, step: 'hair' })} onBack={() => update({ step: 'name' })} />;
    if (state.step === 'hair')     return <HairScreen onSelect={(h) => update({ hair: h, step: 'eye' })} onBack={() => update({ step: 'gender' })} />;
    if (state.step === 'eye')      return <EyeScreen onSelect={(e) => update({ eye: e, step: 'class' })} onBack={() => update({ step: 'hair' })} />;
    if (state.step === 'class')    return <ClassScreen onSelect={(c) => update({ class: c, step: 'freq' })} onBack={() => update({ step: 'eye' })} />;
    if (state.step === 'freq')     return <FreqScreen onSelect={(f) => update({ frequency: f, step: 'goal' })} onBack={() => update({ step: 'class' })} />;
    if (state.step === 'goal')     return <GoalScreen onSubmit={({ goal, kg }) => { const week = getISOWeek(); update({ goal, weightLog: kg > 0 ? [{ week, date: new Date().toISOString().slice(0,10), kg }] : [], lastWeightWeek: kg > 0 ? week : null, step: 'creating' }); }} onBack={() => update({ step: 'freq' })} />;
    if (state.step === 'creating') return <CreatingScreen state={state} onDone={() => update({ ready: true, step: 'done', hub: 'hub', firstReveal: true })} />;
  }

  const worldTier = avatarTierFor(state.level || 1);
  const weatherClass = worldTier <= 1 ? 'weather-storm' : worldTier <= 3 ? 'weather-fading' : worldTier === 4 ? 'weather-clearing' : 'weather-clear';

  return (
    <>
      <div className={`ambient-bg ${weatherClass}`} aria-hidden="true">
        <div className="gloom-overlay" />
        <div className="fog-layer" />
        <div className="lightning-flash" />
        <div className="rays-layer" />
        <div className="ambient-skyline" />
        <div className="ambient-skyline-glow" />
        <div className="embers">{Array.from({ length: 14 }, (_, i) => <span key={i} />)}</div>
      </div>
      <div className="container-app">
        {state.hub === 'hub'     && <HubScreen state={state} onGoto={(t) => update({ hub: t })} onOpenPaywall={() => setShowPaywall(true)} />}
        {state.hub === 'train'   && (() => {
          const customCats = state.customCategories || [];
          const resolveCustomCat = (cc) => cc && { ...cc, exercises: (cc.exerciseIds || []).map(id => getExerciseById(id)?.exercise).filter(Boolean) };
          if (view.screen === 'logger') {
            return <ExerciseLogger exerciseId={view.data.exerciseId} categoryId={view.data.categoryId} currentPR={state.stats?.prs?.[view.data.exerciseId]} onCancel={() => setView(view.data.returnTo || { screen: null })} onSave={(payload) => { logWorkout(payload); setView({ screen: null }); update({ hub: 'hub' }); }} />;
          }
          if (view.screen === 'exercises') {
            return <ExerciseList categoryId={view.data.categoryId} onPick={(exerciseId) => setView({ screen: 'logger', data: { exerciseId, categoryId: view.data.categoryId, returnTo: { screen: 'exercises', data: { categoryId: view.data.categoryId } } } })} onBack={() => setView({ screen: null })} />;
          }
          if (view.screen === 'category-new') {
            return <CreateCategoryScreen onConfirm={(ids, name) => { const cat = { id: `cat_${Date.now()}`, name, rune: '✦', color: 'var(--blue-2)', exerciseIds: ids }; update({ customCategories: [...customCats, cat] }); setView({ screen: null }); showToast('CATEGORY CREATED', 'success'); }} onBack={() => setView({ screen: null })} />;
          }
          if (view.screen === 'category-edit') {
            const cat = customCats.find(c => c.id === view.data.categoryId);
            if (!cat) return null;
            return <CreateCategoryScreen editing initial={cat.exerciseIds} initialName={cat.name} onConfirm={(ids, name) => { update({ customCategories: customCats.map(c => c.id === cat.id ? { ...c, name, exerciseIds: ids } : c) }); setView({ screen: 'category-detail', data: { categoryId: cat.id } }); showToast('CATEGORY SAVED', 'success'); }} onDelete={() => { update({ customCategories: customCats.filter(c => c.id !== cat.id) }); setView({ screen: null }); showToast('CATEGORY DELETED', 'success'); }} onBack={() => setView({ screen: 'category-detail', data: { categoryId: cat.id } })} />;
          }
          if (view.screen === 'category-detail') {
            const cat = resolveCustomCat(customCats.find(c => c.id === view.data.categoryId));
            if (!cat) return null;
            return <CustomCategoryDetail category={cat} onPick={(exerciseId) => setView({ screen: 'logger', data: { exerciseId, categoryId: cat.id, returnTo: { screen: 'category-detail', data: { categoryId: cat.id } } } })} onEdit={() => setView({ screen: 'category-edit', data: { categoryId: cat.id } })} onBack={() => setView({ screen: null })} />;
          }
          return <TrainScreen state={state} onPickCategory={(catId) => setView({ screen: 'exercises', data: { categoryId: catId } })} onPickExercise={(exerciseId, categoryId) => setView({ screen: 'logger', data: { exerciseId, categoryId, returnTo: { screen: null } } })} onPickCustomCategory={(catId) => setView({ screen: 'category-detail', data: { categoryId: catId } })} onCreateCategory={() => setView({ screen: 'category-new' })} />;
        })()}
        {state.hub === 'tasks'   && <TasksScreen state={state} />}
        {state.hub === 'pr'      && <PRBoardScreen state={state} />}
        {state.hub === 'profile' && <ProfileScreen state={state} onChangeClass={(c) => { update({ class: c }); showToast('PATH CHANGED', 'success'); }} onChangeGoal={(g) => { update({ goal: g }); showToast('GOAL CHANGED', 'success'); }} onGotoTrain={() => { setView({ screen: null }); update({ hub: 'train' }); }} onLogWeight={() => setShowWeighIn(true)} onReset={async () => { await storage.set('jomsviking_state_v1', JSON.stringify(DEFAULT_STATE)); setState(DEFAULT_STATE); }} onOpenPaywall={() => setShowPaywall(true)} onBackupNow={backupNow} onRestoreBackup={restoreBackup} onRestoreCode={restoreWithCode} onShowToast={showToast} onChangeTheme={(id) => { update({ theme: id }); showToast(`THEME: ${id.toUpperCase()}`, 'success'); }} />}
        <BottomNav active={state.hub} onChange={(t) => { setView({ screen: null }); update({ hub: t }); }} />
      </div>
      {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
      {levelUpAnim && <LevelUpOverlay {...levelUpAnim} state={state} onClose={() => setLevelUpAnim(null)} />}
      {state.firstReveal && state.ready && <WallBreakIntro state={state} onDone={() => update({ firstReveal: false })} />}
      {showWeighIn && state.ready && <WeightCheckIn state={state} onSubmit={logWeight} onSkip={skipWeighIn} />}
      {storyReveal && state.ready && <StoryReveal beat={storyReveal} onClose={() => markBeatSeen(storyReveal.id)} />}
      {showPaywall && <PaywallModal state={state} onClose={() => setShowPaywall(false)} onCheckout={startCheckout} onRestoreCode={restoreWithCode} />}
    </>
  );
}

function CreateCategoryScreen({ initial, initialName, onConfirm, onBack, onDelete, editing }) {
  const [phase, setPhase] = useState(initialName ? 'pick' : 'name');
  const [catName, setCatName] = useState(initialName || '');
  const [selected, setSelected] = useState(() => new Set(initial || []));
  const [openCat, setOpenCat] = useState(null);
  function toggle(id) { setSelected(prev => { const next = new Set(prev); if (next.has(id)) next.delete(id); else next.add(id); return next; }); }
  const count = selected.size;

  if (phase === 'name') {
    return (
      <CreateCategoryNameScreen
        initialName={catName}
        onBack={onBack}
        onSubmit={(n) => { setCatName(n); setPhase('pick'); }}
        editing={editing}
      />
    );
  }

  return (
    <div className="container-app">
      <div style={{ padding: '24px 20px 16px' }} className="safe-top">
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
          <button type="button" className="btn btn-iron" onClick={onBack} style={{ padding: '6px 14px', fontSize: 11 }}>◂ BACK</button>
          <div className="font-display" style={{ fontSize: 10, color: 'var(--text-faint)', letterSpacing: '0.02em' }}>SELECTED {count}</div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
          <div className="font-display" style={{ fontSize: 22, fontWeight: 900, color: 'var(--gold)', letterSpacing: '0.02em' }}>{catName.toUpperCase()}</div>
          <button type="button" className="btn btn-iron" onClick={() => setPhase('name')} style={{ padding: '4px 10px', fontSize: 11 }}>✎ RENAME</button>
          {editing && onDelete && (
            <button type="button" className="btn btn-iron" onClick={() => { if (window.confirm('Delete this category? Your exercise history stays untouched.')) onDelete(); }} style={{ padding: '4px 10px', fontSize: 11, color: 'var(--blood-2)' }}>🗑 DELETE</button>
          )}
        </div>
        <div className="font-ui" style={{ fontSize: 14, color: 'var(--text-dim)', marginTop: 6, fontStyle: 'italic' }}>Pick the exercises you want on hand.</div>
      </div>
      <div style={{ padding: '8px 20px 190px', display: 'flex', flexDirection: 'column', gap: 10 }}>
        {EXERCISE_CATEGORIES.map((c) => {
          const open = openCat === c.id;
          const picked = c.exercises.filter(e => selected.has(e.id)).length;
          return (
            <div key={c.id} className="panel" style={{ overflow: 'hidden', borderLeft: `3px solid ${c.color}` }}>
              <button type="button" onClick={() => setOpenCat(open ? null : c.id)} style={{ width: '100%', background: 'transparent', border: 'none', padding: '14px 16px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 12, textAlign: 'left' }}>
                <div className="font-rune" style={{ fontSize: 24, color: c.color, width: 28, textAlign: 'center' }}>{c.rune}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 15, color: 'var(--text)', fontWeight: 600 }}>{c.name.charAt(0) + c.name.slice(1).toLowerCase()}</div>
                  <div className="font-ui" style={{ fontSize: 11, color: 'var(--text-faint)', marginTop: 2 }}>{picked > 0 ? `${picked} selected · ` : ''}{c.exercises.length} exercises</div>
                </div>
                <div style={{ color: c.color, fontSize: 16, transform: open ? 'rotate(90deg)' : 'none', transition: 'transform 0.2s' }}>›</div>
              </button>
              {open && (
                <div style={{ padding: '0 12px 12px', display: 'flex', flexDirection: 'column', gap: 6 }}>
                  {c.exercises.map(e => {
                    const on = selected.has(e.id);
                    return (
                      <button key={e.id} type="button" onClick={() => toggle(e.id)} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', borderRadius: 6, cursor: 'pointer', textAlign: 'left', background: on ? 'rgba(190,44,36,0.12)' : 'rgba(0,0,0,0.25)', border: `1px solid ${on ? c.color : 'var(--line)'}` }}>
                        <div style={{ width: 20, height: 20, borderRadius: 4, flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', border: `1px solid ${on ? c.color : 'var(--line-2)'}`, background: on ? c.color : 'transparent', color: '#0b0c0d', fontSize: 13, fontWeight: 900 }}>{on ? '✓' : ''}</div>
                        <span className="font-rune two-step-anim" style={{ fontSize: 16, color: c.color, width: 18, textAlign: 'center' }}>{e.sigil}</span>
                        <span style={{ flex: 1, fontSize: 14, color: on ? 'var(--text)' : 'var(--text-dim)' }}>{e.name}</span>
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>

      </div>
    </div>
  );
}

function WeightCheckIn({ state, onSubmit, onSkip }) {
  const [kg, setKg] = useState('');
  const w = Number(kg);
  const valid = w > 20 && w < 400;
  const log = state.weightLog || [];
  const last = log.length > 0 ? log[log.length - 1] : null;
  const goal = state.goal || 'maintain';
  let delta = null, verdict = null, verdictColor = 'var(--text-dim)';
  if (last && valid) {
    delta = w - last.kg; const d = delta;
    if (goal === 'gain') {
      if (d > 0.1) { verdict = 'Gaining — right direction!'; verdictColor = 'var(--jade)'; }
      else if (d < -0.1) { verdict = 'Losing — add calories'; verdictColor = 'var(--crimson)'; }
      else { verdict = 'Stalled — push harder'; verdictColor = 'var(--gold)'; }
    } else if (goal === 'lose') {
      if (d < -0.1) { verdict = 'Losing — right direction!'; verdictColor = 'var(--jade)'; }
      else if (d > 0.1) { verdict = 'Gaining — hold the diet'; verdictColor = 'var(--crimson)'; }
      else { verdict = 'Stalled — cut a little'; verdictColor = 'var(--gold)'; }
    } else {
      if (Math.abs(d) <= 0.5) { verdict = 'Holding steady — great!'; verdictColor = 'var(--jade)'; }
      else if (d > 0.5) { verdict = 'Slight gain'; verdictColor = 'var(--gold)'; }
      else { verdict = 'Slight loss'; verdictColor = 'var(--gold)'; }
    }
  }
  const goalLabel = GOALS.find(g => g.id === goal)?.label || '—';
  return (
    <div className="levelup-overlay" style={{ background: 'radial-gradient(circle at center, rgba(201,137,42,0.32), rgba(11,12,14,0.96) 70%)' }}>
      <div className="panel-strong carved" style={{ padding: '28px 24px', maxWidth: 360, width: '90%', textAlign: 'center' }}>
        <div className="font-rune pulse-glow" style={{ fontSize: 48, color: 'var(--gold)', lineHeight: 1 }}>Λ</div>
        <div className="font-display" style={{ fontSize: 22, color: 'var(--gold)', fontWeight: 900, letterSpacing: '0.02em', marginTop: 12 }}>WEEKLY WEIGH-IN</div>
        <div className="font-ui" style={{ fontSize: 14, color: 'var(--text-dim)', marginTop: 6, fontStyle: 'italic' }}>Goal: <span style={{ color: 'var(--gold-2)' }}>{goalLabel}</span></div>
        {last && (<div className="font-ui" style={{ fontSize: 13, color: 'var(--text-faint)', marginTop: 10 }}>Last time ({last.date.replace(/-/g,'.')}): <span style={{ color: 'var(--text)', fontWeight: 700 }}>{last.kg} kg</span></div>)}
        <div style={{ marginTop: 16 }}>
          <input type="number" inputMode="decimal" value={kg} onChange={(e) => setKg(e.target.value)} placeholder="kg" min="20" max="400" step="0.1" autoFocus style={{ fontSize: 30 }} />
        </div>
        {delta !== null && (
          <div style={{ marginTop: 14 }}>
            <div className="font-display" style={{ fontSize: 26, fontWeight: 900, color: verdictColor }}>{delta > 0 ? '+' : ''}{delta.toFixed(1)} kg</div>
            <div className="font-ui" style={{ fontSize: 14, color: verdictColor, marginTop: 2, fontWeight: 600 }}>{verdict}</div>
          </div>
        )}
        <button type="button" className="btn glow-gold" onClick={() => valid && onSubmit(w)} disabled={!valid} style={{ width: '100%', fontSize: 14, padding: '14px', opacity: valid ? 1 : 0.4, marginTop: 18 }}>✓ LOG WEIGHT</button>
        <button type="button" className="btn btn-iron" onClick={onSkip} style={{ width: '100%', padding: '10px', fontSize: 12, marginTop: 8 }}>SKIP THIS WEEK</button>
      </div>
    </div>
  );
}

function ExerciseLogger({ exerciseId, categoryId, currentPR, onCancel, onSave }) {
  const info = getExerciseById(exerciseId);
  if (!info) return null;
  const { exercise, category } = info;
  const isTimed = !!exercise.timed;
  const [sets, setSets] = useState([{ reps: '', weight: '', time: '' }]);
  const [timerRunning, setTimerRunning] = useState(false);
  const [timerValue, setTimerValue] = useState(0);
  const [timerSetIdx, setTimerSetIdx] = useState(null);
  const [markAsPR, setMarkAsPR] = useState(false);
  const timerRef = useRef(null);
  // Timestamp-based stopwatch — no drift when backgrounded, and the start time is mirrored to
  // localStorage so the elapsed time survives iOS suspending/reloading the WebView while away.
  const timerStartRef = useRef(0);
  const timerBaseRef = useRef(0);
  const timerStorageKey = `sparta_timer_${exerciseId}`;
  function persistTimer(setIdx) {
    try { window.localStorage.setItem(timerStorageKey, JSON.stringify({ base: timerBaseRef.current, startedAt: timerStartRef.current, setIdx })); } catch {}
  }
  function clearPersistedTimer() {
    try { window.localStorage.removeItem(timerStorageKey); } catch {}
  }
  // Restore a timer that was still running when the app got suspended/backgrounded
  useEffect(() => {
    try {
      const raw = window.localStorage.getItem(timerStorageKey);
      if (raw) {
        const saved = JSON.parse(raw);
        timerBaseRef.current = saved.base + (Date.now() - saved.startedAt) / 1000;
        setTimerSetIdx(saved.setIdx);
        setTimerValue(timerBaseRef.current);
        setTimerRunning(true);
      }
    } catch {}
  }, []);
  useEffect(() => {
    if (timerRunning) {
      timerStartRef.current = Date.now();
      const tick = () => {
        const elapsed = timerBaseRef.current + (Date.now() - timerStartRef.current) / 1000;
        setTimerValue(elapsed);
      };
      tick();
      timerRef.current = setInterval(tick, 100);
      // Force an immediate recompute the moment the app comes back to the foreground,
      // instead of waiting for the next 100ms tick to catch up.
      const onVisible = () => { if (document.visibilityState === 'visible') tick(); };
      document.addEventListener('visibilitychange', onVisible);
      return () => { clearInterval(timerRef.current); document.removeEventListener('visibilitychange', onVisible); };
    } else {
      clearInterval(timerRef.current);
    }
  }, [timerRunning]);
  function updateSet(idx, field, val) { setSets(s => s.map((x, i) => i === idx ? { ...x, [field]: val } : x)); }
  function addSet() { setSets(s => [...s, { reps: '', weight: '', time: '' }]); }
  function removeSet(idx) { setSets(s => s.length > 1 ? s.filter((_, i) => i !== idx) : s); }
  function startTimerFor(idx) {
    setTimerSetIdx(idx); setTimerValue(0); timerBaseRef.current = 0; timerStartRef.current = Date.now(); setTimerRunning(true);
    persistTimer(idx);
  }
  function stopTimer() {
    // Freeze the displayed value using the same timestamp math as the tick
    const finalElapsed = timerBaseRef.current + (Date.now() - timerStartRef.current) / 1000;
    setTimerRunning(false);
    timerBaseRef.current = finalElapsed;
    setTimerValue(finalElapsed);
    clearPersistedTimer();
    if (timerSetIdx !== null) {
      const seconds = Math.round(finalElapsed * 10) / 10;
      updateSet(timerSetIdx, 'time', String(seconds));
    }
  }
  function resetTimer() { setTimerRunning(false); setTimerValue(0); timerBaseRef.current = 0; clearPersistedTimer(); }
  function handleCancel() { clearPersistedTimer(); onCancel(); }
  function canSave() { return sets.some(s => isTimed ? Number(s.time) > 0 : Number(s.reps) > 0); }
  function handleSave() { const validSets = sets.filter(s => isTimed ? Number(s.time) > 0 : Number(s.reps) > 0); if (validSets.length === 0) return; clearPersistedTimer(); onSave({ exerciseId, sets: validSets, markAsPR }); }
  const prLine = (() => { if (!currentPR) return null; return currentPR.detail; })();
  return (
    <div style={{ paddingBottom: 24 }}>
      <div className="safe-top" style={{ padding: '20px 20px 8px', display: 'flex', alignItems: 'center', gap: 12 }}>
        <button type="button" className="btn btn-iron" onClick={handleCancel} style={{ padding: '6px 12px', fontSize: 12 }}>◂</button>
        <div style={{ flex: 1 }}><div className="font-display" style={{ fontSize: 18, fontWeight: 900, color: category.color, letterSpacing: '0.02em', marginTop: 2 }}>{exercise.name.toUpperCase()}</div></div>
      </div>
      {prLine && (
        <div style={{ padding: '0 20px 8px' }}>
          <div className="panel" style={{ padding: '10px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderColor: 'var(--gold)' }}>
            <div>
              <div className="font-display" style={{ fontSize: 11, color: 'var(--text-faint)', letterSpacing: '0.02em', fontWeight: 700 }}>★ CURRENT PR</div>
              <div className="font-display" style={{ fontSize: 18, color: 'var(--gold)', letterSpacing: '0.02em', fontWeight: 900, marginTop: 2 }}>{prLine}</div>
            </div>
            <div className="font-ui" style={{ fontSize: 11, color: 'var(--text-dim)', fontStyle: 'italic', textAlign: 'right' }}>{currentPR.date ? currentPR.date.replace(/-/g, '.') : ''}</div>
          </div>
        </div>
      )}
      <div style={{ padding: '8px 20px' }}>
        <div className="panel carved" style={{ padding: '16px', borderColor: timerRunning ? 'var(--blood)' : 'var(--line)' }}>
          <div className="font-display" style={{ fontSize: 10, color: 'var(--text-faint)', letterSpacing: '0.02em', marginBottom: 8 }}>STOPWATCH</div>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12 }}>
            <div className="font-display" style={{ fontSize: 38, fontWeight: 900, color: timerRunning ? 'var(--blood-2)' : 'var(--gold)', letterSpacing: '0.05em', fontVariantNumeric: 'tabular-nums' }}>{Math.floor(timerValue / 60).toString().padStart(2, '0')}:{(Math.floor(timerValue) % 60).toString().padStart(2, '0')}.{Math.floor((timerValue % 1) * 10)}</div>
            <div style={{ display: 'flex', gap: 6 }}>
              {!timerRunning ? (
                <button type="button" className="btn" onClick={() => { if (timerSetIdx === null) startTimerFor(sets.length - 1); else setTimerRunning(true); }} style={{ padding: '8px 12px', fontSize: 11 }}>▶ START</button>
              ) : (
                <button type="button" className="btn btn-blood" onClick={stopTimer} style={{ padding: '8px 12px', fontSize: 11 }}>■ STOP</button>
              )}
              <button type="button" className="btn btn-iron" onClick={resetTimer} style={{ padding: '8px 10px', fontSize: 12 }}>↺</button>
            </div>
          </div>
        </div>
      </div>
      <div style={{ padding: '4px 20px 10px', display: 'flex', justifyContent: 'center' }}>
        <div className="font-rune two-step-anim" style={{ fontSize: 64, color: category.color, lineHeight: 1, filter: `drop-shadow(0 0 14px ${category.color})` }}>{exercise.sigil}</div>
      </div>
      <div style={{ padding: '8px 20px 12px' }}>
        <div className="font-display" style={{ fontSize: 10, color: 'var(--text-faint)', letterSpacing: '0.02em', marginBottom: 8 }}>SETS · {sets.length}</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {sets.map((set, idx) => (
            <div key={idx} className="panel" style={{ padding: '12px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                <div className="font-display" style={{ fontSize: 13, color: 'var(--gold)', letterSpacing: '0.02em', fontWeight: 900 }}>SET {idx + 1}</div>
                {sets.length > 1 && (<button type="button" className="btn btn-iron" onClick={() => removeSet(idx)} style={{ padding: '4px 8px', fontSize: 10 }}>✕</button>)}
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: isTimed ? '1fr 1fr' : exercise.weighted ? '1fr 1fr 1fr' : '1fr 1fr', gap: 8 }}>
                {!isTimed && (<div><div className="font-display" style={{ fontSize: 11, color: 'var(--text-faint)', letterSpacing: '0.02em', marginBottom: 4, textAlign: 'center', fontWeight: 700 }}>REPS</div><input type="number" inputMode="numeric" value={set.reps} onChange={(e) => updateSet(idx, 'reps', e.target.value)} placeholder="0" min="0" /></div>)}
                {exercise.weighted && (<div><div className="font-display" style={{ fontSize: 11, color: 'var(--text-faint)', letterSpacing: '0.02em', marginBottom: 4, textAlign: 'center', fontWeight: 700 }}>WEIGHT (KG)</div><input type="number" inputMode="decimal" value={set.weight} onChange={(e) => updateSet(idx, 'weight', e.target.value)} placeholder="0" min="0" step="0.5" /></div>)}
                <div><div className="font-display" style={{ fontSize: 11, color: 'var(--text-faint)', letterSpacing: '0.02em', marginBottom: 4, textAlign: 'center', fontWeight: 700 }}>TIME (S){isTimed ? ' *' : ''}</div><input type="number" inputMode="decimal" value={set.time} onChange={(e) => updateSet(idx, 'time', e.target.value)} placeholder="0" min="0" step="0.1" /></div>
              </div>
              {!timerRunning && (<button type="button" className="btn btn-iron" onClick={() => startTimerFor(idx)} style={{ marginTop: 8, padding: '6px 10px', fontSize: 11, width: '100%' }}>⌛ STOPWATCH → SET {idx + 1}</button>)}
            </div>
          ))}
        </div>
        <button type="button" className="btn btn-iron" onClick={addSet} style={{ width: '100%', marginTop: 10, padding: '10px', fontSize: 12 }}>+ ADD SET</button>
      </div>
      <div style={{ padding: '12px 20px 0' }}>
        <button type="button" onClick={() => setMarkAsPR(p => !p)} className={markAsPR ? 'btn' : 'btn btn-iron'} style={{ width: '100%', padding: '12px', fontSize: 12, letterSpacing: '0.02em' }}>{markAsPR ? '★ MARKED AS PR' : '☆ MARK AS NEW PR'}</button>
        <div className="font-ui" style={{ fontSize: 11, color: 'var(--text-faint)', textAlign: 'center', marginTop: 6, fontStyle: 'italic' }}>{markAsPR ? '✓ This entry will be saved to the Hall of Records. Bonus +75 XP.' : 'A new PR is also detected automatically. Toggle for a manual entry.'}</div>
      </div>
      <div style={{ padding: '12px 20px 24px' }}>
        <button type="button" className="btn glow-gold" onClick={handleSave} disabled={!canSave()} style={{ width: '100%', fontSize: 15, padding: '16px', opacity: canSave() ? 1 : 0.4 }}>SAVE WORKOUT</button>
      </div>
    </div>
  );
}

function PRBoardScreen({ state }) {
  const prs = state.stats?.prs || {};
  const [filter, setFilter] = useState('all');
  const [sortBy, setSortBy] = useState('date');
  const entries = [];
  Object.entries(prs).forEach(([exId, pr]) => {
    const info = getExerciseById(exId); if (!info) return;
    const record = (typeof pr === 'number') ? { value: pr, detail: `${pr}kg`, date: '', ts: 0, manual: false } : pr;
    entries.push({ exId, exercise: info.exercise, category: info.category, ...record });
  });
  const filtered = filter === 'all' ? entries : entries.filter(e => e.category.id === filter);
  filtered.sort((a, b) => { if (sortBy === 'date') return (b.ts || 0) - (a.ts || 0); return a.category.name.localeCompare(b.category.name); });
  const totalPRs = entries.length;
  const recentPRs = entries.filter(e => { if (!e.ts) return false; return Date.now() - e.ts < 7 * 86400000; }).length;
  return (
    <div style={{ paddingBottom: 24 }}>
      <div className="safe-top" style={{ padding: '20px 20px 8px' }}>
        <div className="font-display" style={{ fontSize: 28, fontWeight: 900, color: 'var(--gold)', letterSpacing: '0.02em', marginTop: 4 }}>HALL OF RECORDS</div>
        <div className="font-ui" style={{ fontSize: 13, color: 'var(--text-dim)', marginTop: 6, fontStyle: 'italic' }}>Your own peaks. Every new PR = +75 XP bonus.</div>
      </div>
      <div className="knot-divider" style={{ margin: '0 20px' }} />
      <div style={{ padding: '8px 20px 0', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
        <div className="panel carved" style={{ padding: 14 }}><div className="font-display" style={{ fontSize: 10, color: 'var(--text-faint)', letterSpacing: '0.02em' }}>TOTAL PRS</div><div className="font-display" style={{ fontSize: 28, fontWeight: 900, color: 'var(--gold)' }}>{totalPRs}</div></div>
        <div className="panel carved" style={{ padding: 14 }}><div className="font-display" style={{ fontSize: 10, color: 'var(--text-faint)', letterSpacing: '0.02em' }}>THIS WEEK</div><div className="font-display" style={{ fontSize: 28, fontWeight: 900, color: 'var(--blood-2)' }}>{recentPRs}</div></div>
      </div>
      {totalPRs === 0 ? (
        <div style={{ padding: '40px 20px', textAlign: 'center' }}>
          <div className="font-rune" style={{ fontSize: 64, color: 'var(--text-faint)', lineHeight: 1 }}>ᛟ</div>
          <div className="font-display" style={{ fontSize: 14, color: 'var(--text-dim)', letterSpacing: '0.02em', marginTop: 12, fontWeight: 700 }}>NO RECORDS</div>
          <div className="font-ui" style={{ fontSize: 14, color: 'var(--text-faint)', marginTop: 8, fontStyle: 'italic' }}>Start training. The first entry for each exercise becomes its first record.</div>
        </div>
      ) : (
        <>
          <div style={{ padding: '12px 20px 8px' }}>
            <div style={{ display: 'flex', gap: 6, overflowX: 'auto', paddingBottom: 4 }}>
              <button type="button" onClick={() => setFilter('all')} className={filter==='all' ? 'btn' : 'btn btn-iron'} style={{ padding: '8px 14px', fontSize: 10, whiteSpace: 'nowrap', flexShrink: 0 }}>ALL</button>
              {EXERCISE_CATEGORIES.map(c => (<button key={c.id} type="button" onClick={() => setFilter(c.id)} className={filter===c.id ? 'btn' : 'btn btn-iron'} style={{ padding: '8px 14px', fontSize: 10, whiteSpace: 'nowrap', flexShrink: 0, borderColor: filter===c.id ? c.color : undefined, color: filter===c.id ? c.color : undefined }}>{c.rune} {c.name}</button>))}
            </div>
            <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
              <button type="button" onClick={() => setSortBy('date')} className={sortBy==='date' ? 'btn' : 'btn btn-iron'} style={{ flex: 1, padding: '6px', fontSize: 10 }}>⏷ DATE</button>
              <button type="button" onClick={() => setSortBy('category')} className={sortBy==='category' ? 'btn' : 'btn btn-iron'} style={{ flex: 1, padding: '6px', fontSize: 10 }}>⏷ CATEGORY</button>
            </div>
          </div>
          <div style={{ padding: '12px 20px', display: 'flex', flexDirection: 'column', gap: 8 }}>
            {filtered.length === 0 ? (
              <div className="font-ui" style={{ fontSize: 13, color: 'var(--text-faint)', textAlign: 'center', padding: '20px 0', fontStyle: 'italic' }}>No PRs in this category.</div>
            ) : filtered.map((e, i) => {
              const fresh = e.ts && (Date.now() - e.ts < 7 * 86400000);
              return (
                <div key={e.exId} className="panel rise" style={{ animationDelay: `${0.02 + i*0.03}s`, padding: '12px 14px', display: 'flex', alignItems: 'center', gap: 12, borderLeft: `3px solid ${e.category.color}`, background: fresh ? 'rgba(201, 137, 42, 0.10)' : undefined }}>
                  <div className="font-display two-step-anim" style={{ fontSize: 22, color: e.category.color, width: 36, textAlign: 'center', fontWeight: 900 }}>{e.exercise.sigil}</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, flexWrap: 'wrap' }}>
                      <span className="font-display" style={{ fontSize: 14, color: 'var(--text)', letterSpacing: '0.02em', fontWeight: 700 }}>{e.exercise.name}</span>
                      {fresh && <span className="font-display" style={{ fontSize: 11, color: 'var(--gold)', border: '1px solid var(--gold)', padding: '1px 5px', letterSpacing: '0.02em', fontWeight: 700 }}>NEW</span>}
                      {e.manual && <span className="font-display" style={{ fontSize: 11, color: 'var(--text-faint)', border: '1px solid var(--text-faint)', padding: '1px 5px', letterSpacing: '0.02em', fontWeight: 700 }}>MANUAL</span>}
                    </div>
                    <div className="font-display" style={{ fontSize: 11, color: 'var(--text-faint)', letterSpacing: '0.02em', marginTop: 2, fontWeight: 700 }}>{e.category.name} · {e.date ? e.date.replace(/-/g, '.') : 'unknown date'}</div>
                  </div>
                  <div style={{ textAlign: 'right', flexShrink: 0 }}><div className="font-display" style={{ fontSize: 17, color: 'var(--gold)', fontWeight: 900, letterSpacing: '0.05em' }}>{e.detail}</div></div>
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

                    {state.class === c.id && <span style={{ color: c.color, fontSize: 16 }}>✓</span>}
                  </button>
                ))}
                <div className="font-ui" style={{ fontSize: 11, color: 'var(--text-faint)', fontStyle: 'italic' }}>* Character and XP stay. Only stat growth changes.</div>
              </div>

          <div className="panel" style={{ padding: 16 }}>

                <div className="font-display" style={{ fontSize: 10, color: 'var(--text-faint)', letterSpacing: '0.02em' }}>YOUR CATEGORIES</div>

              </div>
              <button type="button" className="btn btn-iron" onClick={onGotoTrain} style={{ padding: '6px 10px', fontSize: 11 }}>MANAGE</button>

              disabled={remindersOn}
              onClick={async () => {

                  <button

                    type="button"

                    style={{
                      display: 'flex', flexDirection: 'column', gap: 6, padding: '10px 12px', borderRadius: 8, cursor: 'pointer', textAlign: 'left',
                      background: t.vars['--bg'], border: `1.5px solid ${active ? 'var(--gold)' : 'var(--line)'}`,

                    <div style={{ display: 'flex', gap: 4 }}>
                      <span style={{ width: 16, height: 16, borderRadius: 4, background: t.vars['--ambient-a'].replace(/[\d.]+\)$/, '0.9)') }} />

        </ProfileSection>

        <ProfileSection title="ACCOUNT">
          {MONETIZATION_LIVE && (
            <div className="panel carved" style={{ padding: 16, borderColor: state.premium ? 'var(--gold)' : 'var(--line)' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                <div>
                  <div className="font-display" style={{ fontSize: 10, color: 'var(--text-faint)', letterSpacing: '0.02em' }}>MEMBERSHIP</div>
                  <div className="font-display" style={{ fontSize: 19, color: state.premium ? 'var(--gold)' : 'var(--text)', fontWeight: 900, letterSpacing: '0.02em', marginTop: 2 }}>{state.premium ? '★ PANTHEON+' : 'FREE TIER'}</div>
                  <div className="font-ui" style={{ fontSize: 13, color: 'var(--text-dim)', marginTop: 4, fontStyle: 'italic' }}>{state.premium ? 'Cloud backup, +10% XP, exclusive aura active.' : 'Cloud backup, +10% XP and an exclusive aura.'}</div>
                </div>
                {!state.premium && <button type="button" className="btn glow-gold" onClick={onOpenPaywall} style={{ padding: '8px 14px', fontSize: 12 }}>UPGRADE</button>}
              </div>
              <div style={{ marginTop: 12, display: 'flex', gap: 8 }}>
                <button type="button" className="btn btn-iron" onClick={onBackupNow} style={{ flex: 1, padding: '10px', fontSize: 11 }}>☁ BACKUP NOW</button>
                <button type="button" className="btn btn-iron" onClick={onRestoreBackup} style={{ flex: 1, padding: '10px', fontSize: 11 }}>⤓ RESTORE</button>
              </div>
              <button type="button" onClick={() => setShowRecovery(s => !s)} style={{ marginTop: 10, background: 'transparent', border: 'none', color: 'var(--text-faint)', fontSize: 11, textDecoration: 'underline', cursor: 'pointer', padding: 0 }}>I have a recovery code from another device</button>
              {showRecovery && (
                <div style={{ marginTop: 10, display: 'flex', gap: 8 }}>
                  <input type="text" value={recoveryInput} onChange={(e) => setRecoveryInput(e.target.value)} placeholder="PASTE RECOVERY CODE" style={{ fontSize: 16, padding: '8px 10px', fontFamily: 'monospace', letterSpacing: 0 }} />
                  <button type="button" className="btn" onClick={() => { onRestoreCode(recoveryInput); setRecoveryInput(''); setShowRecovery(false); }} style={{ padding: '8px 14px', fontSize: 11 }}>APPLY</button>
                </div>

              <div className="font-ui" style={{ fontSize: 10.5, color: 'var(--text-faint)', marginTop: 10, fontStyle: 'italic', lineHeight: 1.5 }}>Your recovery code: <span style={{ fontFamily: 'monospace', color: 'var(--text-dim)' }}>{state.licenseKey}</span> — save it before switching devices.</div>
            </div>
          )}
          <div className="panel" style={{ padding: 16 }}>
            <div className="font-display" style={{ fontSize: 10, color: 'var(--text-faint)', letterSpacing: '0.02em', marginBottom: 10, fontWeight: 700 }}>LEGAL</div>
            <div style={{ display: 'flex', gap: 8 }}>
              <button type="button" className="btn btn-iron" onClick={() => setLegalDoc('terms')} style={{ flex: 1, padding: '10px', fontSize: 12 }}>TERMS</button>
              <button type="button" className="btn btn-iron" onClick={() => setLegalDoc('privacy')} style={{ flex: 1, padding: '10px', fontSize: 12 }}>PRIVACY</button>
            </div>
            <div className="font-ui" style={{ fontSize: 11, color: 'var(--text-faint)', marginTop: 10, fontStyle: 'italic', lineHeight: 1.5 }}>You can withdraw consent to health-data processing by resetting your data below.</div>
          </div>
          <div className="panel" style={{ padding: 16, borderColor: 'var(--blood-2)' }}>
            <div className="font-display" style={{ fontSize: 10, color: 'var(--blood-2)', letterSpacing: '0.02em', marginBottom: 8, fontWeight: 700 }}>DANGER ZONE</div>
            {!confirmReset ? (
              <button type="button" className="btn btn-blood" onClick={() => setConfirmReset(true)} style={{ width: '100%' }}>↺ RESET CHARACTER</button>
            ) : (
              <>
                <div className="font-ui" style={{ fontSize: 13, color: 'var(--text)', marginBottom: 10, fontStyle: 'italic' }}>Deletes all progress. No going back.</div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <button type="button" className="btn btn-iron" onClick={() => setConfirmReset(false)} style={{ flex: 1, padding: '10px' }}>CANCEL</button>
                  <button type="button" className="btn btn-blood" onClick={onReset} style={{ flex: 1, padding: '10px' }}>CONFIRM</button>
                </div>
              </>
            )}
          </div>
        </ProfileSection>
      </div>
      <LegalModal doc={legalDoc} onClose={() => setLegalDoc(null)} />
    </div>
  );
}

  const [code, setCode] = useState('');
  const PERKS = [
    { icon: '☁', text: 'Cloud backup — never lose your character switching phones' },
    { icon: '⚡', text: '+10% XP on every workout, forever' },
    { icon: '✦', text: 'Exclusive Olympian aura on your avatar' },
    { icon: '♥', text: 'Funds development of new chapters & features' },
  ];
  return (
    <div className="levelup-overlay" onClick={onClose} style={{ background: 'radial-gradient(circle at 50% 20%, rgba(201,137,42,0.20), rgba(8,9,10,0.97) 70%)' }}>
      <div className="panel-strong carved" onClick={(e) => e.stopPropagation()} style={{ padding: '26px 22px', maxWidth: 380, width: '92%', maxHeight: '88dvh', overflowY: 'auto' }}>
        <div className="font-display" style={{ fontSize: 11, color: 'var(--gold-2)', letterSpacing: '0.04em', fontWeight: 700, textAlign: 'center' }}>UPGRADE</div>
        <div className="font-display" style={{ fontSize: 28, color: 'var(--gold)', fontWeight: 900, letterSpacing: '0.02em', marginTop: 4, textAlign: 'center', fontFamily: 'Cinzel' }}>PANTHEON+</div>
        <div style={{ marginTop: 18, display: 'flex', flexDirection: 'column', gap: 10 }}>
          {PERKS.map((p, i) => (
            <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
              <span style={{ fontSize: 16, color: 'var(--gold)', width: 20, textAlign: 'center', flexShrink: 0 }}>{p.icon}</span>
              <span className="font-ui" style={{ fontSize: 13.5, color: 'var(--text-dim)', lineHeight: 1.4 }}>{p.text}</span>
            </div>
          ))}
        </div>
        <div style={{ display: 'flex', gap: 8, marginTop: 20 }}>
          <button type="button" onClick={() => setPlan('monthly')} className="card" style={{ flex: 1, padding: '14px 10px', textAlign: 'center', borderColor: plan === 'monthly' ? 'var(--gold)' : 'var(--line)' }}>
            <div className="font-display" style={{ fontSize: 13, color: 'var(--text)', fontWeight: 900 }}>MONTHLY</div>
            <div className="font-display" style={{ fontSize: 18, color: 'var(--gold)', fontWeight: 900, marginTop: 4 }}>$4.99</div>
          </button>
          <button type="button" onClick={() => setPlan('annual')} className="card" style={{ flex: 1, padding: '14px 10px', textAlign: 'center', borderColor: plan === 'annual' ? 'var(--gold)' : 'var(--line)', position: 'relative' }}>
            <div style={{ position: 'absolute', top: -9, right: 8, background: 'var(--crimson)', color: 'var(--bone)', fontSize: 9, fontWeight: 900, padding: '2px 6px', borderRadius: 6 }}>SAVE 50%</div>
            <div className="font-display" style={{ fontSize: 13, color: 'var(--text)', fontWeight: 900 }}>ANNUAL</div>
            <div className="font-display" style={{ fontSize: 18, color: 'var(--gold)', fontWeight: 900, marginTop: 4 }}>$29.99</div>
          </button>
        </div>
        <button type="button" className="btn glow-gold" onClick={() => onCheckout(plan)} style={{ width: '100%', padding: '15px', fontSize: 14, marginTop: 16 }}>▸ UNLOCK PANTHEON+</button>
        <button type="button" className="btn btn-iron" onClick={onClose} style={{ width: '100%', padding: '10px', fontSize: 12, marginTop: 8 }}>MAYBE LATER</button>
        <button type="button" onClick={() => setShowRecovery(s => !s)} style={{ marginTop: 14, width: '100%', background: 'transparent', border: 'none', color: 'var(--text-faint)', fontSize: 11, textDecoration: 'underline', cursor: 'pointer', padding: 0 }}>Already a member? Restore with recovery code</button>
        {showRecovery && (
          <div style={{ marginTop: 10, display: 'flex', gap: 8 }}>
            <input type="text" value={code} onChange={(e) => setCode(e.target.value)} placeholder="PASTE RECOVERY CODE" style={{ fontSize: 16, padding: '8px 10px', fontFamily: 'monospace', letterSpacing: 0 }} />
