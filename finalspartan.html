  const totalKg    = todayEntries.reduce((s, h) => s + (h.totalKg || 0), 0);
  const totalReps  = todayEntries.reduce((s, h) => s + (h.totalReps || 0), 0);
  const totalSets  = todayEntries.reduce((s, h) => s + (h.sets ? h.sets.length : 0), 0);
  const totalSecs  = todayEntries.reduce((s, h) => s + (h.totalSeconds || 0), 0);
  const prs        = todayEntries.filter(h => h.prHit).length;
  const exercises  = [...new Set(todayEntries.map(h => h.exerciseId))].length;
  const mins = Math.floor(totalSecs / 60);
  const secs = totalSecs % 60;
  const timeStr = totalSecs > 0 ? `${mins}:${String(secs).padStart(2,'0')}` : `${todayEntries.length * 8}+ min`;
  const quotes = [
    "The gods watched today. They were not disappointed.",
    "You moved iron. The enemy moved backward.",
    "Every rep forged a weapon. Well used.",
    "Weakness begged for mercy. You gave it none.",
    "The Spartans would approve. So do we.",
    "Rest is now earned. Tomorrow, the war continues.",
    "Pain was the price. Strength is the reward.",
    "You did not come here to lose. And you did not.",
    "The battle was won before it started — when you chose to show up.",
    "Another day the darkness retreats. Good.",
  ];
  const quote = quotes[Math.abs(todayStr.split('').reduce((a,c) => a + c.charCodeAt(0), 0)) % quotes.length];
  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 1000, background: 'rgba(0,0,0,0.88)', display: 'flex', flexDirection: 'column', justifyContent: 'flex-end', backdropFilter: 'blur(6px)' }} onClick={onClose}>
      <div style={{ background: 'var(--bg-2)', borderRadius: '20px 20px 0 0', padding: '28px 24px 40px', maxHeight: '88vh', overflowY: 'auto' }} onClick={e => e.stopPropagation()}>

        <div style={{ fontSize: 22, fontWeight: 700, color: 'var(--bone)', textAlign: 'center', marginBottom: 24, letterSpacing: '-0.01em' }}>Today's Battle Report</div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 20 }}>
          {[
            { label: 'XP Earned',  value: `+${totalXP}`,                        color: 'var(--gold)' },
            { label: 'Volume',     value: totalKg > 0 ? `${totalKg.toFixed(0)} kg` : '—', color: 'var(--moss)' },
            { label: 'Total Sets', value: String(totalSets),                     color: 'var(--text)' },
            { label: 'Reps',       value: totalReps > 0 ? String(totalReps) : '—', color: 'var(--text)' },
            { label: 'Duration',   value: timeStr,                                color: 'var(--blue-2)' },
            { label: 'Exercises',  value: String(exercises),                      color: 'var(--text)' },
          ].map(({ label, value, color }) => (
            <div key={label} className="panel" style={{ padding: '12px 14px' }}>
              <div className="font-ui" style={{ fontSize: 11, color: 'var(--text-faint)', marginBottom: 4 }}>{label}</div>
              <div style={{ fontSize: 22, fontWeight: 700, color }}>{value}</div>

      </div>

  );

function WeeklyProgramCard({ state }) {
  const FREQ_STR_MAP = { low: 3, mid: 4, high: 5 };
  const freqRaw = state.frequency;
  const freq = (typeof freqRaw === 'number' && freqRaw >= 1)
    ? freqRaw
    : (FREQ_STR_MAP[String(freqRaw).toLowerCase()] || 3);
  const difficulty = state.difficulty || 'medium';
  const weekRotationIndex = state.weekRotationIndex || 0;
  const weekType = WEEK_TYPES[weekRotationIndex % WEEK_TYPES.length];
  const sessions = (WEEKLY_PROGRAMS[weekType.key] || {})[freq] || [];
  const bossCurrentHP = state.bossCurrentHP;
  const bossWeekLevel = state.bossWeekLevel;
  const weekSessionsCompleted = state.weekSessionsCompleted || 0;
  const isBossWeek = bossCurrentHP !== null;
  const bossInfo = isBossWeek ? BOSSES.find(b => b.level === bossWeekLevel) : null;

function getTodayWorkout(profile, appState) {
  if (!profile) return null;
  const lvl      = profile.level || 'beginner';
  const appClass = (appState && appState.class) || 'strength';
  const history  = (appState && appState.history) || [];
  const todayStr = new Date().toISOString().slice(0, 10);

  const strengthKeys = ['chest', 'back', 'legs', 'shoulders', 'biceps', 'triceps', 'abs', 'calisthenics'];
  const cardioKeys   = ['endurance', 'speed'];
  let candidates;
  if      (appClass === 'strength') candidates = strengthKeys;
  else if (appClass === 'speed')    candidates = [...cardioKeys, 'legs', 'back', 'chest'];
  else                               candidates = [...strengthKeys, ...cardioKeys];

  const lastTrained = {};
  for (const entry of history) {
    const c = entry.categoryId;
    if (!c) continue;
    if (!lastTrained[c] || entry.date > lastTrained[c]) lastTrained[c] = entry.date;
    if (c === 'cardio') {
      if (!lastTrained['endurance'] || entry.date > lastTrained['endurance']) lastTrained['endurance'] = entry.date;
      if (!lastTrained['speed']     || entry.date > lastTrained['speed'])     lastTrained['speed']     = entry.date;
    }
  }

  const daysSince = (key) => {
    const d = lastTrained[key];
    if (!d) return 999;
    return Math.round((new Date(todayStr) - new Date(d)) / 86400000);
  };

  const trainedToday = new Set(history.filter(h => h.date === todayStr).map(h => h.categoryId));
  if (trainedToday.has('cardio')) { trainedToday.add('endurance'); trainedToday.add('speed'); }

  const scored = candidates
    .filter(key => WORKOUT_DB[key] && !trainedToday.has(key))
    .map(key => ({ key, days: daysSince(key) }))
    .sort((a, b) => b.days - a.days);

  if (scored.length === 0) return null;

  const topKeys = scored.slice(0, 2).map(s => s.key);
  return topKeys.map(function(key) {
    const catId = (key === 'endurance' || key === 'speed') ? 'cardio' : key;
    const cat   = EXERCISE_CATEGORIES.find(function(c) { return c.id === catId; });
    const exs   = (WORKOUT_DB[key] && WORKOUT_DB[key][lvl]) || [];
    return { catId: key, name: cat ? cat.name : key.toUpperCase(), color: cat ? cat.color : 'var(--bone)', exercises: exs };
  });
}

  const [openId, setOpenId] = useState(null);

  useEffect(() => { setOpenId(null); setDragX(0); setSwiping(false); }, [categoryId]);
  if (!cat) return null;
  function handleTouchStart(e) { touchStartX.current = e.touches[0].clientX; setSwiping(true); }
  function handleTouchMove(e) {
    if (touchStartX.current === null) return;
    const dx = e.touches[0].clientX - touchStartX.current;
    if (Math.abs(dx) < 5) return;
    if ((dx > 0 && !prevCat) || (dx < 0 && !nextCat)) { setDragX(dx * 0.12); return; }
    setDragX(dx * 0.88);
  }
  function handleTouchEnd(e) {
    if (touchStartX.current === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX.current;
    touchStartX.current = null;
    setSwiping(false);
    setDragX(0);
    if (dx > 60 && prevCat) onNavigate(prevCatId);
    else if (dx < -60 && nextCat) onNavigate(nextCatId);
  }
  function handleTouchCancel() { touchStartX.current = null; setSwiping(false); setDragX(0); }
  return (
    <div style={{ transform: dragX !== 0 ? `translateX(${dragX}px)` : undefined, transition: swiping ? 'none' : 'transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)' }} onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleTouchEnd} onTouchCancel={handleTouchCancel}>

              <span>◂</span>
              {CAT_IMGS[prevCatId]?.m && <img src={CAT_IMGS[prevCatId].m} alt={prevCat.name} style={{ width: 28, height: 28, borderRadius: '50%', objectFit: 'cover', border: `1px solid ${prevCat.color}88` }} />}

function ExerciseLogger({ exerciseId, categoryId, currentPR, onCancel, onSave, onNavigate, history, workingWeight }) {
  const info = getExerciseById(exerciseId);
  if (!info) return null;
  const { exercise, category } = info;
  const isTimed = !!exercise.timed;
  const _exIdx = category.exercises.findIndex(e => e.id === exerciseId);
  const prevExercise = _exIdx > 0 ? category.exercises[_exIdx - 1] : null;
  const nextExercise = _exIdx >= 0 && _exIdx < category.exercises.length - 1 ? category.exercises[_exIdx + 1] : null;
  const [showFemale, setShowFemale] = React.useState(false);
  const [sets, setSets] = useState([{ reps: '', weight: '', time: '' }]);
  const [markAsPR, setMarkAsPR] = useState(false);

  // ── Stopwatch (timed exercises only) ──
  const [timerRunning, setTimerRunning] = useState(false);
  const [timerValue, setTimerValue] = useState(0);
  const [timerSetIdx, setTimerSetIdx] = useState(null);
  const timerRef = useRef(null);
  const timerStartRef = useRef(0);
  const timerBaseRef = useRef(0);
  const timerStorageKey = `sparta_timer_${exerciseId}`;
  function persistTimer(setIdx) {
    try { window.localStorage.setItem(timerStorageKey, JSON.stringify({ base: timerBaseRef.current, startedAt: timerStartRef.current, setIdx })); } catch {}
  }
  function clearPersistedTimer() {
    try { window.localStorage.removeItem(timerStorageKey); } catch {}
  }
  useEffect(() => {
    try {
      const raw = window.localStorage.getItem(timerStorageKey);
      if (raw) {
        const saved = JSON.parse(raw);
        timerBaseRef.current = saved.base + (Date.now() - saved.startedAt) / 1000;
        setTimerSetIdx(saved.setIdx);
        setTimerValue(timerBaseRef.current);
        setTimerRunning(true);
      }
    } catch {}
  }, []);
  useEffect(() => {
    if (timerRunning) {
      timerStartRef.current = Date.now();
      const tick = () => { const elapsed = timerBaseRef.current + (Date.now() - timerStartRef.current) / 1000; setTimerValue(elapsed); };
      tick();
      timerRef.current = setInterval(tick, 100);
      const onVisible = () => { if (document.visibilityState === 'visible') tick(); };
      document.addEventListener('visibilitychange', onVisible);
      return () => { clearInterval(timerRef.current); document.removeEventListener('visibilitychange', onVisible); };
    } else { clearInterval(timerRef.current); }
  }, [timerRunning]);
  function startTimerFor(idx) {
    setTimerSetIdx(idx); setTimerValue(0); timerBaseRef.current = 0; timerStartRef.current = Date.now(); setTimerRunning(true);
    persistTimer(idx);
  }
  function stopTimer() {
    const finalElapsed = timerBaseRef.current + (Date.now() - timerStartRef.current) / 1000;
    setTimerRunning(false); timerBaseRef.current = finalElapsed; setTimerValue(finalElapsed); clearPersistedTimer();
    if (timerSetIdx !== null) updateSet(timerSetIdx, 'time', String(Math.round(finalElapsed * 10) / 10));
  }
  function resetTimer() { setTimerRunning(false); setTimerValue(0); timerBaseRef.current = 0; clearPersistedTimer(); }

  // ── Rest countdown timer (non-timed exercises) ──
  const REST_DEFAULT = 90;
  const [restSecs, setRestSecs] = useState(null);
  const [restTotal, setRestTotal] = useState(REST_DEFAULT);
  const [restDone, setRestDone] = useState(false);
  const restIntervalRef = useRef(null);
  function startRest(duration) {
    const d = duration || REST_DEFAULT;
    clearInterval(restIntervalRef.current);
    setRestTotal(d); setRestSecs(d); setRestDone(false);
    restIntervalRef.current = setInterval(() => {
      setRestSecs(s => {
        if (s <= 1) {
          clearInterval(restIntervalRef.current);
          try { if (navigator.vibrate) navigator.vibrate([150, 80, 150, 80, 300]); } catch {}
          setRestDone(true);
          return 0;
        }
        return s - 1;
      });
    }, 1000);
  }
  function skipRest() { clearInterval(restIntervalRef.current); setRestSecs(null); setRestDone(false); }
  useEffect(() => () => clearInterval(restIntervalRef.current), []);

  function updateSet(idx, field, val) { setSets(s => s.map((x, i) => i === idx ? { ...x, [field]: val } : x)); }
  function addSet() {
    setSets(s => [...s, { reps: '', weight: '', time: '' }]);
    if (!isTimed) startRest();
  }
  function removeSet(idx) { setSets(s => s.length > 1 ? s.filter((_, i) => i !== idx) : s); }
  function handleCancel() { clearPersistedTimer(); skipRest(); onCancel(); }
  function canSave() { return sets.some(s => isTimed ? Number(s.time) > 0 : Number(s.reps) > 0); }
  function handleSave() { const validSets = sets.filter(s => isTimed ? Number(s.time) > 0 : Number(s.reps) > 0); if (validSets.length === 0) return; clearPersistedTimer(); skipRest(); onSave({ exerciseId, sets: validSets, markAsPR }); }
  const prLine = (() => { if (!currentPR) return null; return currentPR.detail; })();
  return (
    <div style={{ paddingBottom: 24 }}>
      <div className="safe-top" style={{ padding: '16px 20px 8px', position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <button type="button" className="btn btn-iron" onClick={handleCancel} style={{ position: 'absolute', left: 20, top: '50%', transform: 'translateY(-50%)', padding: '6px 12px', fontSize: 12 }}>◂</button>
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 5 }}>
          {CAT_IMGS[category.id]?.m && <img src={CAT_IMGS[category.id].m} alt={category.name} style={{ width: 44, height: 44, borderRadius: '50%', objectFit: 'cover', border: `2px solid ${category.color}`, filter: `drop-shadow(0 0 6px ${category.color})` }} />}
          <div className="font-display" style={{ fontSize: 17, fontWeight: 900, color: category.color, letterSpacing: '0.02em', lineHeight: 1.1 }}>{exercise.name.toUpperCase()}</div>
        </div>
        {prevExercise && onNavigate && (
          <button type="button" onClick={() => onNavigate(prevExercise.id)} style={{ position: 'absolute', left: 70, top: '50%', transform: 'translateY(-50%)', background: 'transparent', border: 'none', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, padding: 4 }}>
            {EX_IMGS[prevExercise.id]?.m
              ? <img src={EX_IMGS[prevExercise.id].m} alt={prevExercise.name} style={{ width: 36, height: 36, borderRadius: 8, objectFit: 'cover', objectPosition: 'top', border: `1px solid ${category.color}55`, opacity: 0.85 }} />
              : <div className="font-display" style={{ fontSize: 16, color: category.color, opacity: 0.7 }}>{prevExercise.sigil}</div>}
            <div className="font-ui" style={{ fontSize: 9, color: 'var(--text-faint)', letterSpacing: '0.04em', maxWidth: 52, textAlign: 'center', lineHeight: 1.2 }}>◂ {prevExercise.name.toUpperCase()}</div>
          </button>
        )}
        {nextExercise && onNavigate && (
          <button type="button" onClick={() => onNavigate(nextExercise.id)} style={{ position: 'absolute', right: 16, top: '50%', transform: 'translateY(-50%)', background: 'transparent', border: 'none', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, padding: 4 }}>
            {EX_IMGS[nextExercise.id]?.m
              ? <img src={EX_IMGS[nextExercise.id].m} alt={nextExercise.name} style={{ width: 36, height: 36, borderRadius: 8, objectFit: 'cover', objectPosition: 'top', border: `1px solid ${category.color}55`, opacity: 0.85 }} />
              : <div className="font-display" style={{ fontSize: 16, color: category.color, opacity: 0.7 }}>{nextExercise.sigil}</div>}
            <div className="font-ui" style={{ fontSize: 9, color: 'var(--text-faint)', letterSpacing: '0.04em', maxWidth: 52, textAlign: 'center', lineHeight: 1.2 }}>{nextExercise.name.toUpperCase()} ▸</div>
          </button>
        )}
      </div>
      {prLine && (
        <div style={{ padding: '0 20px 8px' }}>
          <div className="panel" style={{ padding: '10px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderColor: 'var(--gold)' }}>
            <div>
              <div className="font-display" style={{ fontSize: 11, color: 'var(--text-faint)', letterSpacing: '0.02em', fontWeight: 700 }}>★ CURRENT PR</div>
              <div className="font-display" style={{ fontSize: 18, color: 'var(--gold)', letterSpacing: '0.02em', fontWeight: 900, marginTop: 2 }}>{prLine}</div>
            </div>
            <div className="font-ui" style={{ fontSize: 11, color: 'var(--text-dim)', fontStyle: 'italic', textAlign: 'right' }}>{currentPR.date ? currentPR.date.replace(/-/g, '.') : ''}</div>
          </div>
        </div>
      )}
      {EX_IMGS[exerciseId] && (
        <div style={{ position: 'relative', margin: '0 20px 4px', borderRadius: 12, overflow: 'hidden', height: 280, border: `1px solid ${category.color}55` }}>
          <img src={showFemale ? (EX_IMGS[exerciseId].f || EX_IMGS[exerciseId].m) : (EX_IMGS[exerciseId].m || EX_IMGS[exerciseId].f)} alt="" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', filter: 'blur(14px) brightness(0.45) saturate(1.3)', transform: 'scale(1.12)' }} />
          <img src={showFemale ? (EX_IMGS[exerciseId].f || EX_IMGS[exerciseId].m) : (EX_IMGS[exerciseId].m || EX_IMGS[exerciseId].f)} alt={exercise.name} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'contain', objectPosition: 'center center' }} />
          <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.5) 100%)' }} />
          {EX_IMGS[exerciseId].m && EX_IMGS[exerciseId].f && (
            <button type="button" onClick={() => setShowFemale(v => !v)} style={{ position: 'absolute', top: 8, right: 8, background: 'rgba(0,0,0,0.6)', border: '1px solid rgba(255,255,255,0.25)', borderRadius: 20, padding: '4px 10px', fontSize: 11, color: '#fff', cursor: 'pointer', fontWeight: 700 }}>{showFemale ? '?' : '?'}</button>
          )}
        </div>
      )}
      {workingWeight && !workingWeight.calibrating && (workingWeight.targetReps || workingWeight.targetTime) && (
        <div style={{ padding: '8px 20px 4px' }}>
          <div className="panel carved" style={{ padding: '14px 16px' }}>
            <div className="font-display" style={{ fontSize: 10, color: 'var(--text-faint)', letterSpacing: '0.02em', marginBottom: 10 }}>TODAY'S PRESCRIPTION</div>
            {workingWeight.targetTime ? (
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <div className="font-display" style={{ fontSize: 28, fontWeight: 900, color: 'var(--gold)' }}>{formatTimePR(workingWeight.targetTime)}</div>
                <div className="font-display" style={{ fontSize: 14, color: 'var(--text-dim)' }}>target hold</div>
              </div>
            ) : exercise.weighted && workingWeight.weight > 0 ? (
              <>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
                  <div className="font-display" style={{ fontSize: 28, fontWeight: 900, color: 'var(--gold)' }}>{workingWeight.weight} kg</div>
                  <div className="font-display" style={{ fontSize: 14, color: 'var(--text-dim)' }}>× {workingWeight.targetReps || 5} reps</div>
                </div>
                <div style={{ display: 'flex', gap: 6 }}>
                  {getWarmupRamp(workingWeight.weight).map((w, i) => (
                    <div key={i} className="panel" style={{ flex: 1, padding: '6px 4px', textAlign: 'center', background: 'rgba(0,0,0,0.4)' }}>
                      <div className="font-display" style={{ fontSize: 10, color: 'var(--text-faint)', marginBottom: 2 }}>WARMUP {i+1}</div>
                      <div className="font-display" style={{ fontSize: 14, color: 'var(--text)', fontWeight: 700 }}>{w.weight}kg</div>
                      <div className="font-ui" style={{ fontSize: 10, color: 'var(--text-faint)' }}>×{w.reps}</div>
                    </div>
                  ))}
                </div>
              </>
            ) : (
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <div className="font-display" style={{ fontSize: 28, fontWeight: 900, color: 'var(--gold)' }}>{workingWeight.targetReps}</div>
                <div className="font-display" style={{ fontSize: 14, color: 'var(--text-dim)' }}>reps target</div>
              </div>
            )}
          </div>
        </div>
      )}
      {workingWeight && workingWeight.calibrating && (
        <div style={{ padding: '8px 20px 4px' }}>
          <div className="panel carved" style={{ padding: '14px 16px' }}>
            <div className="font-display" style={{ fontSize: 10, color: 'var(--text-faint)', letterSpacing: '0.02em', marginBottom: 6 }}>CALIBRATION SESSION</div>
            <div className="font-ui" style={{ fontSize: 12, color: 'var(--text-dim)', fontStyle: 'italic', lineHeight: 1.5 }}>
              {exercise.weighted
                ? `Start with ${workingWeight.weight} kg and do as many reps as possible (AMRAP). We'll compute your working weight from this.`
                : 'Do as many reps as you can. We\'ll calibrate your target reps from this session.'}
            </div>
          </div>
        </div>
      )}
      <ExerciseProgressGraph history={history} exerciseId={exerciseId} categoryColor={category.color} />
      {isTimed && (
        <div style={{ padding: '8px 20px' }}>
          <div className="panel carved" style={{ padding: '16px', borderColor: timerRunning ? 'var(--blood)' : 'var(--line)' }}>
            <div className="font-display" style={{ fontSize: 10, color: 'var(--text-faint)', letterSpacing: '0.02em', marginBottom: 8 }}>STOPWATCH</div>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12 }}>
              <div className="font-display" style={{ fontSize: 38, fontWeight: 900, color: timerRunning ? 'var(--blood-2)' : 'var(--gold)', letterSpacing: '0.05em', fontVariantNumeric: 'tabular-nums' }}>{Math.floor(timerValue / 60).toString().padStart(2, '0')}:{(Math.floor(timerValue) % 60).toString().padStart(2, '0')}.{Math.floor((timerValue % 1) * 10)}</div>
              <div style={{ display: 'flex', gap: 6 }}>
                {!timerRunning ? (
                  <button type="button" className="btn" onClick={() => { if (timerSetIdx === null) startTimerFor(sets.length - 1); else setTimerRunning(true); }} style={{ padding: '8px 12px', fontSize: 11 }}>▶ START</button>
                ) : (
                  <button type="button" className="btn btn-blood" onClick={stopTimer} style={{ padding: '8px 12px', fontSize: 11 }}>■ STOP</button>
                )}
                <button type="button" className="btn btn-iron" onClick={resetTimer} style={{ padding: '8px 10px', fontSize: 12 }}>↺</button>
              </div>
            </div>
          </div>
        </div>
      )}
      {!isTimed && restSecs !== null && (() => {
        const pct = restTotal > 0 ? restSecs / restTotal : 0;
        const mins = Math.floor(restSecs / 60);
        const secs = restSecs % 60;
        const r = 42, circ = 2 * Math.PI * r;
        const color = restDone ? 'var(--jade)' : restSecs <= 10 ? 'var(--blood-2)' : 'var(--gold)';
        return (
          <div style={{ padding: '8px 20px' }}>
            <div className="panel carved" style={{ padding: '16px 20px', borderColor: restDone ? 'var(--jade)' : restSecs <= 10 ? 'var(--blood)' : 'var(--gold)', transition: 'border-color 0.4s' }}>
              <div className="font-display" style={{ fontSize: 10, color: 'var(--text-faint)', letterSpacing: '0.02em', marginBottom: 12 }}>REST TIMER</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
                <div style={{ position: 'relative', width: 96, height: 96, flexShrink: 0 }}>
                  <svg width="96" height="96" style={{ transform: 'rotate(-90deg)' }}>
                    <circle cx="48" cy="48" r={r} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="6" />
                    <circle cx="48" cy="48" r={r} fill="none" stroke={color} strokeWidth="6"
                      strokeDasharray={circ} strokeDashoffset={circ * (1 - pct)}
                      strokeLinecap="round" style={{ transition: 'stroke-dashoffset 0.9s linear, stroke 0.4s' }} />
                  </svg>
                  <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <div className="font-display" style={{ fontSize: restDone ? 14 : 26, fontWeight: 900, color, letterSpacing: '0.04em', fontVariantNumeric: 'tabular-nums', lineHeight: 1, textAlign: 'center' }}>
                      {restDone ? 'GO!' : `${mins > 0 ? mins + ':' : ''}${secs.toString().padStart(mins > 0 ? 2 : 1, '0')}`}
                    </div>
                  </div>
                </div>
                <div style={{ flex: 1 }}>
                  <div className="font-ui" style={{ fontSize: 13, color: 'var(--text-dim)', fontStyle: 'italic', marginBottom: 12 }}>
                    {restDone ? 'Rest complete. Time to go.' : `Next set in ${mins > 0 ? mins + 'm ' : ''}${secs}s`}
                  </div>
                  <div style={{ display: 'flex', gap: 8 }}>
                    <button type="button" className="btn btn-iron" onClick={skipRest} style={{ flex: 1, padding: '8px', fontSize: 11 }}>SKIP</button>
                    <button type="button" className="btn btn-iron" onClick={() => startRest(restTotal + 30)} style={{ padding: '8px 10px', fontSize: 11 }}>+30s</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      })()}
      <div style={{ padding: '8px 20px 12px', background: '#000' }}>
        <div className="font-display" style={{ fontSize: 10, color: 'var(--text-faint)', letterSpacing: '0.02em', marginBottom: 8 }}>SETS · {sets.length}</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {sets.map((set, idx) => (
            <div key={idx} style={{ background: '#000' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
                <div className="font-display" style={{ fontSize: 13, color: 'var(--gold)', letterSpacing: '0.08em', fontWeight: 900 }}>SET {idx + 1}</div>
                {sets.length > 1 && (<button type="button" className="btn btn-iron" onClick={() => removeSet(idx)} style={{ padding: '4px 8px', fontSize: 10 }}>✕</button>)}
              </div>
              <div style={{ display: 'flex', alignItems: 'stretch', overflow: 'visible' }}>
                {!isTimed && (<>
                  <div style={{ flex: 1, background: 'linear-gradient(160deg,#1c1a12 0%,#0f0d07 100%)', border: '1px solid rgba(201,137,42,0.5)', borderRadius: 10, padding: '14px 8px', display: 'flex', flexDirection: 'column', gap: 10, alignItems: 'center' }}>
                    <div className="font-display" style={{ fontSize: 11, color: 'rgba(201,137,42,0.9)', letterSpacing: '0.14em', textAlign: 'center', fontWeight: 700 }}>REPS</div>
                    <input type="number" inputMode="numeric" value={set.reps} onChange={(e) => updateSet(idx, 'reps', e.target.value)} placeholder="0" min="0" style={{ fontSize: 36, color: 'var(--gold)', fontWeight: 900, padding: '10px 0', border: '1px solid rgba(201,137,42,0.3)', borderRadius: 8, background: 'rgba(0,0,0,0.9)', width: '100%', boxShadow: 'inset 0 0 16px rgba(0,0,0,0.8)' }} />
                  </div>
                  <div style={{ width: 44, flexShrink: 0, margin: '-16px 0', alignSelf: 'stretch', position: 'relative', background: 'radial-gradient(ellipse at 40% 50%, #2e2610 0%, #181308 55%, #060502 100%)', borderLeft: '1.5px solid rgba(201,137,42,0.8)', borderRight: '1.5px solid rgba(201,137,42,0.8)', boxShadow: 'inset 6px 0 14px rgba(0,0,0,0.95), inset -6px 0 14px rgba(0,0,0,0.95)' }}>
                    <div style={{ position: 'absolute', inset: 0, background: 'repeating-linear-gradient(158deg, transparent 0px, transparent 18px, rgba(201,137,42,0.13) 18px, rgba(201,137,42,0.13) 19px, transparent 19px, transparent 36px, rgba(201,137,42,0.07) 36px, rgba(201,137,42,0.07) 37px)', pointerEvents: 'none' }} />
                  </div>
                </>)}
                {exercise.weighted && (<>
                  <div style={{ flex: 1, background: 'linear-gradient(160deg,#1c1a12 0%,#0f0d07 100%)', border: '1px solid rgba(201,137,42,0.5)', borderRadius: 10, padding: '14px 8px', display: 'flex', flexDirection: 'column', gap: 10, alignItems: 'center' }}>
                    <div className="font-display" style={{ fontSize: 11, color: 'rgba(201,137,42,0.9)', letterSpacing: '0.14em', textAlign: 'center', fontWeight: 700 }}>WEIGHT (KG)</div>
                    <input type="number" inputMode="decimal" value={set.weight} onChange={(e) => updateSet(idx, 'weight', e.target.value)} placeholder="0" min="0" step="0.5" style={{ fontSize: 36, color: 'var(--gold)', fontWeight: 900, padding: '10px 0', border: '1px solid rgba(201,137,42,0.3)', borderRadius: 8, background: 'rgba(0,0,0,0.9)', width: '100%', boxShadow: 'inset 0 0 16px rgba(0,0,0,0.8)' }} />
                  </div>
                  <div style={{ width: 44, flexShrink: 0, margin: '-16px 0', alignSelf: 'stretch', position: 'relative', background: 'radial-gradient(ellipse at 40% 50%, #2e2610 0%, #181308 55%, #060502 100%)', borderLeft: '1.5px solid rgba(201,137,42,0.8)', borderRight: '1.5px solid rgba(201,137,42,0.8)', boxShadow: 'inset 6px 0 14px rgba(0,0,0,0.95), inset -6px 0 14px rgba(0,0,0,0.95)' }}>
                    <div style={{ position: 'absolute', inset: 0, background: 'repeating-linear-gradient(158deg, transparent 0px, transparent 18px, rgba(201,137,42,0.13) 18px, rgba(201,137,42,0.13) 19px, transparent 19px, transparent 36px, rgba(201,137,42,0.07) 36px, rgba(201,137,42,0.07) 37px)', pointerEvents: 'none' }} />
                  </div>
                </>)}
                <div style={{ flex: 1, background: 'linear-gradient(160deg,#1c1a12 0%,#0f0d07 100%)', border: '1px solid rgba(201,137,42,0.5)', borderRadius: 10, padding: '14px 8px', display: 'flex', flexDirection: 'column', gap: 10, alignItems: 'center' }}>
                  <div className="font-display" style={{ fontSize: 11, color: 'rgba(201,137,42,0.9)', letterSpacing: '0.14em', textAlign: 'center', fontWeight: 700 }}>TIME (S){isTimed ? ' *' : ''}</div>
                  <input type="number" inputMode="decimal" value={set.time} onChange={(e) => updateSet(idx, 'time', e.target.value)} placeholder="0" min="0" step="0.1" style={{ fontSize: 36, color: 'var(--gold)', fontWeight: 900, padding: '10px 0', border: '1px solid rgba(201,137,42,0.3)', borderRadius: 8, background: 'rgba(0,0,0,0.9)', width: '100%', boxShadow: 'inset 0 0 16px rgba(0,0,0,0.8)' }} />
                </div>
              </div>
              {isTimed && !timerRunning && (<button type="button" className="btn btn-iron" onClick={() => startTimerFor(idx)} style={{ marginTop: 8, padding: '6px 10px', fontSize: 11, width: '100%' }}>⌛ STOPWATCH → SET {idx + 1}</button>)}
            </div>
          ))}
        </div>
        <div style={{ marginTop: 24, boxShadow: '0 0 28px rgba(201,137,42,0.5), 0 0 55px rgba(201,137,42,0.22), 0 0 90px rgba(201,137,42,0.08)', borderRadius: 4 }}>
          <button type="button" onClick={addSet} style={{ display: 'block', width: '100%', padding: '22px 20px', fontSize: 22, letterSpacing: '0.18em', fontWeight: 900, color: 'rgba(215,165,55,0.95)', background: 'linear-gradient(180deg,#1c1810 0%,#0d0a05 100%)', border: '2px solid rgba(201,137,42,0.85)', borderRadius: 4, clipPath: 'polygon(18px 0%, calc(100% - 18px) 0%, 100% 18px, 100% calc(100% - 18px), calc(100% - 18px) 100%, 18px 100%, 0% calc(100% - 18px), 0% 18px)', cursor: 'pointer', fontFamily: 'inherit' }}>LOG SET</button>
        </div>
      </div>
      <div style={{ padding: '12px 20px 0' }}>
        <button type="button" onClick={() => setMarkAsPR(p => !p)} className={markAsPR ? 'btn' : 'btn btn-iron'} style={{ width: '100%', padding: '12px', fontSize: 12, letterSpacing: '0.02em' }}>{markAsPR ? '★ MARKED AS PR' : '☆ MARK AS NEW PR'}</button>
        <div className="font-ui" style={{ fontSize: 11, color: 'var(--text-faint)', textAlign: 'center', marginTop: 6, fontStyle: 'italic' }}>{markAsPR ? '✓ This entry will be saved to the Hall of Records. Bonus +75 XP.' : 'A new PR is also detected automatically. Toggle for a manual entry.'}</div>
      </div>
      <div style={{ padding: '12px 20px 24px' }}>
        <button type="button" className="btn glow-gold" onClick={handleSave} disabled={!canSave()} style={{ width: '100%', fontSize: 15, padding: '16px', opacity: canSave() ? 1 : 0.4 }}>SAVE WORKOUT</button>
      </div>
    </div>
  );
}

function TasksScreen({ state }) {
  const isStory = state.mode === 'story';
  const [tab, setTab] = useState('quests');
  return (
    <div style={{ paddingBottom: 24 }}>
      <div className="safe-top" style={{ padding: '20px 20px 8px' }}>
        <div className="font-display" style={{ fontSize: 28, fontWeight: 900, color: 'var(--gold)', letterSpacing: '0.02em', marginTop: 4 }}>TASKS</div>
      </div>
      <div style={{ padding: '8px 20px 0' }}>
        <div style={{ display: 'flex', gap: 6 }}>
          <button type="button" onClick={() => setTab('quests')} className={tab==='quests' ? 'btn' : 'btn btn-iron'} style={{ flex: 1, padding: '10px', fontSize: 11 }}>QUESTS</button>
          <button type="button" onClick={() => setTab('boss')} className={tab==='boss' ? 'btn' : 'btn btn-iron'} style={{ flex: 1, padding: '10px', fontSize: 11 }}>BOSS</button>
          {isStory && <button type="button" onClick={() => setTab('story')} className={tab==='story' ? 'btn' : 'btn btn-iron'} style={{ flex: 1, padding: '10px', fontSize: 11 }}>STORY</button>}
        </div>
      </div>
      {tab === 'quests' ? <QuestsScreen state={state} embedded /> : tab === 'boss' ? <BossesScreen state={state} embedded /> : <StoryScreen state={state} embedded />}
    </div>
  );
}

function QuestsScreen({ state, embedded }) {
  const quests = getWeeklyQuests();
  const isStory = state.mode === 'story';
  return (
    <div style={{ paddingBottom: embedded ? 0 : 24 }}>
      {!embedded && (
        <div className="safe-top" style={{ padding: '20px 20px 8px' }}>
          <div className="font-display" style={{ fontSize: 28, fontWeight: 900, color: 'var(--gold)', letterSpacing: '0.02em', marginTop: 4 }}>QUESTS</div>
          <div className="font-ui" style={{ fontSize: 13, color: 'var(--text-dim)', marginTop: 6, fontStyle: 'italic' }}>Week {state.questWeek || getISOWeek()} · Resets Monday</div>
        </div>
      )}
      <div style={{ padding: '12px 20px', display: 'flex', flexDirection: 'column', gap: 12 }}>
        {quests.map((q, i) => {
          const progress = state.questProgress?.[q.id] || 0;
          const pct = Math.min(100, (progress / q.target) * 100);
          const complete = progress >= q.target;
          const title = isStory && q.storyTitle ? q.storyTitle : q.title;
          const desc = isStory && q.storyDesc ? q.storyDesc : q.desc;
          return (
            <div key={q.id} className="panel carved rise" style={{ animationDelay: `${0.05 + i*0.07}s`, padding: '18px', borderColor: complete ? 'var(--moss)' : 'var(--line)', backgroundImage: 'var(--quest-card-bg-img)', backgroundSize: 'cover', backgroundPosition: 'center' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 12 }}>
                <div style={{ flex: 1 }}>

function SpaceDust() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const W = canvas.width = canvas.offsetWidth || window.innerWidth;
    const H = canvas.height = canvas.offsetHeight || window.innerHeight;
    const ctx = canvas.getContext('2d');
    const colors = ['rgba(180,200,255,', 'rgba(200,160,255,', 'rgba(255,220,180,', 'rgba(140,200,255,', 'rgba(255,255,255,'];
    const dust = Array.from({ length: 120 }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: 0.4 + Math.random() * 2.2,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.25,
      op: 0.15 + Math.random() * 0.55,
      dop: (Math.random() - 0.5) * 0.004,
      color: colors[Math.floor(Math.random() * colors.length)],
    }));
    // Několik větších mlhovin
    const nebulae = Array.from({ length: 6 }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: 18 + Math.random() * 35,
      vx: (Math.random() - 0.5) * 0.12,
      vy: (Math.random() - 0.5) * 0.08,
      op: 0.04 + Math.random() * 0.1,
      color: Math.random() < 0.5 ? 'rgba(100,80,220,' : 'rgba(60,140,255,',
    }));
    let raf;
    function draw() {
      ctx.clearRect(0, 0, W, H);
      nebulae.forEach(n => {
        const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
        g.addColorStop(0, n.color + n.op + ')');
        g.addColorStop(1, n.color + '0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill();
        n.x += n.vx; n.y += n.vy;
        if (n.x < -n.r) n.x = W + n.r;
        if (n.x > W + n.r) n.x = -n.r;
        if (n.y < -n.r) n.y = H + n.r;
        if (n.y > H + n.r) n.y = -n.r;
      });
      dust.forEach(d => {
        d.op = Math.max(0.05, Math.min(0.75, d.op + d.dop));
        if (d.op <= 0.05 || d.op >= 0.75) d.dop *= -1;
        ctx.globalAlpha = d.op;
        ctx.fillStyle = d.color + '1)';
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
        d.x += d.vx; d.y += d.vy;
        if (d.x < 0) d.x = W; if (d.x > W) d.x = 0;
        if (d.y < 0) d.y = H; if (d.y > H) d.y = 0;
      });
      ctx.globalAlpha = 1;
      raf = requestAnimationFrame(draw);
    }
    draw();
    return () => cancelAnimationFrame(raf);
  }, []);
  return <canvas ref={ref} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none' }} />;
}

function VortexParticles() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width = canvas.offsetWidth || window.innerWidth;
    const H = canvas.height = canvas.offsetHeight || window.innerHeight;
    const vx = W * 0.5, vy = H * 0.28;
    const particles = Array.from({ length: 70 }, () => ({
      x: Math.random() * W, y: H * 0.4 + Math.random() * H * 0.6,
      size: 0.8 + Math.random() * 2.5,
      speedX: (Math.random() - 0.5) * 0.6,
      speedY: -(0.4 + Math.random() * 1.0),
      op: 0.2 + Math.random() * 0.5,
      hue: Math.random() < 0.6 ? '100,160,255' : '160,80,255',
    }));
    let raf;
    function draw() {
      ctx.clearRect(0, 0, W, H);
      particles.forEach(p => {
        const dx = vx - p.x, dy = vy - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        p.x += p.speedX + dx / dist * 0.3;
        p.y += p.speedY + dy / dist * 0.3;
        ctx.globalAlpha = p.op * Math.min(1, dist / 120);
        ctx.fillStyle = `rgba(${p.hue},1)`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        if (dist < 40 || p.op < 0.05) {
          p.x = Math.random() * W; p.y = H * 0.5 + Math.random() * H * 0.5;
          p.op = 0.2 + Math.random() * 0.5;
        }
      });
      ctx.globalAlpha = 1;
      raf = requestAnimationFrame(draw);
    }
    draw();
    return () => cancelAnimationFrame(raf);
  }, []);
  return <canvas ref={ref} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none' }} />;
}

function RainCanvas() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.offsetWidth || 400; const H = canvas.offsetHeight || 380;
    canvas.width = W; canvas.height = H;
    const drops = Array.from({ length: 130 }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      len: 14 + Math.random() * 18, speed: 7 + Math.random() * 9,
      op: 0.12 + Math.random() * 0.28,
    }));
    let raf;
    function draw() {
      ctx.clearRect(0, 0, W, H);
      drops.forEach(d => {
        ctx.globalAlpha = d.op;
        ctx.strokeStyle = 'rgba(190,215,255,1)';
        ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.len * 0.18, d.y + d.len); ctx.stroke();
        d.y += d.speed;
        if (d.y > H + d.len) { d.y = -d.len; d.x = Math.random() * W; }
      });
      ctx.globalAlpha = 1;
      raf = requestAnimationFrame(draw);
    }
    draw();
    return () => cancelAnimationFrame(raf);
  }, []);
  return <canvas ref={ref} style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none', zIndex: 2 }} />;
}

function makeBoltPath(x1, y1, x2, y2, spread, segs) {
  const pts = [[x1, y1]];
  for (let i = 1; i < segs; i++) {
    const t = i / segs;
    pts.push([x1 + (x2 - x1) * t + (Math.random() - 0.5) * spread * (1 - t * 0.5), y1 + (y2 - y1) * t]);
  }
  pts.push([x2, y2]);
  return pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
}

function LightningFlash() {
  const [state, setState] = React.useState({ bolts: [], flash: 0 });
  React.useEffect(() => {
    let t;
    function strike() {
      const W = window.innerWidth, H = window.innerHeight;
      const positions = [
        W * 0.22 + Math.random() * 40,
        W * 0.5  + (Math.random() - 0.5) * 60,
        W * 0.78 - Math.random() * 40,
      ];
      const count = Math.random() < 0.4 ? 3 : Math.random() < 0.6 ? 2 : 1;
      const chosen = positions.sort(() => Math.random() - 0.5).slice(0, count);
      const bolts = chosen.map(sx => {
        const ex = sx + (Math.random() - 0.5) * 100;
        const ey = H * (0.45 + Math.random() * 0.35);
        const main = makeBoltPath(sx, -10, ex, ey, 55, 14);
        const bi = 4 + Math.floor(Math.random() * 4);
        const bx = ex + (Math.random() - 0.5) * 90;
        const by = ey - H * 0.15 + Math.random() * H * 0.15;
        const branch = makeBoltPath(ex, ey * (bi / 14), bx, by, 25, 7);
        return { main, branch, id: Math.random() };
      });
      setState({ bolts, flash: 1 });
      setTimeout(() => setState(s => ({ ...s, flash: 0.5 })), 70);
      setTimeout(() => setState(s => ({ ...s, flash: 0.8 })), 140);
      setTimeout(() => setState(s => ({ ...s, flash: 0.2 })), 230);
      setTimeout(() => setState({ bolts: [], flash: 0 }), 380);
      t = setTimeout(strike, 6000 + Math.random() * 6000);
    }
    t = setTimeout(strike, 1500 + Math.random() * 2000);
    return () => clearTimeout(t);
  }, []);
  if (state.bolts.length === 0 && state.flash === 0) return null;
  return (
    <div style={{ position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 5 }}>
      {state.flash > 0 && <div style={{ position: 'absolute', inset: 0, background: `rgba(160,210,255,${state.flash * 0.18})` }} />}
      <svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', overflow: 'visible' }}>
        <defs>
          <filter id="lglow" x="-50%" y="-10%" width="200%" height="120%">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        {state.bolts.map(b => (
          <g key={b.id} style={{ opacity: state.flash }}>
            <path d={b.main} stroke="rgba(100,170,255,0.55)" strokeWidth="10" fill="none" strokeLinecap="round" filter="url(#lglow)"/>
            <path d={b.main} stroke="rgba(200,230,255,0.85)" strokeWidth="3"  fill="none" strokeLinecap="round"/>
            <path d={b.main} stroke="white"                  strokeWidth="1.2" fill="none" strokeLinecap="round"/>
            <path d={b.branch} stroke="rgba(100,170,255,0.4)" strokeWidth="6" fill="none" strokeLinecap="round" filter="url(#lglow)"/>
            <path d={b.branch} stroke="rgba(200,230,255,0.7)" strokeWidth="2" fill="none" strokeLinecap="round"/>
          </g>
        ))}
      </svg>
    </div>
  );
}

              </div>
              <div style={{ marginTop: 12, display: 'flex', gap: 8 }}>
                <button type="button" className="btn btn-iron" onClick={onBackupNow} style={{ flex: 1, padding: '10px', fontSize: 11 }}>☁ BACKUP NOW</button>
                <button type="button" className="btn btn-iron" onClick={onRestoreBackup} style={{ flex: 1, padding: '10px', fontSize: 11 }}>⤓ RESTORE</button>
              </div>
              <button type="button" onClick={() => setShowRecovery(s => !s)} style={{ marginTop: 10, background: 'transparent', border: 'none', color: 'var(--text-faint)', fontSize: 11, textDecoration: 'underline', cursor: 'pointer', padding: 0 }}>I have a recovery code from another device</button>
              {showRecovery && (
                <div style={{ marginTop: 10, display: 'flex', gap: 8 }}>
                  <input type="text" value={recoveryInput} onChange={(e) => setRecoveryInput(e.target.value)} placeholder="PASTE RECOVERY CODE" style={{ fontSize: 16, padding: '8px 10px', fontFamily: 'monospace', letterSpacing: 0 }} />
                  <button type="button" className="btn" onClick={() => { onRestoreCode(recoveryInput); setRecoveryInput(''); setShowRecovery(false); }} style={{ padding: '8px 14px', fontSize: 11 }}>APPLY</button>
                </div>
              )}
              <div className="font-ui" style={{ fontSize: 10.5, color: 'var(--text-faint)', marginTop: 10, fontStyle: 'italic', lineHeight: 1.5 }}>Your recovery code: <span style={{ fontFamily: 'monospace', color: 'var(--text-dim)' }}>{state.licenseKey}</span> — save it before switching devices.</div>
            </div>
          )}
          <div className="panel" style={{ padding: 16 }}>
            <div className="font-display" style={{ fontSize: 10, color: 'var(--text-faint)', letterSpacing: '0.02em', marginBottom: 10, fontWeight: 700 }}>LEGAL</div>
            <div style={{ display: 'flex', gap: 8 }}>
              <button type="button" className="btn btn-iron" onClick={() => setLegalDoc('terms')} style={{ flex: 1, padding: '10px', fontSize: 12 }}>TERMS</button>
              <button type="button" className="btn btn-iron" onClick={() => setLegalDoc('privacy')} style={{ flex: 1, padding: '10px', fontSize: 12 }}>PRIVACY</button>
            </div>
            <div className="font-ui" style={{ fontSize: 11, color: 'var(--text-faint)', marginTop: 10, fontStyle: 'italic', lineHeight: 1.5 }}>You can withdraw consent to health-data processing by resetting your data below.</div>
          </div>
          <div className="panel" style={{ padding: 16, borderColor: 'var(--blood-2)' }}>
            <div className="font-display" style={{ fontSize: 10, color: 'var(--blood-2)', letterSpacing: '0.02em', marginBottom: 8, fontWeight: 700 }}>DANGER ZONE</div>
            <button type="button" className="btn btn-iron" onClick={async () => { await window._fbAuth.signOut(); window.location.reload(); }} style={{ width: '100%', marginBottom: 8 }}>→ SIGN OUT</button>
            {!confirmReset ? (
              <button type="button" className="btn btn-blood" onClick={() => setConfirmReset(true)} style={{ width: '100%' }}>↺ RESET CHARACTER</button>
            ) : (
              <>
                <div className="font-ui" style={{ fontSize: 13, color: 'var(--text)', marginBottom: 10, fontStyle: 'italic' }}>Deletes all progress. No going back.</div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <button type="button" className="btn btn-iron" onClick={() => setConfirmReset(false)} style={{ flex: 1, padding: '10px' }}>CANCEL</button>
                  <button type="button" className="btn btn-blood" onClick={onReset} style={{ flex: 1, padding: '10px' }}>CONFIRM</button>
                </div>
              </>
            )}
          </div>
        </ProfileSection>
      </div>
      <LegalModal doc={legalDoc} onClose={() => setLegalDoc(null)} />
    </div>
  );
}

  const [showRecovery, setShowRecovery] = useState(false);
  const [code, setCode] = useState('');
  const PERKS = [
    { icon: '☁', text: 'Cloud backup — never lose your character switching phones' },
    { icon: '⚡', text: '+10% XP on every workout, forever' },
    { icon: '✦', text: 'Exclusive Olympian aura on your avatar' },
    { icon: '♥', text: 'Funds development of new chapters & features' },
  ];
  return (
    <div className="levelup-overlay" onClick={onClose} style={{ background: 'radial-gradient(circle at 50% 20%, rgba(201,137,42,0.20), rgba(8,9,10,0.97) 70%)' }}>
      <div className="panel-strong carved" onClick={(e) => e.stopPropagation()} style={{ padding: '26px 22px', maxWidth: 380, width: '92%', maxHeight: '88dvh', overflowY: 'auto' }}>
        <div className="font-display" style={{ fontSize: 11, color: 'var(--gold-2)', letterSpacing: '0.04em', fontWeight: 700, textAlign: 'center' }}>UPGRADE</div>
        <div className="font-display" style={{ fontSize: 28, color: 'var(--gold)', fontWeight: 900, letterSpacing: '0.02em', marginTop: 4, textAlign: 'center', fontFamily: 'Cinzel' }}>PANTHEON+</div>
        <div style={{ marginTop: 18, display: 'flex', flexDirection: 'column', gap: 10 }}>
          {PERKS.map((p, i) => (
            <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
              <span style={{ fontSize: 16, color: 'var(--gold)', width: 20, textAlign: 'center', flexShrink: 0 }}>{p.icon}</span>
              <span className="font-ui" style={{ fontSize: 13.5, color: 'var(--text-dim)', lineHeight: 1.4 }}>{p.text}</span>
            </div>
          ))}
        </div>
        <div style={{ display: 'flex', gap: 8, marginTop: 20 }}>
          <button type="button" onClick={() => setPlan('monthly')} className="card" style={{ flex: 1, padding: '14px 10px', textAlign: 'center', borderColor: plan === 'monthly' ? 'var(--gold)' : 'var(--line)' }}>
            <div className="font-display" style={{ fontSize: 13, color: 'var(--text)', fontWeight: 900 }}>MONTHLY</div>
            <div className="font-display" style={{ fontSize: 18, color: 'var(--gold)', fontWeight: 900, marginTop: 4 }}>$4.99</div>
          </button>
          <button type="button" onClick={() => setPlan('annual')} className="card" style={{ flex: 1, padding: '14px 10px', textAlign: 'center', borderColor: plan === 'annual' ? 'var(--gold)' : 'var(--line)', position: 'relative' }}>
            <div style={{ position: 'absolute', top: -9, right: 8, background: 'var(--crimson)', color: 'var(--bone)', fontSize: 9, fontWeight: 900, padding: '2px 6px', borderRadius: 6 }}>SAVE 50%</div>
            <div className="font-display" style={{ fontSize: 13, color: 'var(--text)', fontWeight: 900 }}>ANNUAL</div>
            <div className="font-display" style={{ fontSize: 18, color: 'var(--gold)', fontWeight: 900, marginTop: 4 }}>$29.99</div>
          </button>
        </div>
        <button type="button" className="btn glow-gold" onClick={() => onCheckout(plan)} style={{ width: '100%', padding: '15px', fontSize: 14, marginTop: 16 }}>▸ UNLOCK PANTHEON+</button>
        <button type="button" className="btn btn-iron" onClick={onClose} style={{ width: '100%', padding: '10px', fontSize: 12, marginTop: 8 }}>MAYBE LATER</button>
        <button type="button" onClick={() => setShowRecovery(s => !s)} style={{ marginTop: 14, width: '100%', background: 'transparent', border: 'none', color: 'var(--text-faint)', fontSize: 11, textDecoration: 'underline', cursor: 'pointer', padding: 0 }}>Already a member? Restore with recovery code</button>
        {showRecovery && (
          <div style={{ marginTop: 10, display: 'flex', gap: 8 }}>
            <input type="text" value={code} onChange={(e) => setCode(e.target.value)} placeholder="PASTE RECOVERY CODE" style={{ fontSize: 16, padding: '8px 10px', fontFamily: 'monospace', letterSpacing: 0 }} />
            <button type="button" className="btn" onClick={() => { onRestoreCode(code); setCode(''); }} style={{ padding: '8px 14px', fontSize: 11 }}>APPLY</button>
          </div>
        )}
      </div>
    </div>
  );
}

function BottomNav({ active, onChange }) {
  const tabs = [ { id: 'hub', label: 'Home' }, { id: 'train', label: 'Training' }, { id: 'tasks', label: 'Tasks' }, { id: 'pr', label: 'Records' }, { id: 'profile', label: 'Profile' } ];
  const idx = Math.max(0, tabs.findIndex(t => t.id === active));
  const pct = 100 / tabs.length;
  return (
    <div className="nav-bottom">
      <div className="nav-indicator" style={{ width: `${pct}%`, transform: `translateX(${idx * 100}%)` }} />
      {tabs.map(t => (<button key={t.id} type="button" className={`nav-btn ${active === t.id ? 'active' : ''}`} onClick={() => onChange(t.id)}><span>{t.label}</span></button>))}
    </div>
  );
}

function WallBreakIntro({ state, onDone }) {
  const [phase, setPhase] = useState(0);
  useEffect(() => { const t1 = setTimeout(() => setPhase(1), 600); const t2 = setTimeout(() => onDone(), 1600); return () => { clearTimeout(t1); clearTimeout(t2); }; }, []);
  const rank = rankFor(state.bossesDefeated || 0);
  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 200, background: '#0b0c0d', display: 'flex', alignItems: 'center', justifyContent: 'center', opacity: phase < 1 ? 1 : 0, transition: 'opacity 0.7s ease-out', pointerEvents: phase < 1 ? 'auto' : 'none' }}>
      <div style={{ textAlign: 'center', padding: 24 }}>
        <div className="rise" style={{ animationDelay: '0.05s' }}><img src="imgs/logo.png" alt="SPARTA" style={{ width: 96, height: 96, borderRadius: 22, objectFit: 'cover', boxShadow: '0 12px 36px rgba(0,0,0,0.6)' }} /></div>
        <div className="rise" style={{ animationDelay: '0.2s', marginTop: 20 }}>
          <div style={{ fontSize: 20, fontWeight: 700, color: 'var(--bone)', letterSpacing: '-0.01em' }}>Welcome, {(state.name || 'Spartan').toUpperCase()}</div>
          <div className="font-ui" style={{ fontSize: 13, color: 'var(--text-dim)', marginTop: 4 }}>{rank.label} · Lv {state.level || 1}</div>
        </div>
      </div>
    </div>
  );
}

async function shareLevelCard({ name, level, rankLabel, accent }) {
  const canvas = document.createElement('canvas');
  canvas.width = 1080; canvas.height = 1080;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(540, 420, 80, 540, 540, 760);
  grad.addColorStop(0, '#221c14'); grad.addColorStop(1, '#0c0a08');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, 1080, 1080);
  ctx.textAlign = 'center';
  ctx.fillStyle = accent || '#c9892a';
  ctx.font = '700 38px Rajdhani, sans-serif';
  ctx.fillText('PANTHEON', 540, 220);
  ctx.font = '900 64px Cinzel, serif';
  ctx.fillText((name || 'SPARTAN').toUpperCase(), 540, 480);
  ctx.font = '900 220px Cinzel, serif';
  ctx.fillText(`Lv.${level}`, 540, 720);
  ctx.font = '700 34px Rajdhani, sans-serif';
  ctx.fillStyle = '#f2eadc';
  ctx.fillText(rankLabel || '', 540, 800);
  ctx.font = 'italic 28px Rajdhani, sans-serif';
  ctx.fillStyle = '#c0b59c';
  ctx.fillText('Training you remember.', 540, 940);

  const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
  if (!blob) return;
  const file = new File([blob], 'pantheon-levelup.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'PANTHEON', text: `I just hit Level ${level} in PANTHEON.` }); return; } catch {}
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'pantheon-levelup.png'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function LevelUpOverlay({ newLevel, rankUp, newRank, state, onClose }) {
  const [stage, setStage] = useState(0);
  useEffect(() => { const t1 = setTimeout(() => setStage(1), 200); const t2 = setTimeout(() => setStage(2), 800); const t3 = setTimeout(() => setStage(3), 1600); return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); }; }, []);
  const r = RANKS.find(rk => rk.id === newRank);
  const colorMap = {
    'var(--iron)': '#6f7480', 'var(--bronze)': '#8a5a23', 'var(--steel)': '#c2cdd6', 'var(--bone)': '#f0e8d8',
    'var(--blue-2)': '#88c0cc', 'var(--crimson)': '#c2342a', 'var(--blood-2)': '#e64a3a',
    'var(--royal)': '#8a6acc', 'var(--magenta-2)': '#d65580',
    'var(--gold)': '#c9892a', 'var(--gold-2)': '#e8a93a'
  };
  const accent = rankUp ? (colorMap[r?.color] || '#c9892a') : '#c9892a';
  return (
    <div className="levelup-overlay" onClick={onClose}>
      {stage >= 1 && Array.from({ length: 3 }).map((_, i) => (<div key={i} style={{ position: 'absolute', width: 100, height: 100, borderRadius: '50%', border: `2px solid ${accent}`, animation: `shockwave ${1.4 + i * 0.3}s ease-out forwards`, animationDelay: `${i * 0.15}s` }} />))}
      <div className="burst" style={{ textAlign: 'center', zIndex: 10 }}>
        <div className="font-rune pulse-glow" style={{ fontSize: 92, color: accent, lineHeight: 1 }}>{rankUp ? r?.rune : 'ᛏ'}</div>
        <div className="font-display" style={{ fontSize: 14, letterSpacing: '0.02em', color: 'var(--text-dim)', marginTop: 14, fontWeight: 700 }}>{rankUp ? '◆ RANK UP ◆' : '◆ NEW LEVEL ◆'}</div>
        <div className="font-display" style={{ fontSize: 64, fontWeight: 900, color: accent, letterSpacing: '0.02em', marginTop: 8 }}>Lv.{newLevel}</div>
        {rankUp && (<div className="font-display" style={{ fontSize: 18, color: accent, letterSpacing: '0.02em', marginTop: 8, fontWeight: 900 }}>{r?.label}</div>)}
      </div>
      {stage >= 3 && (
        <div style={{ marginTop: 32, display: 'flex', gap: 10 }}>
          <button type="button" onClick={() => shareLevelCard({ name: state.name, level: newLevel, rankLabel: r?.label, accent })} className="btn btn-iron" style={{ padding: '14px 22px', fontSize: 13 }}>↗ SHARE</button>
          <button type="button" onClick={onClose} className="btn glow-gold" style={{ padding: '14px 40px', fontSize: 14 }}>▸ CONTINUE</button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
