<style>
  script { display: none !important; }
  :root {
    /* === PANTHEON REFORGED — 5-hue Olympus palette ===
       Bronze (primary accent), Crimson (combat/PR), Aegean (agility/sea),
       Olive (recovery), Royal violet (king-tier). Backgrounds run warm
       so the bronze doesn't fight a cold blue-black. */
    --bg:        #0c0a08;          /* Warm near-black */
    --bg-2:      #16120e;
    --bg-3:      #221c14;
    --panel:     rgba(28, 23, 17, 0.92);
    --panel-2:   rgba(40, 33, 24, 0.95);
    /* Ambient background mood (overridden per-theme, see THEMES + ambient-bg) */
    --ambient-a: rgba(122,140,58,0.16);
    --ambient-b: rgba(168,72,24,0.18);
    --ash-color: #b9ad96;
    --shadow:    #050403;

    /* Lines warm-bronzy so they blend on warm bg */
    --line:      rgba(190, 158, 110, 0.16);
    --line-2:    rgba(190, 158, 110, 0.42);

    /* === Bronze/Gold (PRIMARY accent — UI, XP, ranks) === */
    --gold:      #d87a18;          /* Fire amber */
    --gold-2:    #e8a93a;          /* Brighter solar gold */
    --bronze:    #8a5a23;          /* Aged bronze */

    /* === Crimson/Blood (SECONDARY — PR, boss, combat) === */
    --crimson:   #c2342a;
    --blood:     #a81f18;
    --blood-2:   #e64a3a;          /* Brighter blood, stands out vs bronze */

    /* === Aegean (TERTIARY — sea, scout, agility, calisthenics) === */
    --aegean:    #2f8fa0;
    --aegean-2:  #4dbac8;
    --blue:      #5d97a8;          /* Now actually teal-blue */
    --blue-2:    #88c0cc;          /* Light aegean */

    /* === Royal violet (rare — king ranks, machines) === */
    --magenta:   #b03a64;          /* Wine */
    --magenta-2: #d65580;
    --royal:     #8a6acc;
    --violet:    #8a6acc;          /* alias for legacy refs */
    --indigo:    #4a5078;          /* Deep midnight */

    /* === Olive/Jade (recovery — yoga, stretching, running) === */
    --jade:      #9aa356;
    --moss:      #6f7c44;
    --olive:     #b8c266;

    /* === Metal === */
    --steel:     #c2cdd6;          /* Polished steel */
    --iron:      #6f7480;
    --bone:      #f0e8d8;          /* Warm marble white */
    --ice:       #c6d6dc;

    /* === Text — warm to match palette === */
    --text:      #f2eadc;          /* Warm marble */
    --text-dim:  #c0b59c;          /* Aged parchment (was #9aa1a8 — too cold) */
    --text-faint:#928774;          /* Faded ink (still ≥4.5:1 on warm-black) */
    --card-bg-img:   url('imgs/img0.jpg');
    --card-bg-hover: url('imgs/img1.jpg');
    --boss-card-bg-img: url('imgs/img2.jpg');
    --achiev-card-bg-img: url('imgs/img3.jpg');
    --xpbar-bg-img: url('imgs/img4.jpg');
    --quest-card-bg-img: url('imgs/img5.jpg');
    --story-panel-bg-img: url('imgs/img6.jpg');
    --tasks-panel-bg-img: url('imgs/img7.jpg');
    --btn-bg-img: url('imgs/img8.jpg');
    --nav-bg-img: url('imgs/img9.jpg');
    --statbar-bg-img: url('imgs/img10.jpg');
    --avatar-frame-bg-img: url('imgs/img11.jpg');
    --profile-stats-bg-img: url('imgs/img12.jpg');
    --path-active-bg-img: url('imgs/img13.jpg');
    --path-inactive-bg-img: url('imgs/img14.jpg');
    --abilities-bg-img: url('imgs/img15.jpg');
    --str-bg-img: url('imgs/img16.jpg')
    --agi-bg-img: url('imgs/img17.jpg')
    --vit-bg-img: url('imgs/img18.jpg')
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
  html, body {
    margin: 0; padding: 0;
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 500;
    overflow-x: hidden;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-text-size-adjust: 100%;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  body { background-color: var(--bg); background-attachment: fixed; transition: background-color 0.6s ease; }
  body:not(.in-game){background-image:url('imgs/img19.jpg');background-size:cover;background-position:center center;background-attachment:scroll;}
  body.in-game { background: transparent !important; }
  #root { min-height: 100vh; min-height: 100dvh; }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  /* Ambient atmosphere: the world's weather mirrors story progress. Early on the gods'
     realm is a dying storm (drifting fog + Zeus's distant lightning + gloom); as the hero
     levels up it calms, the fog thins and the lightning fades, then it clears into sunbeams
     and golden motes. Lore/copy never changes — this is purely an environmental "the world
     is healing" layer, independent of the chosen THEME palette (which only tints the
     warm/cool glow blobs below). */
  .ambient-bg {
    position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    --weather-speed: 1; --p-w: 2.5px; --p-h: 2.5px; --p-radius: 50%; --p-color: var(--ash-color); --p-glow: 3px;
    --gloom-opacity: 0.3; --rays-opacity: 0; --fog-opacity: 0; --lightning-mult: 0; --skyline-glow-opacity: 0;
    /* City skyline: ordinary flat-roofed skyscrapers of varying width/height, a couple
       with antenna spikes. Shared between the dark silhouette and its golden "lights
       coming on" glow below so both layers trace the exact same buildings. */
    --skyline-shape: polygon(
      0% 100%, 0% 50%, 5% 50%, 5% 100%, 6% 100%, 6% 65%, 13% 65%, 13% 100%, 14% 100%, 14% 40%,
      16% 40%, 16.5% 28%, 17% 40%, 20% 40%, 20% 100%, 21% 100%, 21% 75%, 27% 75%, 27% 100%,
      28% 100%, 28% 55%, 36% 55%, 36% 100%, 37% 100%, 37% 85%, 44% 85%, 44% 100%, 45% 100%,
      45% 30%, 47% 30%, 47.5% 16%, 48% 30%, 52% 30%, 52% 100%, 53% 100%, 53% 68%, 60% 68%,
      60% 100%, 61% 100%, 61% 48%, 68% 48%, 68% 100%, 69% 100%, 69% 72%, 77% 72%, 77% 100%,
      78% 100%, 78% 58%, 85% 58%, 85% 100%, 86% 100%, 86% 40%, 93% 40%, 93% 100%, 94% 100%,
      94% 62%, 100% 62%, 100% 100%
    );
  }
  .ambient-bg.weather-storm    { --weather-speed: 0.07; --p-w: 1.5px; --p-h: 26px; --p-radius: 1px; --p-color: rgba(200,218,235,0.8); --p-glow: 0px; --gloom-opacity: 0.6;  --rays-opacity: 0;    --fog-opacity: 0.55; --lightning-mult: 1;    --skyline-glow-opacity: 0; }
  .ambient-bg.weather-fading   { --weather-speed: 0.28; --p-w: 2px;   --p-h: 9px;  --p-radius: 2px; --p-color: rgba(205,215,225,0.5);  --p-glow: 1px; --gloom-opacity: 0.34; --rays-opacity: 0;    --fog-opacity: 0.26; --lightning-mult: 0.35; --skyline-glow-opacity: 0.06; }
  .ambient-bg.weather-clearing { --weather-speed: 0.7;  --p-w: 4px;   --p-h: 4px;  --p-radius: 50%; --p-color: rgba(255,255,255,0.75); --p-glow: 4px; --gloom-opacity: 0.12; --rays-opacity: 0.28; --fog-opacity: 0.08; --lightning-mult: 0;    --skyline-glow-opacity: 0.24; }
  .ambient-bg.weather-clear    { --weather-speed: 1.1;  --p-w: 2.5px; --p-h: 2.5px; --p-radius: 50%; --p-color: var(--gold-2);          --p-glow: 6px; --gloom-opacity: 0;    --rays-opacity: 0.55; --fog-opacity: 0;    --lightning-mult: 0;    --skyline-glow-opacity: 0.5; }
  .ambient-bg::before, .ambient-bg::after {
    content: ''; position: absolute; border-radius: 50%; filter: blur(70px); will-change: transform, opacity;
  }
  .ambient-bg::before {
    width: 75vmax; height: 75vmax; top: -28vmax; left: -22vmax;
    background: radial-gradient(circle, var(--ambient-a), transparent 70%);
    animation: ambient-drift-a 30s ease-in-out infinite;
  }
  .ambient-bg::after {
    width: 65vmax; height: 65vmax; bottom: -24vmax; right: -20vmax;
    background: radial-gradient(circle, var(--ambient-b), transparent 70%);
    animation: ambient-drift-b 36s ease-in-out infinite;
  }
  @keyframes ambient-drift-a { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(4vmax, 5vmax) scale(1.12); } }
  @keyframes ambient-drift-b { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-3vmax, -4vmax) scale(1.1); } }
  /* City skyline silhouette: dark and prominent always, the backdrop the hero trains
     against. */
  .ambient-skyline {
    position: absolute; left: 0; right: 0; bottom: 0; height: 30vh; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.78) 75%);
    clip-path: var(--skyline-shape);
    opacity: 0.62; filter: blur(0.4px);
  }
  /* Same skyline, lit from within with warm gold — barely an ember while the storm rages,
     a steady glow once the world has healed, as if the city's lights are coming back on. */
  .ambient-skyline-glow {
    position: absolute; left: 0; right: 0; bottom: 0; height: 30vh; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,205,130,0.65), rgba(255,170,80,0.2) 55%, transparent 82%);
    clip-path: var(--skyline-shape);
    mix-blend-mode: screen; filter: blur(1.5px);
    opacity: var(--skyline-glow-opacity); transition: opacity 1.8s ease;
  }
  /* Gloom vignette: corrupted/stormy world darkens the edges; fades to nothing once clear. */
  .gloom-overlay {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 28%, transparent 0%, rgba(4,6,8,0.85) 100%);
    opacity: var(--gloom-opacity); transition: opacity 1.4s ease;
  }
  /* Drifting fog banks crossing the realm — thick and slow while the world is corrupted,
     thinning to nothing once it heals. Reads as atmosphere, not a UI artifact. */
  .fog-layer {
    position: absolute; inset: -15% -25%; pointer-events: none; filter: blur(26px);
    background:
      linear-gradient(98deg, transparent 0%, rgba(180,190,205,0.5) 18%, transparent 34%),
      linear-gradient(98deg, transparent 50%, rgba(150,165,185,0.4) 66%, transparent 82%);
    background-size: 160% 160%;
    animation: fog-drift 42s linear infinite;
    opacity: var(--fog-opacity); transition: opacity 1.8s ease;
  }
  @keyframes fog-drift { from { background-position: 0% 0%, 0% 0%; } to { background-position: -140% 30%, -120% -20%; } }
  /* Zeus's distant wrath: a soft double-flash that flickers low on the horizon while the
     world is still a storm, then dies out entirely once it calms — no harsh strobing. */
  .lightning-flash {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
    background: radial-gradient(circle at 72% 20%, rgba(215,228,255,0.95), transparent 55%);
    animation: lightning-strike 11s ease-in-out infinite;
  }
  @keyframes lightning-strike {
    0%, 36%, 39%, 41%, 100% { opacity: 0; }
    37%   { opacity: calc(0.85 * var(--lightning-mult)); }
    37.6% { opacity: calc(0.1 * var(--lightning-mult)); }
    38.2% { opacity: calc(0.6 * var(--lightning-mult)); }
  }
  /* Sunbeams: only meaningfully visible once the storm has cleared (high tier). */
  .rays-layer {
    position: absolute; inset: -30%; pointer-events: none; mix-blend-mode: screen;
    background: repeating-conic-gradient(from 0deg at 50% -10%, rgba(255,221,150,0.11) 0deg 4deg, transparent 4deg 18deg);
    animation: rays-rotate 110s linear infinite;
    opacity: var(--rays-opacity); transition: opacity 1.4s ease;
  }
  @keyframes rays-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  /* Weather particles: thin sleet motes early on, fattening into snow/mist, then
     into slow golden fireflies once the world is calm — same 14 spans, different costume. */
  .embers { position: absolute; inset: 0; }
  .embers span {
    position: absolute; top: -10px; width: var(--p-w); height: var(--p-h); border-radius: var(--p-radius);
    background: var(--p-color); box-shadow: 0 0 var(--p-glow) 0.5px var(--p-color); opacity: 0;
    animation: ash-fall linear infinite; transition: width 1s ease, height 1s ease, background 1s ease;
  }
  @keyframes ash-fall {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.55; }
    90% { opacity: 0.2; }
    100% { transform: translateY(100vh) translateX(var(--drift, 20px)) rotate(40deg); opacity: 0; }
  }
  .embers span:nth-child(1)  { left: 4%;  animation-duration: calc(17s * var(--weather-speed)); animation-delay: 0s;   --drift: 18px; }
  .embers span:nth-child(2)  { left: 12%; animation-duration: calc(21s * var(--weather-speed)); animation-delay: 3s;   --drift: -24px; }
  .embers span:nth-child(3)  { left: 21%; animation-duration: calc(15s * var(--weather-speed)); animation-delay: 7s;   --drift: 14px; }
  .embers span:nth-child(4)  { left: 30%; animation-duration: calc(24s * var(--weather-speed)); animation-delay: 1s;   --drift: -16px; }
  .embers span:nth-child(5)  { left: 39%; animation-duration: calc(19s * var(--weather-speed)); animation-delay: 9s;   --drift: 22px; }
  .embers span:nth-child(6)  { left: 48%; animation-duration: calc(23s * var(--weather-speed)); animation-delay: 4s;   --drift: -20px; }
  .embers span:nth-child(7)  { left: 57%; animation-duration: calc(16s * var(--weather-speed)); animation-delay: 11s;  --drift: 16px; }
  .embers span:nth-child(8)  { left: 65%; animation-duration: calc(25s * var(--weather-speed)); animation-delay: 2s;   --drift: -18px; }
  .embers span:nth-child(9)  { left: 73%; animation-duration: calc(18s * var(--weather-speed)); animation-delay: 13s;  --drift: 20px; }
  .embers span:nth-child(10) { left: 81%; animation-duration: calc(22s * var(--weather-speed)); animation-delay: 6s;   --drift: -14px; }
  .embers span:nth-child(11) { left: 89%; animation-duration: calc(20s * var(--weather-speed)); animation-delay: 10s;  --drift: 18px; }
  .embers span:nth-child(12) { left: 96%; animation-duration: calc(26s * var(--weather-speed)); animation-delay: 0.5s; --drift: -22px; }
  .embers span:nth-child(13) { left: 55%; animation-duration: calc(14s * var(--weather-speed)); animation-delay: 15s;  --drift: 12px; }
  .embers span:nth-child(14) { left: 17%; animation-duration: calc(27s * var(--weather-speed)); animation-delay: 5s;   --drift: -12px; }
  .dust-particles { position: absolute; inset: 0; pointer-events: none; }
  .dust-particles span {
    position: absolute; bottom: -8px;
    border-radius: 50%; opacity: 0;
    animation: dust-rise linear infinite;
  }

function urlBase64ToUint8Array(base64) {
  const padded = (base64 + '='.repeat((4 - (base64.length % 4)) % 4)).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(padded);
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));

async function subscribeToReminders(licenseKey) {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return { ok: false, reason: 'unsupported' };
  const permission = await Notification.requestPermission();
  if (permission !== 'granted') return { ok: false, reason: 'denied' };
  const reg = await navigator.serviceWorker.ready;
  const subscription = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
  });
  const r = await api('/api/push-subscribe', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: licenseKey, subscription: subscription.toJSON() }),
  });
  return { ok: !!r };
}

  if (!PANTHEON_PLUS_API || PANTHEON_PLUS_API.includes('YOUR-SUBDOMAIN')) return null;

// ── Training intelligence (pure, deterministic, no AI) ─────────────────────
function estimate1RM(weight, reps) {
  if (reps <= 0 || weight <= 0) return 0;
  return weight * (1 + reps / 30);
}
const REPS_PCT = [[1,1.00],[3,0.93],[5,0.87],[8,0.80],[10,0.75],[12,0.70],[15,0.65]];
function getWorkingWeight(oneRM, targetReps) {
  const best = REPS_PCT.reduce((a,b) => Math.abs(b[0]-targetReps) < Math.abs(a[0]-targetReps) ? b : a);
  return Math.round(oneRM * best[1] / 2.5) * 2.5;
}
function getWarmupRamp(workingWeight) {
  return [
    { weight: Math.round(workingWeight * 0.4 / 2.5) * 2.5, reps: 8 },
    { weight: Math.round(workingWeight * 0.6 / 2.5) * 2.5, reps: 5 },
    { weight: Math.round(workingWeight * 0.8 / 2.5) * 2.5, reps: 3 },
  ];
}
const UPPER_BODY_CATS = new Set(['chest','back','shoulders','biceps','triceps','calisthenics']);
function nextWorkingWeightMap(exerciseId, categoryId, newHistory, prevWW) {
  const ww = (prevWW || {})[exerciseId];
  const relevant = (newHistory || []).filter(h => h.exerciseId === exerciseId && h.source !== 'onboarding');
  if (relevant.length === 0) return prevWW || {};
  const last = relevant[0];
  const lastSets = (last.sets||[]).filter(s => Number(s.reps) > 0 || Number(s.time) > 0);
  if (lastSets.length === 0) return prevWW || {};
  const lastSet = lastSets[lastSets.length - 1];
  const w = Number(lastSet.weight) || 0;
  const r = Number(lastSet.reps) || 0;
  const t = Number(lastSet.time) || 0;
  // Bootstrap: first time this exercise is logged — create tracking entry from actual performance
  if (!ww) {
    if (w > 0 && r > 0) return { ...prevWW, [exerciseId]: { weight: w, targetReps: r, failCount: 0, calibrating: false } };
    if (r > 0) return { ...prevWW, [exerciseId]: { weight: 0, targetReps: r, failCount: 0, calibrating: false } };
    if (t > 0) return { ...prevWW, [exerciseId]: { weight: 0, targetTime: Math.round(t), failCount: 0, calibrating: false } };
    return prevWW || {};
  }
  if (ww.calibrating) {
    if (w > 0 && r > 0) {
      const oneRM = estimate1RM(w, r);
      const workW = getWorkingWeight(oneRM, ww.targetReps || 5);
      return { ...prevWW, [exerciseId]: { ...ww, weight: workW, calibrating: false, failCount: 0 } };
    } else if (w === 0 && r > 0) {
      return { ...prevWW, [exerciseId]: { ...ww, targetReps: Math.max(r - 2, 1), calibrating: false, failCount: 0 } };
    } else if (t > 0) {
      return { ...prevWW, [exerciseId]: { ...ww, targetTime: Math.round(t), calibrating: false, failCount: 0 } };
    }
    return prevWW;
  }
  // Timed exercises: progress by +10s when target held, deload 10% after 2 misses
  if (ww.targetTime) {
    if (t >= ww.targetTime) return { ...prevWW, [exerciseId]: { ...ww, targetTime: ww.targetTime + 10, failCount: 0 } };
    const fails = (ww.failCount || 0) + 1;
    if (fails >= 2) return { ...prevWW, [exerciseId]: { ...ww, targetTime: Math.max(Math.round(ww.targetTime * 0.9), 5), failCount: 0 } };
    return { ...prevWW, [exerciseId]: { ...ww, failCount: fails } };
  }
  const target = ww.targetReps || 8;
  const inc = UPPER_BODY_CATS.has(categoryId) ? 2.5 : 5;
  if (r >= target) {
    // Bodyweight exercises: progress by +1 rep instead of adding weight
    if (w === 0 && ww.weight === 0) return { ...prevWW, [exerciseId]: { ...ww, targetReps: target + 1, failCount: 0 } };
    return { ...prevWW, [exerciseId]: { ...ww, weight: ww.weight + inc, failCount: 0 } };
  }
  const fails = (ww.failCount || 0) + 1;
  if (fails >= 2) {
    if (w === 0 && ww.weight === 0) return { ...prevWW, [exerciseId]: { ...ww, targetReps: Math.max(target - 2, 1), failCount: 0 } };
    return { ...prevWW, [exerciseId]: { ...ww, weight: Math.round(ww.weight * 0.9 / 2.5) * 2.5, failCount: 0 } };
  }
  return { ...prevWW, [exerciseId]: { ...ww, failCount: fails } };
}
function buildGraphPoints(history, exerciseId, win) {
  const msDay = 86400000;
  const now = Date.now();
  const cuts = { '30d': now - 30*msDay, '3m': now - 90*msDay, '1y': now - 365*msDay };
  const cutoff = cuts[win] || null;
  const relevant = (history||[])
    .filter(h => h.exerciseId === exerciseId && h.source !== 'onboarding')
    .filter(h => !cutoff || new Date(h.date).getTime() >= cutoff)
    .sort((a,b) => a.date.localeCompare(b.date));
  if (!relevant.length) return [];
  const isW = relevant.some(h => h.sets?.some(s => Number(s.weight) > 0));
  function best(h) {
    if (isW) { const vs = h.sets.filter(s=>Number(s.weight)>0&&Number(s.reps)>0).map(s=>Number(s.weight)); return vs.length ? Math.max(...vs) : 0; }
    const vs = h.sets.filter(s=>Number(s.reps)>0).map(s=>Number(s.reps)); return vs.length ? Math.max(...vs) : 0;
  }
  if (win === '30d') return relevant.map(h => ({ date: h.date, value: best(h) })).filter(p=>p.value>0);
  const buckets = new Map();
  relevant.forEach(h => {
    const d = new Date(h.date);
    const key = win === 'all'
      ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`
      : (() => { const s=new Date(d.getFullYear(),0,1); const wk=Math.ceil(((d-s)/msDay+s.getDay()+1)/7); return `${d.getFullYear()}-W${String(wk).padStart(2,'0')}`; })();
    const v = best(h);
    if (v > 0 && (!buckets.has(key) || v > buckets.get(key).value)) buckets.set(key, { date: h.date, value: v });
  });
  return Array.from(buckets.values()).sort((a,b)=>a.date.localeCompare(b.date));
}

function formatTimePR(seconds) {
  if (!seconds || seconds <= 0) return '—';
  if (seconds < 60) return `${seconds.toFixed(1)}s`;
  if (seconds < 3600) { const m = Math.floor(seconds / 60); const s = Math.round(seconds % 60); return `${m}:${s.toString().padStart(2, '0')}`; }
  const h = Math.floor(seconds / 3600); const m = Math.floor((seconds % 3600) / 60); const s = Math.round(seconds % 60);
  return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

function getISOWeek(d = new Date()) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  const weekNo = Math.ceil(((date - yearStart) / 86400000 + 1)/7);
  return `${date.getUTCFullYear()}-W${weekNo}`;
}

const _transparentImgCache = new Map();
function useTransparentImg(src) {
  const [dataUrl, setDataUrl] = React.useState(() => _transparentImgCache.get(src) || null);
  React.useEffect(() => {
    if (!src) return;
    if (_transparentImgCache.has(src)) { setDataUrl(_transparentImgCache.get(src)); return; }
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = img.naturalWidth; cv.height = img.naturalHeight;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const id = ctx.getImageData(0, 0, cv.width, cv.height);
      const d = id.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i+1], b = d[i+2];
        if (r > 210 && g > 210 && b > 210) {
          const w = (Math.min(r, g, b) - 210) / 45;
          d[i+3] = Math.round(d[i+3] * Math.max(0, 1 - w));
        }
      }
      ctx.putImageData(id, 0, 0);
      const result = cv.toDataURL('image/png');
      _transparentImgCache.set(src, result);
      setDataUrl(result);
    };
    img.src = src;
  }, [src]);
  return dataUrl || src;
}

function useCircularAvatarImg(src) {
  const [dataUrl, setDataUrl] = React.useState(() => _transparentImgCache.get('circ2:' + src) || null);
  React.useEffect(() => {
    if (!src) return;
    const key = 'circ2:' + src;
    if (_transparentImgCache.has(key)) { setDataUrl(_transparentImgCache.get(key)); return; }
    const img = new Image();
    img.onload = () => {
      try {
        const iW = img.naturalWidth, iH = img.naturalHeight;
        const dW = 600, dH = 870;
        const scale = Math.max(dW / iW, dH / iH);
        const sW = iW * scale, sH = iH * scale;
        const offX = (dW - sW) / 2;
        const offY = 0;
        const cv = document.createElement('canvas');
        cv.width = dW; cv.height = dH;
        const ctx = cv.getContext('2d');
        ctx.drawImage(img, offX, offY, sW, sH);
        const id = ctx.getImageData(0, 0, dW, dH);
        const d = id.data;
        const cx = dW / 2, cy = dH / 2;
        const r = dW * 0.68;
        const r2 = r * r;
        for (let i = 0; i < d.length; i += 4) {
          const px = (i >> 2) % dW;
          const py = Math.floor((i >> 2) / dW);
          const dx = px - cx, dy = py - cy;
          if (dx * dx + dy * dy > r2) d[i + 3] = 0;
        }
        ctx.putImageData(id, 0, 0);
        const result = cv.toDataURL('image/png');
        _transparentImgCache.set(key, result);
        setDataUrl(result);
      } catch(e) {
        _transparentImgCache.set(key, src);
        setDataUrl(src);
      }
    };
    img.onerror = () => { _transparentImgCache.set(key, src); setDataUrl(src); };
    img.src = src;
  }, [src]);
  return dataUrl;
}

function computeStats(state) {
  const lvl = state.level || 1;
  const base = 10 + lvl;
  const vol  = (state.stats?.totalVolume) || 0;
  const pull = (state.stats?.totalPulls) || 0;
  const run  = (state.stats?.totalRunMinutes) || 0;
  const wo   = (state.workoutsCompleted) || 0;
  let str, agi, vit;
  if (state.class === 'strength') {
    str = base * 2 + Math.floor(vol / 500);
    agi = base     + Math.floor(pull / 20);
    vit = base     + Math.floor(wo / 3);
  } else if (state.class === 'speed') {
    str = base     + Math.floor(vol / 1000);
    agi = base * 2 + Math.floor(pull / 15) + Math.floor(run / 20);
    vit = base     + Math.floor(wo / 3);
  } else {
    str = base + Math.floor(vol / 800);
    agi = base + Math.floor(pull / 18) + Math.floor(run / 25);
    vit = base + Math.floor(wo / 2);
  }
  return { STR: str, AGI: agi, VIT: vit };
}

function Toast({ message, type, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 2400); return () => clearTimeout(t); }, [onClose]);
  return <div className={`toast ${type || ''}`}>{message}</div>;
}

function getMondayDate() {
  const d = new Date();
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const monday = new Date(d.setDate(diff));
  return monday.toISOString().slice(0, 10);
}

  }, [state.licenseKey]);

  useEffect(() => {

      const missed = diffDays - 1; // rest days that need covering
      const freezes = typeof s.streakFreezes === 'number' ? s.streakFreezes : 0;
      if (freezes >= missed) {
        const remaining = freezes - missed;
        // Bump lastWorkoutDate forward so we don't re-charge the same gap on every reload
        const bumped = new Date(today.getTime() - 86400000).toISOString();

  function awardXP(xpToAdd) {
    update(s => {
      let { level, xp, totalXP } = s; const oldLevel = level; const oldRank = rankFor(s.bossesDefeated || 0).id;
      xp += xpToAdd; totalXP += xpToAdd;

  // awardXPWithBossCheck: awards XP and also checks if a boss level was just reached,
  // activating a boss week if so. Called after logWorkout completes its state update.
  function awardXPWithBossCheck(xpToAdd, { bossesDefeated: bossesDefeatedArg, bossJustDefeated, newBossHP, bossWeekLevel: bossWeekLevelArg, frequency }) {
    update(s => {
      let { level, xp, totalXP } = s; const oldLevel = level; const oldBossesDefeated = s.bossesDefeated || 0;
      const oldRank = rankFor(oldBossesDefeated).id;
      xp += xpToAdd; totalXP += xpToAdd;
      let needed = xpForLevel(level);
      // Track boss activation across level-ups
      let activeBossHP = s.bossCurrentHP;
      let activeBossWeekLevel = s.bossWeekLevel;
      while (xp >= needed) {
        xp -= needed; level += 1; needed = xpForLevel(level);

        const _bossEntry = BOSSES.find(b => b.level === level);

      const newRank = rankFor(effectiveBossesDefeated).id;
      if (level > oldLevel) setTimeout(() => setLevelUpAnim({ newLevel: level, rankUp: newRank !== oldRank, newRank }), 0);
      return {
        ...s, level, xp, totalXP,

      const deloaded = Object.fromEntries(Object.entries(pre).map(([id, ww]) => {
        const n = { ...ww };
        if (n.weight > 0) n.weight = Math.round(n.weight * DELOAD_WEIGHT_FACTOR / 2.5) * 2.5;
        if (n.targetTime) n.targetTime = Math.round(n.targetTime * DELOAD_WEIGHT_FACTOR);
        return [id, n];
      }));
      return {
        ...s,
        preDeloadWeights: pre,
        workingWeights: deloaded,
        deloadActive: true,
        deloadWeekKey: getISOWeek(),
        deloadSuggested: false,
        mesocycle: { ...(s.mesocycle || {}), weeksSinceDeload: 0, lastDeloadDate: new Date().toISOString().slice(0, 10) },
      };
    });
    showToast('DELOAD WEEK — TRAIN AT 55% WEIGHT', 'success');
  }

  function dismissDeload() {
    // weeksSinceDeload stays at threshold → will re-suggest next week
    update({ deloadSuggested: false });
  }

  function logWorkout(payload) {
    setState(s => {
      const today = new Date(); const todayStr = today.toISOString().slice(0,10);

      // ===== Session = calendar day =====
      // A "session" wraps multiple exercises logged on the same day. Quest 'workouts',
      // boss 'workouts', and workoutsCompleted only increment on the FIRST exercise of a new day.
      const workoutDates = Array.isArray(s.workoutDates) ? [...s.workoutDates] : [];
      const isNewSessionDay = !workoutDates.includes(todayStr);
      if (isNewSessionDay) {
        workoutDates.push(todayStr);
        if (workoutDates.length > 365) workoutDates.splice(0, workoutDates.length - 365);
      }

      const last = s.lastWorkoutDate ? new Date(s.lastWorkoutDate) : null;
      let streak = s.streak;
      if (last) {
        const lastStr = last.toISOString().slice(0,10);
        if (lastStr === todayStr) {} else { const diff = Math.floor((new Date(todayStr) - new Date(lastStr)) / 86400000); if (diff === 1) streak = streak + 1; else streak = 1; }
      } else { streak = 1; }

      const exInfo = getExerciseById(payload.exerciseId); if (!exInfo) return s;
      const { exercise, category } = exInfo;
      let totalVolume = s.stats.totalVolume, totalPulls = s.stats.totalPulls, totalRunMin = s.stats.totalRunMinutes, totalDist = s.stats.totalDistance;
      let totalReps = 0, totalKg = 0, totalSeconds = 0;
      payload.sets.forEach(set => { const reps = Number(set.reps) || 0; const weight = Number(set.weight) || 0; const time = Number(set.time) || 0; totalReps += reps; totalKg += reps * weight; totalSeconds += time; });

      // Track stats for history / PR detection (kept regardless of XP formula)
      let distanceM = 0;
      if (category.xpType === 'cardio') {
        if (exercise.id === 'sprint100') distanceM = 100 * payload.sets.length;
        else if (exercise.id === 'sprint400') distanceM = 400 * payload.sets.length;
        else if (exercise.id === 'run1k') distanceM = 1000 * payload.sets.length;
        else if (exercise.id === 'run3k') distanceM = 3000 * payload.sets.length;
        else if (exercise.id === 'run5k') distanceM = 5000 * payload.sets.length;
        else if (exercise.id === 'run10k') distanceM = 10000 * payload.sets.length;
        else if (exercise.id === 'run21k') distanceM = 21097 * payload.sets.length;
        else if (exercise.id === 'run42k') distanceM = 42195 * payload.sets.length;
        totalDist += distanceM; const minutes = totalSeconds / 60; totalRunMin += minutes;
      } else if (category.xpType === 'bodyweight') {
        if (['pullup','wpullup','muscleup','wmuscleup'].includes(exercise.id)) totalPulls += totalReps;
      } else {
        totalVolume += totalKg;
      }

      // ===== PR detection (MOVED before quest loop so quest q7 'pr' metric can read prHit) =====
      const prs = { ...(s.stats.prs || {}) };
      Object.keys(prs).forEach(k => { if (typeof prs[k] === 'number') prs[k] = { value: prs[k], detail: `${prs[k]}kg`, date: todayStr, ts: Date.now() - 1, manual: false }; });

      let prHit = false, prDetail = '', prValue = 0;
      if (category.xpType === 'cardio') {
        const validTimes = payload.sets.map(x => Number(x.time)).filter(t => t > 0);
        if (validTimes.length > 0) { const best = Math.min(...validTimes); const prev = prs[exercise.id]?.value;
          if (!prev || best < prev) { prValue = best; prDetail = formatTimePR(best); prHit = !!prev; prs[exercise.id] = { value: best, detail: prDetail, date: todayStr, ts: Date.now(), manual: false }; if (!prev) prHit = false; } }
      } else if (exercise.timed) {
        const validTimes = payload.sets.map(x => Number(x.time)).filter(t => t > 0);
        if (validTimes.length > 0) { const best = Math.max(...validTimes); const prev = prs[exercise.id]?.value;
          if (!prev || best > prev) { prValue = best; prDetail = `${best.toFixed(1)} s`; prHit = !!prev; prs[exercise.id] = { value: best, detail: prDetail, date: todayStr, ts: Date.now(), manual: false }; } }
      } else if (exercise.weighted) {
        const validSets = payload.sets.filter(x => Number(x.weight) > 0 && Number(x.reps) > 0);
        if (validSets.length > 0) { const bestSet = validSets.reduce((a, b) => Number(a.weight) > Number(b.weight) ? a : b); const w = Number(bestSet.weight); const r = Number(bestSet.reps); const prev = prs[exercise.id]?.value;
          if (!prev || w > prev) { prValue = w; prDetail = `${w} kg × ${r}`; prHit = !!prev; prs[exercise.id] = { value: w, detail: prDetail, date: todayStr, ts: Date.now(), manual: false }; } }
      } else {
        const validSets = payload.sets.filter(x => Number(x.reps) > 0);
        if (validSets.length > 0) { const bestReps = Math.max(...validSets.map(x => Number(x.reps))); const prev = prs[exercise.id]?.value;
          if (!prev || bestReps > prev) { prValue = bestReps; prDetail = `${bestReps} reps`; prHit = !!prev; prs[exercise.id] = { value: bestReps, detail: prDetail, date: todayStr, ts: Date.now(), manual: false }; } }
      }

      if (payload.markAsPR && !prHit) {
        let v = 0, d = '';
        if (category.xpType === 'cardio') { const t = payload.sets.map(x => Number(x.time)).filter(t => t > 0); if (t.length) { v = Math.min(...t); d = formatTimePR(v); } }
        else if (exercise.timed) { const t = payload.sets.map(x => Number(x.time)).filter(t => t > 0); if (t.length) { v = Math.max(...t); d = `${v.toFixed(1)} s`; } }
        else if (exercise.weighted) { const vs = payload.sets.filter(x => Number(x.weight) > 0 && Number(x.reps) > 0); if (vs.length) { const b = vs.reduce((a, b) => Number(a.weight) > Number(b.weight) ? a : b); v = Number(b.weight); d = `${v} kg × ${Number(b.reps)}`; } }
        else { const vs = payload.sets.filter(x => Number(x.reps) > 0); if (vs.length) { v = Math.max(...vs.map(x => Number(x.reps))); d = `${v} reps`; } }
        if (v > 0) { prs[exercise.id] = { value: v, detail: d, date: todayStr, ts: Date.now(), manual: true }; prHit = true; prValue = v; prDetail = d; }
      }

      // ===== Quest progress + completion detection =====
      const questProgress = { ...s.questProgress };
      const quests = getWeeklyQuests();
      let completionBonus = 0;
      const completedQuests = [];
      quests.forEach(q => {
        const cur = questProgress[q.id] || 0;
        let next = cur;
        if (q.metric === 'workouts') { if (isNewSessionDay) next = cur + 1; }
        else if (q.metric === 'volume' && category.xpType !== 'cardio') next = cur + totalKg;
        else if (q.metric === 'reps_cali' && category.xpType === 'bodyweight') next = cur + totalReps;
        else if (q.metric === 'minutes_run' && category.xpType === 'cardio') next = cur + (totalSeconds / 60);
        else if (q.metric === 'pulls' && ['pullup','wpullup','muscleup','wmuscleup'].includes(exercise.id)) next = cur + totalReps;
        else if (q.metric === 'distance' && category.xpType === 'cardio') next = cur + distanceM;
        else if (q.metric === 'streak') next = streak;
        else if (q.metric === 'pr' && prHit) next = cur + 1; // q7 'A New Legend' was unreachable before
        questProgress[q.id] = next;
        // Target crossing → pay the promised XP exactly once
        if (cur < q.target && next >= q.target) {
          completionBonus += q.xp;
          completedQuests.push(q);
        }
      });

      // ===== Legacy boss progress + quest completion detection (quest XP kept) =====
      const boss = getWeeklyBoss();
      const prevBoss = s.bossProgress || 0;
      let bossProgress = prevBoss;
      if (boss.metric === 'pulls' && ['pullup','wpullup','muscleup','wmuscleup'].includes(exercise.id)) bossProgress += totalReps;
      else if (boss.metric === 'pushpulls' && ['pullup','wpullup','muscleup','wmuscleup','dip','wdip','pushup'].includes(exercise.id)) bossProgress += totalReps;
      else if (boss.metric === 'distance' && category.xpType === 'cardio') bossProgress += distanceM;
      else if (boss.metric === 'workouts') { if (isNewSessionDay) bossProgress += 1; }
      let legacyBossSlain = false;
      if (prevBoss < boss.target && bossProgress >= boss.target) {
        completionBonus += boss.reward;
        legacyBossSlain = true;
      }

      // ===== NEW FLAT XP SYSTEM =====
      const isNewDay = (s.lastSessionDate || '') !== todayStr;
      const sessionXpAwardedToday = isNewDay ? false : (s.sessionXpAwardedToday || false);
      const currentMonday = getMondayDate();
      const isNewWeek = (s.weekStartDate || '') !== currentMonday;
      let weekSessionsCompleted = isNewWeek ? 0 : (s.weekSessionsCompleted || 0);
      let weekRotationIndex = s.weekRotationIndex || 0;

      // Count today's logged exercises (not counting this one yet)
      const todayCount = (s.history || []).filter(h => h.date === todayStr).length;
      const afterThisCount = todayCount + 1;

      const prBonus = prHit ? 75 : 0;
      const baseXP = 15;
      let xpFinal = baseXP + prBonus + completionBonus;

      let awardSessionXp = false;
      if (!sessionXpAwardedToday && afterThisCount >= 3) {
        xpFinal += 150;
        awardSessionXp = true;
      }

      // New boss HP damage (session-based boss weeks)
      let newBossHP = s.bossCurrentHP;
      let bossWeekLevel = s.bossWeekLevel;
      let bossJustDefeated = false;
      let bossesDefeated = s.bossesDefeated || 0;
      if (s.bossCurrentHP !== null && awardSessionXp) {
        newBossHP = s.bossCurrentHP - 150;
        if (newBossHP <= 0) {
          bossJustDefeated = true;
          xpFinal += 500;
          newBossHP = null;
          bossesDefeated += 1;
        }
      }

      // Weekly completion bonus (normal weeks only)
      if (awardSessionXp && s.bossCurrentHP === null && !bossJustDefeated) {
        weekSessionsCompleted += 1;
        if (weekSessionsCompleted >= (s.frequency || 3)) {
          xpFinal += 300;
          weekRotationIndex = weekRotationIndex + 1;
        }
      }

      // Boss level-up detection inside awardXP equivalent (handled by awardXP below)
      // We pass newBossHP/bossWeekLevel back so the next awardXP call can use updated state
      // But level-up triggers boss activation — we do that in the awardXP update path.
      // Instead, we handle it here for immediate state update:
      // (level-up boss trigger is checked after XP is applied — see setTimeout below)

      const history = [{ date: todayStr, time: today.toISOString(), exerciseId: exercise.id, exerciseName: exercise.name, categoryId: category.id, sets: payload.sets, xp: xpFinal, totalReps, totalKg, totalSeconds, distanceM, prHit }, ...s.history].slice(0, 50);

      // ===== Sequential toasts =====
      let toastDelay = 120;
      const queueToast = (msg, type) => { setTimeout(() => showToast(msg, type), toastDelay); toastDelay += 2500; };
      if (xpFinal > 0) {
        setTimeout(() => awardXPWithBossCheck(xpFinal, { bossesDefeated, bossJustDefeated, newBossHP, bossWeekLevel, frequency: s.frequency || 3 }), 80);
        queueToast(`+${xpFinal} XP — STREAK ${streak}`, 'success');
      }
      if (prHit) queueToast(`★ NEW PR! ${exercise.name.toUpperCase()} → ${prDetail} (+${prBonus})`, 'warn');
      if (awardSessionXp) queueToast(`⚡ SESSION COMPLETE — +150 XP`, 'success');
      if (bossJustDefeated) {
        const defeatedBoss = BOSSES.find(b => b.level === bossWeekLevel);
        queueToast(`${defeatedBoss ? defeatedBoss.emoji + ' ' : ''}BOSS DEFEATED: ${defeatedBoss ? defeatedBoss.name : 'BOSS'} — +500 XP`, 'danger');
        setTimeout(() => setLevelUpAnim({ newLevel: s.level, rankUp: true, newRank: rankFor(bossesDefeated).id }), toastDelay + 200);
        setTimeout(() => showToast('⚔ DELOAD WEEK ACTIVATED — RECOVER YOUR STRENGTH', 'success'), toastDelay + 3000);
      }
      completedQuests.forEach(q => {
        const title = (s.mode === 'story' && q.storyTitle) ? q.storyTitle : q.title;
        queueToast(`✓ QUEST DONE: ${title.toUpperCase()} +${q.xp} XP`, 'warn');
      });
      if (legacyBossSlain) {
        const bname = (s.mode === 'story' && boss.storyName) ? boss.storyName : boss.name;
        queueToast(`☠ ${bname} SLAIN — +${boss.reward} XP`, 'danger');
      }

      const newWorkoutsCompleted = isNewSessionDay ? (s.workoutsCompleted || 0) + 1 : (s.workoutsCompleted || 0);
      const prevWWAll = s.workingWeights || {};

      // ===== Mesocycle / deload mechanics =====
      let deloadActive = s.deloadActive || false;
      let deloadWeekKey = s.deloadWeekKey || null;
      let preDeloadWeights = s.preDeloadWeights || null;
      const mesocycle = { ...(s.mesocycle || { weeksSinceDeload: 0, lastDeloadDate: null }) };
      let weeklyProgress = { ...(s.weeklyProgress || { progressed: 0, stalled: 0 }) };
      let deloadSuggested = s.deloadSuggested || false;
      let autoDeload = false;

      // Choose base weights: restore pre-deload weights if deload week just ended
      const currentISOWeek = getISOWeek();
      let baseWW = prevWWAll;
      if (deloadActive && preDeloadWeights && isNewWeek && currentISOWeek !== deloadWeekKey) {
        // Deload week over: restore snapshot, keep any NEW exercises logged during deload
        baseWW = { ...preDeloadWeights, ...Object.fromEntries(
          Object.entries(prevWWAll).filter(([k]) => !preDeloadWeights[k])
        )};
        preDeloadWeights = null;
        deloadActive = false;
        deloadWeekKey = null;
        setTimeout(() => showToast('DELOAD COMPLETE — BACK TO FULL POWER', 'success'), 400);
      }

      const workingWeights = nextWorkingWeightMap(payload.exerciseId, category.id, history, baseWW);

      // On week rollover: evaluate previous week, update mesocycle counter & check deload trigger
      if (isNewWeek) {
        const prev = weeklyProgress;
        const total = prev.progressed + prev.stalled;
        if (total > 0) {
          if (prev.progressed > prev.stalled) {
            mesocycle.weeksSinceDeload = (mesocycle.weeksSinceDeload || 0) + 1;
          } else {
            // Majority stalled → accumulated fatigue, trigger deload immediately
            mesocycle.weeksSinceDeload = DELOAD_WEEKS_THRESHOLD;
          }
          // Count distinct ISO weeks in history to gate early-use false positives
          const distinctWeeks = new Set((s.history || []).map(h => {
            if (!h.date) return null;
            const d = new Date(h.date + 'T12:00:00Z');
            const day = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - day);
            const ys = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return `${d.getUTCFullYear()}-W${Math.ceil(((d - ys) / 86400000 + 1) / 7)}`;
          }).filter(Boolean)).size;
          const lastDeloadOld = !mesocycle.lastDeloadDate ||
            (Date.now() - new Date(mesocycle.lastDeloadDate).getTime() > 7 * 24 * 60 * 60 * 1000);
          if (mesocycle.weeksSinceDeload >= DELOAD_WEEKS_THRESHOLD
              && distinctWeeks >= DELOAD_MIN_HISTORY_WEEKS
              && lastDeloadOld && !deloadActive && !bossJustDefeated) {
            autoDeload = true;
            deloadSuggested = false;
            setTimeout(() => showToast('⚔ DELOAD WEEK ACTIVATED — RECOVER YOUR STRENGTH', 'success'), 400);
          }
        }
        weeklyProgress = { progressed: 0, stalled: 0 };
      }

      // Track this exercise's progression delta for the current week
      const prevWWEntry = baseWW[payload.exerciseId];
      const newWWEntry = workingWeights[payload.exerciseId];
      if (prevWWEntry && newWWEntry && !newWWEntry.calibrating && !prevWWEntry.calibrating) {
        const gained = (newWWEntry.weight || 0) > (prevWWEntry.weight || 0)
          || (newWWEntry.targetReps || 0) > (prevWWEntry.targetReps || 0)
          || (newWWEntry.targetTime || 0) > (prevWWEntry.targetTime || 0);
        const regressed = (newWWEntry.failCount || 0) > (prevWWEntry.failCount || 0)
          || (newWWEntry.weight || 0) < (prevWWEntry.weight || 0)
          || (newWWEntry.targetReps || 0) < (prevWWEntry.targetReps || 0)
          || (newWWEntry.targetTime || 0) < (prevWWEntry.targetTime || 0);
        if (gained) weeklyProgress = { ...weeklyProgress, progressed: weeklyProgress.progressed + 1 };
        else if (regressed) weeklyProgress = { ...weeklyProgress, stalled: weeklyProgress.stalled + 1 };
      }

      return {
        ...s, streak, lastWorkoutDate: today.toISOString(), workoutsCompleted: newWorkoutsCompleted, workoutDates,
        stats: { ...s.stats, totalVolume, totalPulls, totalRunMinutes: totalRunMin, totalDistance: totalDist, prs },
        questProgress, bossProgress, history, workingWeights,
        sessionXpAwardedToday: awardSessionXp ? true : sessionXpAwardedToday,
        lastSessionDate: todayStr,
        weekStartDate: isNewWeek ? currentMonday : (s.weekStartDate || currentMonday),
        weekSessionsCompleted,
        weekRotationIndex,
        bossCurrentHP: bossJustDefeated ? null : newBossHP,
        bossWeekLevel: bossJustDefeated ? null : bossWeekLevel,
        bossesDefeated,
        mesocycle, weeklyProgress, deloadSuggested, deloadActive, deloadWeekKey, preDeloadWeights,
        // Progression threshold auto-triggers deload (no modal)
        ...(autoDeload && !deloadActive ? (() => {
          const deloaded = Object.fromEntries(Object.entries(workingWeights).map(([id, ww]) => {
            const n = { ...ww };
            if (n.weight > 0) n.weight = Math.round(n.weight * DELOAD_WEIGHT_FACTOR / 2.5) * 2.5;
            if (n.targetTime) n.targetTime = Math.round(n.targetTime * DELOAD_WEIGHT_FACTOR);
            return [id, n];
          }));
          return {
            workingWeights: deloaded,
            preDeloadWeights: workingWeights,
            deloadActive: true,
            deloadWeekKey: getISOWeek(),
            deloadSuggested: false,
            mesocycle: { ...mesocycle, weeksSinceDeload: 0, lastDeloadDate: today.toISOString().slice(0, 10) },
          };
        })() : {}),
        // Boss defeat always auto-triggers deload week (no modal)
        ...(bossJustDefeated && !deloadActive ? (() => {
          const deloaded = Object.fromEntries(Object.entries(workingWeights).map(([id, ww]) => {
            const n = { ...ww };
            if (n.weight > 0) n.weight = Math.round(n.weight * DELOAD_WEIGHT_FACTOR / 2.5) * 2.5;
            if (n.targetTime) n.targetTime = Math.round(n.targetTime * DELOAD_WEIGHT_FACTOR);
            return [id, n];
          }));
          return {
            workingWeights: deloaded,
            preDeloadWeights: workingWeights,
            deloadActive: true,
            deloadWeekKey: getISOWeek(),
            deloadSuggested: false,
            mesocycle: { ...mesocycle, weeksSinceDeload: 0, lastDeloadDate: today.toISOString().slice(0, 10) },
          };
        })() : {}),
      };
    });
  }

  if (!authChecked) return <LoadingScreen />;
  if (!authUser) return <AuthScreen onAuth={async (user) => { setAuthUser(user); await loadAppState(); }} />;
  if (!loaded) return <LoadingScreen />;

  if (!state.ready) {
    if (state.step === 'intro')    return <IntroScreen onAwaken={() => update({ step: 'consent' })} />;
    if (state.step === 'consent')  return <ConsentScreen onBack={() => update({ step: 'intro' })} onAccept={(consent) => update({ consent, step: 'name' })} />;
    if (state.step === 'name')     return <NameScreen initial={state.name} onSubmit={(n) => update({ name: n, step: 'gender' })} />;
    if (state.step === 'gender')   return <GenderScreen onSelect={(g) => update({ gender: g, step: 'class' })} onBack={() => update({ step: 'name' })} />;
    if (state.step === 'class')    return <ClassScreen onSelect={(c) => update({ class: c, step: 'goal' })} onBack={() => update({ step: 'gender' })} />;
    if (state.step === 'goal')      return <GoalScreen onSubmit={({ goal, kg }) => { const week = getISOWeek(); update({ goal, weightLog: kg > 0 ? [{ week, date: new Date().toISOString().slice(0,10), kg }] : [], lastWeightWeek: kg > 0 ? week : null, step: 'fitnesslevel' }); }} onBack={() => update({ step: 'class' })} />;
    if (state.step === 'fitnesslevel') return <FitnessLevelScreen onSelect={(level) => update({ trainingProfile: { level }, step: 'strengthtest' })} onBack={() => update({ step: 'goal' })} />;
    if (state.step === 'strengthtest') return <StrengthTestScreen bodyweightKg={(state.weightLog && state.weightLog[0] && state.weightLog[0].kg) || 70} onSubmit={({ workingWeights, onboardingHistory }) => update({ workingWeights, history: [...onboardingHistory, ...(state.history || [])], step: 'difficulty' })} onBack={() => update({ step: 'fitnesslevel' })} />;
    if (state.step === 'difficulty') return <DifficultyScreen onSelect={(d) => update({ difficulty: d, step: 'trainfreq' })} onBack={() => update({ step: 'strengthtest' })} />;
    if (state.step === 'trainfreq') return <TrainFreqScreen onSelect={(f) => update({ frequency: f, step: 'avatar' })} onBack={() => update({ step: 'difficulty' })} />;
    if (state.step === 'avatar')    return <CharacterSelectScreen state={state} onSelect={(id) => update({ characterVariant: id, step: 'creating' })} onBack={() => update({ step: 'trainfreq' })} />;
    if (state.step === 'creating')  return <CreatingScreen state={state} onDone={() => update({ ready: true, step: 'done', hub: 'hub', firstReveal: true })} />;
  }

  const lv = state.level || 1;
  const worldTier = avatarTierFor(lv);
  const weatherClass = worldTier <= 1 ? 'weather-storm' : worldTier <= 3 ? 'weather-fading' : worldTier === 4 ? 'weather-clearing' : 'weather-clear';

  return (
    <>
      {state.ready && (() => {
        const tier = lv >= 80 ? 4 : lv >= 60 ? 3 : lv >= 40 ? 2 : lv >= 20 ? 1 : 0;
        const bgSrc = [BG_TIER0, BG_TIER1, BG_TIER2, BG_TIER3, BG_TIER4][tier];
        const overlayAlpha = [0.45, 0.38, 0.30, 0.25, 0.22][tier];
        return <>
          <div style={{ position: 'fixed', inset: 0, zIndex: 0, pointerEvents: 'none' }}>
            <img src={bgSrc} alt="" style={{ width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center top', display: 'block' }} />
            <div style={{ position: 'absolute', inset: 0, background: `rgba(0,0,0,${overlayAlpha})` }} />
          </div>
          {tier === 0 && <><div style={{ position: 'fixed', inset: 0, zIndex: 1, pointerEvents: 'none' }}><RainCanvas /></div><LightningFlash /></>}
          {tier === 1 && <CosmicEffect />}
          {(tier === 2 || tier === 3) && <SpaceDust />}
        </>;
      })()}
      {!state.ready && <div className="ambient-bg weather-storm" aria-hidden="true">
        <div className="gloom-overlay" />
        <div className="fog-layer" />
        <div className="lightning-flash" />
        <div className="dust-particles">{Array.from({ length: 20 }, (_, i) => <span key={i} />)}</div>
      </div>}
      <div className="container-app">
        {state.hub === 'hub'     && <HubScreen state={state} onGoto={(t) => update({ hub: t })} onOpenPaywall={() => setShowPaywall(true)} />}
        {state.hub === 'train'   && (() => {
          const customCats = state.customCategories || [];
          const resolveCustomCat = (cc) => cc && { ...cc, exercises: (cc.exerciseIds || []).map(id => getExerciseById(id)?.exercise).filter(Boolean) };
          if (view.screen === 'logger') {
            return <ExerciseLogger exerciseId={view.data.exerciseId} categoryId={view.data.categoryId} currentPR={state.stats?.prs?.[view.data.exerciseId]} onCancel={() => setView(view.data.returnTo || { screen: null })} onSave={(payload) => { logWorkout(payload); setView({ screen: null }); update({ hub: 'hub' }); }} onNavigate={(newExId) => setView({ screen: 'logger', data: { exerciseId: newExId, categoryId: view.data.categoryId, returnTo: view.data.returnTo } })} history={state.history} workingWeight={state.workingWeights?.[view.data.exerciseId]} />;
          }
          if (view.screen === 'exercises') {
            const _catIds = EXERCISE_CATEGORIES.map(c => c.id);
            const _catIdx = _catIds.indexOf(view.data.categoryId);
            const _prevCatId = _catIdx > 0 ? _catIds[_catIdx - 1] : null;
            const _nextCatId = _catIdx < _catIds.length - 1 ? _catIds[_catIdx + 1] : null;
            return <ExerciseList categoryId={view.data.categoryId} prevCatId={_prevCatId} nextCatId={_nextCatId} onNavigate={(catId) => setView({ screen: 'exercises', data: { categoryId: catId } })} onPick={(exerciseId) => setView({ screen: 'logger', data: { exerciseId, categoryId: view.data.categoryId, returnTo: { screen: 'exercises', data: { categoryId: view.data.categoryId } } } })} onBack={() => setView({ screen: null })} />;
          }
          if (view.screen === 'category-new') {
            return <CreateCategoryScreen onConfirm={(ids, name) => { const cat = { id: `cat_${Date.now()}`, name, rune: '✦', color: 'var(--blue-2)', exerciseIds: ids }; update({ customCategories: [...customCats, cat] }); setView({ screen: null }); showToast('CATEGORY CREATED', 'success'); }} onBack={() => setView({ screen: null })} />;
          }
          if (view.screen === 'category-edit') {
            const cat = customCats.find(c => c.id === view.data.categoryId);
            if (!cat) return null;
            return <CreateCategoryScreen editing initial={cat.exerciseIds} initialName={cat.name} onConfirm={(ids, name) => { update({ customCategories: customCats.map(c => c.id === cat.id ? { ...c, name, exerciseIds: ids } : c) }); setView({ screen: 'category-detail', data: { categoryId: cat.id } }); showToast('CATEGORY SAVED', 'success'); }} onDelete={() => { update({ customCategories: customCats.filter(c => c.id !== cat.id) }); setView({ screen: null }); showToast('CATEGORY DELETED', 'success'); }} onBack={() => setView({ screen: 'category-detail', data: { categoryId: cat.id } })} />;
          }
          if (view.screen === 'category-detail') {
            const cat = resolveCustomCat(customCats.find(c => c.id === view.data.categoryId));
            if (!cat) return null;
            return <CustomCategoryDetail category={cat} onPick={(exerciseId) => setView({ screen: 'logger', data: { exerciseId, categoryId: cat.id, returnTo: { screen: 'category-detail', data: { categoryId: cat.id } } } })} onEdit={() => setView({ screen: 'category-edit', data: { categoryId: cat.id } })} onBack={() => setView({ screen: null })} />;
          }
          return <TrainScreen state={state} onPickCategory={(catId) => setView({ screen: 'exercises', data: { categoryId: catId } })} onPickExercise={(exerciseId, categoryId) => setView({ screen: 'logger', data: { exerciseId, categoryId, returnTo: { screen: null } } })} onPickCustomCategory={(catId) => setView({ screen: 'category-detail', data: { categoryId: catId } })} onCreateCategory={() => setView({ screen: 'category-new' })} />;
        })()}
        {state.hub === 'tasks'   && <TasksScreen state={state} />}
        {state.hub === 'pr'      && <PRBoardScreen state={state} />}
        {state.hub === 'profile' && <ProfileScreen state={state} onChangeClass={(c) => { update({ class: c }); showToast('PATH CHANGED', 'success'); }} onChangeGoal={(g) => { update({ goal: g }); showToast('GOAL CHANGED', 'success'); }} onGotoTrain={() => { setView({ screen: null }); update({ hub: 'train' }); }} onLogWeight={() => setShowWeighIn(true)} onReset={async () => { await storage.set('jomsviking_state_v1', JSON.stringify(DEFAULT_STATE)); setState(DEFAULT_STATE); setView({ screen: null, data: null }); setStoryReveal(null); setShowPaywall(false); setLevelUpAnim(null); setToast(null); setShowWeighIn(false); }} onOpenPaywall={() => setShowPaywall(true)} onBackupNow={backupNow} onRestoreBackup={restoreBackup} onRestoreCode={restoreWithCode} onShowToast={showToast} onChangeTheme={(id) => { update({ theme: id }); showToast(`THEME: ${id.toUpperCase()}`, 'success'); }} onChangeVariant={(id) => { update({ characterVariant: id }); showToast('CHARACTER CHANGED', 'success'); }} />}
        <BottomNav active={state.hub} onChange={(t) => { setView({ screen: null }); update({ hub: t }); }} />
      </div>
      {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
      {levelUpAnim && <LevelUpOverlay {...levelUpAnim} state={state} onClose={() => setLevelUpAnim(null)} />}
      {state.firstReveal && state.ready && <WallBreakIntro state={state} onDone={() => update({ firstReveal: false })} />}
      {showWeighIn && state.ready && <WeightCheckIn state={state} onSubmit={logWeight} onSkip={skipWeighIn} />}

      {storyReveal && state.ready && <StoryReveal beat={storyReveal} state={state} onClose={() => markBeatSeen(storyReveal.id)} />}
      {showPaywall && <PaywallModal state={state} onClose={() => setShowPaywall(false)} onCheckout={startCheckout} onRestoreCode={restoreWithCode} />}
      {state.ready && state.deloadSuggested && !state.deloadActive && <DeloadModal weeksSinceDeload={state.mesocycle?.weeksSinceDeload || DELOAD_WEEKS_THRESHOLD} onAccept={acceptDeload} onDismiss={dismissDeload} />}
      {state.ready && state.deloadActive && (
        <div style={{ position: 'fixed', top: 'calc(env(safe-area-inset-top) + 4px)', left: '50%', transform: 'translateX(-50%)', zIndex: 80, border: '1px solid var(--gold)', pointerEvents: 'none', maxWidth: 300, textAlign: 'center', overflow: 'hidden', borderRadius: 6 }}>
          <div style={{ position: 'absolute', inset: 0, backgroundImage: "url('imgs/deload_active.png')", backgroundSize: 'cover', backgroundPosition: 'center 20%', opacity: 0.35 }} aria-hidden="true" />
          <div style={{ position: 'absolute', inset: 0, background: 'rgba(12,8,4,0.82)' }} aria-hidden="true" />
          <div style={{ position: 'relative', zIndex: 1, padding: '6px 18px' }}>
            <div className="font-display" style={{ fontSize: 11, color: 'var(--gold-2)', letterSpacing: '0.06em' }}>⚓ DELOAD WEEK ACTIVATED — 55% WEIGHT</div>
          </div>
        </div>
      )}
    </>
  );
}

function AuthScreen({ onAuth }) {
  const [mode, setMode] = React.useState('login');
  const [email, setEmail] = React.useState('');
  const [password, setPassword] = React.useState('');
  const [password2, setPassword2] = React.useState('');
  const [error, setError] = React.useState('');
  const [info, setInfo] = React.useState('');
  const [loading, setLoading] = React.useState(false);

  const ERR = {
    'auth/invalid-email': 'Invalid email address.',
    'auth/user-not-found': 'No account found with this email.',
    'auth/wrong-password': 'Incorrect password.',
    'auth/email-already-in-use': 'This email is already registered.',
    'auth/weak-password': 'Password must be at least 6 characters.',
    'auth/too-many-requests': 'Too many attempts. Please try again later.',
    'auth/invalid-credential': 'Incorrect email or password.',
  };

  async function handleSubmit(e) {
    e.preventDefault();
    setError(''); setInfo(''); setLoading(true);
    if (mode === 'forgot') {
      try {
        await window._fbAuth.sendPasswordResetEmail(email);
        setInfo('Reset link sent — check your inbox.');
      } catch (err) {
        setError(ERR[err.code] || 'Could not send reset email.');
      } finally { setLoading(false); }
      return;
    }
    if (mode === 'register' && password !== password2) { setError('Passwords do not match.'); setLoading(false); return; }
    try {
      let cred;
      if (mode === 'register') {
        cred = await window._fbAuth.createUserWithEmailAndPassword(email, password);
      } else {
        cred = await window._fbAuth.signInWithEmailAndPassword(email, password);
      }
      onAuth(cred.user);
    } catch (err) {
      setError(ERR[err.code] || 'Something went wrong. Please try again.');
    } finally {
      setLoading(false);
    }
  }

  const iStyle = { width: '100%', boxSizing: 'border-box', background: 'rgba(4,3,1,0.7)', border: '1px solid rgba(180,140,60,0.35)', borderRadius: 8, padding: '13px 14px', color: 'var(--bone)', fontSize: 15, fontFamily: 'Rajdhani,sans-serif', outline: 'none' };

  return (
    <div className="container-app safe-top" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '100dvh', padding: '32px 28px', position: 'relative', overflow: 'hidden', background: 'var(--bg)' }}>
      <img src="imgs/auth_bg.png" alt="" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', objectPosition: 'center top', opacity: 0.45, pointerEvents: 'none' }} />
      <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(to bottom, rgba(6,4,2,0.5) 0%, rgba(6,4,2,0.3) 40%, rgba(6,4,2,0.75) 80%, rgba(6,4,2,0.97) 100%)', pointerEvents: 'none' }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', width: '100%' }}>
      <div className="rise" style={{ animationDelay: '0.05s', marginBottom: 28 }}>
        <img src="imgs/logo.png" alt="SPARTA" style={{ width: 72, height: 72, borderRadius: 18, objectFit: 'cover', boxShadow: '0 8px 28px rgba(0,0,0,0.6)' }} />
      </div>
      <div className="rise" style={{ animationDelay: '0.12s', textAlign: 'center', marginBottom: 32 }}>
        <h1 className="font-display" style={{ fontSize: 28, fontWeight: 900, color: 'var(--gold)', margin: 0, letterSpacing: '0.06em' }}>PANTHEON</h1>
        <div className="font-ui" style={{ fontSize: 13, color: 'var(--text-dim)', marginTop: 6 }}>{mode === 'login' ? 'Sign in and continue your campaign.' : mode === 'register' ? 'Create an account and begin your journey.' : 'Enter your email to reset your password.'}</div>
      </div>
      <form onSubmit={handleSubmit} className="rise" style={{ animationDelay: '0.2s', width: '100%', maxWidth: 360, display: 'flex', flexDirection: 'column', gap: 12 }}>
        <input type="email" placeholder="E-mail" value={email} onChange={e => setEmail(e.target.value)} required style={iStyle} autoComplete="email" />
        {mode !== 'forgot' && <input type="password" placeholder="Password" value={password} onChange={e => setPassword(e.target.value)} required style={iStyle} autoComplete={mode === 'register' ? 'new-password' : 'current-password'} />}
        {mode === 'register' && <input type="password" placeholder="Confirm password" value={password2} onChange={e => setPassword2(e.target.value)} required style={iStyle} autoComplete="new-password" />}
        {error && <div className="font-ui" style={{ fontSize: 13, color: 'var(--blood-2)', textAlign: 'center', padding: '6px 0' }}>{error}</div>}
        {info  && <div className="font-ui" style={{ fontSize: 13, color: 'var(--moss)',    textAlign: 'center', padding: '6px 0' }}>{info}</div>}
        <button type="submit" className="btn glow-gold" disabled={loading} style={{ width: '100%', padding: '14px', fontSize: 15, marginTop: 4, opacity: loading ? 0.6 : 1 }}>
          {loading ? '...' : mode === 'login' ? '⚔ SIGN IN' : mode === 'register' ? '✦ CREATE ACCOUNT' : '✉ SEND RESET LINK'}
        </button>
      </form>
      {mode === 'login' && (
        <button type="button" onClick={() => { setMode('forgot'); setError(''); setInfo(''); }} style={{ marginTop: 10, background: 'transparent', border: 'none', color: 'var(--text-faint)', fontSize: 12, cursor: 'pointer', fontFamily: 'Rajdhani,sans-serif' }}>
          Forgot password?
        </button>
      )}
      <button type="button" onClick={() => { setMode(m => m === 'register' ? 'login' : m === 'forgot' ? 'login' : 'register'); setError(''); setInfo(''); setPassword2(''); }} className="rise" style={{ animationDelay: '0.28s', marginTop: 10, background: 'transparent', border: 'none', color: 'var(--text-dim)', fontSize: 13, cursor: 'pointer', fontFamily: 'Rajdhani,sans-serif' }}>
        {mode === 'login' ? "Don't have an account? Register" : 'Back to sign in'}
      </button>
      </div>
    </div>
  );
}

// trainingStep: 1=FITNESS LEVEL, 2=STRENGTH TEST, 3=DIFFICULTY, 4=FREQ (5=avatar/done)
function StepHeader({ step, total, title, subtitle, onBack, trainingStep }) {
  const TR_LABELS = ['FITNESS', 'STRENGTH', 'DIFFICULTY', 'FREQ'];
  return (
    <div style={{ padding: '24px 20px 16px' }} className="safe-top">
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: trainingStep != null ? 10 : 16 }}>
        {onBack ? <button type="button" className="btn btn-iron" onClick={onBack} style={{ padding: '6px 14px', fontSize: 11 }}>◂ BACK</button> : <div />}
        {trainingStep != null ? (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 5 }}>
            <div className="font-display" style={{ fontSize: 9, color: 'var(--text-faint)', letterSpacing: '0.1em' }}>TRAINING PROFILE</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 3 }}>
              {TR_LABELS.map((lbl, i) => (
                <div key={i} title={lbl} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2 }}>
                  <div style={{ width: 30, height: 4, borderRadius: 2, background: i < trainingStep - 1 ? 'var(--gold)' : i === trainingStep - 1 ? 'var(--gold-2)' : 'rgba(190,158,110,0.18)', transition: 'background 0.3s' }} />
                </div>
              ))}
              <div style={{ width: 1, height: 12, background: 'var(--line-2)', margin: '0 2px' }} />
              <div className="font-rune" style={{ fontSize: 13, color: trainingStep > 4 ? 'var(--gold)' : 'var(--text-faint)', lineHeight: 1 }}>Λ</div>
            </div>
          </div>
        ) : step && total ? (
          <div className="font-display" style={{ fontSize: 10, color: 'var(--text-faint)', letterSpacing: '0.02em' }}>STEP {String(step).padStart(2,'0')} / {String(total).padStart(2,'0')}</div>
        ) : <div />}
      </div>
      {trainingStep != null && (
        <div style={{ marginBottom: 8 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between' }}>
            {TR_LABELS.map((lbl, i) => (
              <div key={i} className="font-display" style={{ fontSize: 8, color: i === trainingStep - 1 ? 'var(--gold-2)' : i < trainingStep - 1 ? 'var(--gold)' : 'var(--text-faint)', letterSpacing: '0.06em', opacity: i > trainingStep - 1 ? 0.4 : 1 }}>{lbl}</div>
            ))}
            <div className="font-display" style={{ fontSize: 8, color: 'var(--text-faint)', letterSpacing: '0.06em', opacity: 0.4 }}>AVATAR</div>
          </div>
        </div>
      )}
      <div className="font-display" style={{ fontSize: 22, fontWeight: 900, color: 'var(--gold)', letterSpacing: '0.02em' }}>{title}</div>
      {subtitle && <div className="font-ui" style={{ fontSize: 14, color: 'var(--text-dim)', marginTop: 6, fontStyle: 'italic' }}>{subtitle}</div>}
    </div>
  );
}

function StrengthTestScreen({ onSubmit, onBack, bodyweightKg }) {
  const TESTS = [
    { id: 'squat',    name: 'Squat',       cat: 'legs',  weighted: true,  bwPct: 0.50, sigil: 'SQ', targetReps: 5, titleImg: './title_squat.png' },
    { id: 'bench',    name: 'Bench Press', cat: 'chest', weighted: true,  bwPct: 0.35, sigil: 'BP', targetReps: 5, titleImg: './title_bench.png' },
    { id: 'deadlift', name: 'Deadlift',    cat: 'back',  weighted: true,  bwPct: 0.60, sigil: 'DL', targetReps: 5, titleImg: './title_deadlift.png' },
    { id: 'pullup',   name: 'Pull-ups',    cat: 'back',  weighted: false, bwPct: 0,    sigil: 'PU', targetReps: 5, titleImg: './title_pullups.png' },
  ];
  const [vals, setVals] = React.useState(() =>
    Object.fromEntries(TESTS.map(t => [t.id, { weight: '', reps: '', skip: false }]))
  );
  function setV(id, field, v) { setVals(p => ({ ...p, [id]: { ...p[id], [field]: v } })); }
  function toggleSkip(id) { setVals(p => ({ ...p, [id]: { ...p[id], skip: !p[id].skip, weight: '', reps: '' } })); }

  function handleSubmit() {
    const today = new Date().toISOString().slice(0, 10);
    const bw = (bodyweightKg > 0 ? bodyweightKg : 70);
    const workingWeights = {};
    const onboardingHistory = [];
    TESTS.forEach(t => {
      const v = vals[t.id];
      const w = Number(v.weight) || 0;
      const r = Number(v.reps) || 0;
      if (v.skip || (t.weighted && !(w > 0 && r > 0)) || (!t.weighted && !(r > 0))) {
        if (t.weighted) {
          const startW = Math.round(bw * t.bwPct / 2.5) * 2.5;
          workingWeights[t.id] = { weight: startW, targetReps: t.targetReps, failCount: 0, calibrating: true };
        } else {
          workingWeights[t.id] = { weight: 0, targetReps: t.targetReps, failCount: 0, calibrating: true };
        }
      } else if (t.weighted && w > 0 && r > 0) {
        const oneRM = estimate1RM(w, r);
        const workW = getWorkingWeight(oneRM, t.targetReps);
        workingWeights[t.id] = { weight: workW, targetReps: t.targetReps, failCount: 0, calibrating: false };
        onboardingHistory.push({ date: today, time: new Date().toISOString(), exerciseId: t.id, exerciseName: t.name, categoryId: t.cat, sets: [{ weight: String(w), reps: String(r), time: '' }], xp: 0, totalReps: r, totalKg: r*w, totalSeconds: 0, distanceM: 0, prHit: false, source: 'onboarding' });
      } else if (!t.weighted && r > 0) {
        workingWeights[t.id] = { weight: 0, targetReps: Math.max(r - 2, 1), failCount: 0, calibrating: false };
        onboardingHistory.push({ date: today, time: new Date().toISOString(), exerciseId: t.id, exerciseName: t.name, categoryId: t.cat, sets: [{ weight: '', reps: String(r), time: '' }], xp: 0, totalReps: r, totalKg: 0, totalSeconds: 0, distanceM: 0, prHit: false, source: 'onboarding' });
      }
    });
    onSubmit({ workingWeights, onboardingHistory });
  }

  const lStyle = { fontSize:10, color:'rgba(155,125,48,0.88)', fontFamily:'Rajdhani,sans-serif', letterSpacing:'0.08em', textTransform:'uppercase', marginBottom:4, display:'block' };

  return (
    <div style={{ position:'relative', minHeight:'100dvh', display:'flex', flexDirection:'column', paddingBottom:44,
      backgroundImage:"url('./strength_bg.png')", backgroundSize:'cover', backgroundPosition:'center center', backgroundRepeat:'no-repeat' }}>

      <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.18)', pointerEvents:'none', zIndex:0 }}/>

      <div style={{ position:'relative', zIndex:1, display:'flex', flexDirection:'column', flex:1 }}>
        <div className="safe-top" style={{ padding:'12px 18px 0', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <button type="button" className="btn btn-iron" onClick={onBack} style={{ padding:'5px 13px', fontSize:10, background:'rgba(0,0,0,0.55)' }}>◂ BACK</button>
          <div style={{ display:'flex', gap:3 }}>
            {[0,1,2,3].map(i => <div key={i} style={{ width:24, height:3, borderRadius:2, background:i<1?'var(--gold)':i===1?'var(--gold-2)':'rgba(190,158,110,0.22)' }}/>)}
          </div>
        </div>

        <div style={{ textAlign:'center', padding:'18px 18px 14px' }}>
          <h1 className="font-display" style={{ fontSize:34, fontWeight:700, color:'rgba(224,192,78,0.98)', margin:0, letterSpacing:'0.03em', textShadow:'0 2px 16px rgba(0,0,0,0.9), 0 0 40px rgba(160,110,20,0.5)' }}>Test of Strength</h1>
        </div>

        <div style={{ padding:'0 14px', display:'flex', flexDirection:'column', gap:12, flex:1 }}>
          {TESTS.map((t, i) => {

function ExerciseProgressGraph({ history, exerciseId, categoryColor }) {
  const [win, setWin] = React.useState('30d');
  const [tip, setTip] = React.useState(null);
  const WINS = [{ id:'30d',label:'30D' },{ id:'3m',label:'3M' },{ id:'1y',label:'1Y' },{ id:'all',label:'ALL' }];
  const pts = buildGraphPoints(history || [], exerciseId, win);
  if (pts.length < 2) return (
    <div style={{ padding: '8px 20px' }}>
      <div className="font-display" style={{ fontSize:10, color:'var(--text-faint)', letterSpacing:'0.02em', marginBottom:6 }}>PROGRESS</div>
      <div className="panel" style={{ padding:'16px', textAlign:'center' }}>
        <div className="font-ui" style={{ fontSize:12, color:'var(--text-faint)', fontStyle:'italic' }}>Log more sessions to see your progress chart.</div>
      </div>
    </div>
  );
  const W=320, H=140, pl=36, pr=10, pt=10, pb=28;
  const iw=W-pl-pr, ih=H-pt-pb;
  const vals=pts.map(p=>p.value);
  const minV=Math.min(...vals), maxV=Math.max(...vals), rng=maxV-minV||1;
  const dates=pts.map(p=>new Date(p.date).getTime());
  const minD=Math.min(...dates), maxD=Math.max(...dates), rngD=maxD-minD||1;
  const tx=d=>pl+((new Date(d).getTime()-minD)/rngD)*iw;
  const ty=v=>pt+(1-(v-minV)/rng)*ih;
  const poly=pts.map(p=>`${tx(p.date).toFixed(1)},${ty(p.value).toFixed(1)}`).join(' ');
  const clr=categoryColor||'var(--gold)';
  return (
    <div style={{ padding:'8px 20px' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:6 }}>
        <div className="font-display" style={{ fontSize:10, color:'var(--text-faint)', letterSpacing:'0.02em' }}>PROGRESS</div>
        <div style={{ display:'flex', gap:3 }}>
          {WINS.map(w=>(
            <button key={w.id} type="button" onClick={()=>{setWin(w.id);setTip(null);}} className={win===w.id?'btn':'btn btn-iron'} style={{ padding:'3px 7px', fontSize:9 }}>{w.label}</button>
          ))}
        </div>
      </div>
      <div className="panel" style={{ padding:0, overflow:'hidden', position:'relative' }}>
        <svg viewBox={`0 0 ${W} ${H}`} style={{ width:'100%', height:'auto', display:'block' }}>
          {[0,0.5,1].map(f=><line key={f} x1={pl} y1={pt+f*ih} x2={pl+iw} y2={pt+f*ih} stroke="rgba(190,158,110,0.1)" strokeWidth="1"/>)}
          {[0,0.5,1].map(f=><text key={f} x={pl-3} y={pt+f*ih+4} textAnchor="end" fontSize="9" fill="rgba(144,135,116,0.8)" fontFamily="Rajdhani">{Math.round(maxV-f*rng)}</text>)}
          <text x={tx(pts[0].date)} y={H-5} textAnchor="start" fontSize="9" fill="rgba(144,135,116,0.8)" fontFamily="Rajdhani">{pts[0].date.slice(5).replace('-','/')}</text>
          <text x={tx(pts[pts.length-1].date)} y={H-5} textAnchor="end" fontSize="9" fill="rgba(144,135,116,0.8)" fontFamily="Rajdhani">{pts[pts.length-1].date.slice(5).replace('-','/')}</text>
          <polygon points={`${pl},${pt+ih} ${poly} ${tx(pts[pts.length-1].date).toFixed(1)},${pt+ih}`} fill={clr} opacity="0.08"/>
          <polyline points={poly} fill="none" stroke={clr} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" opacity="0.85"/>
          {pts.map((p,i)=>(
            <circle key={i} cx={tx(p.date)} cy={ty(p.value)} r={tip?.i===i?5:3.5} fill={clr} opacity="0.9" style={{ cursor:'pointer' }}
              onClick={()=>setTip(tip?.i===i?null:{i, date:p.date, value:p.value, cx:tx(p.date), cy:ty(p.value)})}/>
          ))}
          {tip&&(()=>{
            const bx=Math.min(Math.max(tip.cx-38,pl),W-80), by=Math.max(tip.cy-42,2);
            return <g>
              <rect x={bx} y={by} width="78" height="34" rx="4" fill="rgba(18,14,8,0.96)" stroke="rgba(201,137,42,0.45)" strokeWidth="1"/>
              <text x={bx+39} y={by+13} textAnchor="middle" fontSize="11" fill="#e8a93a" fontFamily="Cinzel" fontWeight="700">{tip.value} kg</text>
              <text x={bx+39} y={by+26} textAnchor="middle" fontSize="9" fill="rgba(192,181,156,0.85)" fontFamily="Rajdhani">{tip.date}</text>
            </g>;
          })()}
        </svg>
      </div>
    </div>
  );
}

function WeightCheckIn({ state, onSubmit, onSkip }) {
  const [kg, setKg] = useState('');
  const w = Number(kg);
  const valid = w > 20 && w < 400;
  const log = state.weightLog || [];
  const last = log.length > 0 ? log[log.length - 1] : null;
  const goal = state.goal || 'maintain';
  let delta = null, verdict = null, verdictColor = 'var(--text-dim)';
  if (last && valid) {
    delta = w - last.kg; const d = delta;
    if (goal === 'gain') {
      if (d > 0.1) { verdict = 'Gaining — right direction!'; verdictColor = 'var(--jade)'; }
      else if (d < -0.1) { verdict = 'Losing — add calories'; verdictColor = 'var(--crimson)'; }
      else { verdict = 'Stalled — push harder'; verdictColor = 'var(--gold)'; }
    } else if (goal === 'lose') {
      if (d < -0.1) { verdict = 'Losing — right direction!'; verdictColor = 'var(--jade)'; }
      else if (d > 0.1) { verdict = 'Gaining — hold the diet'; verdictColor = 'var(--crimson)'; }
      else { verdict = 'Stalled — cut a little'; verdictColor = 'var(--gold)'; }
    } else {
      if (Math.abs(d) <= 0.5) { verdict = 'Holding steady — great!'; verdictColor = 'var(--jade)'; }
      else if (d > 0.5) { verdict = 'Slight gain'; verdictColor = 'var(--gold)'; }
      else { verdict = 'Slight loss'; verdictColor = 'var(--gold)'; }
    }
  }
  const goalLabel = GOALS.find(g => g.id === goal)?.label || '—';
  return (
    <div className="levelup-overlay" style={{ background: 'radial-gradient(circle at center, rgba(201,137,42,0.32), rgba(11,12,14,0.96) 70%)' }}>
      <div className="panel-strong carved" style={{ padding: '28px 24px', maxWidth: 360, width: '90%', textAlign: 'center', backgroundImage: 'var(--profile-stats-bg-img)', backgroundSize: 'cover', backgroundPosition: 'center' }}>
        <div className="font-rune pulse-glow" style={{ fontSize: 48, color: 'var(--gold)', lineHeight: 1 }}>Λ</div>
        <div className="font-display" style={{ fontSize: 22, color: 'var(--gold)', fontWeight: 900, letterSpacing: '0.02em', marginTop: 12 }}>WEEKLY WEIGH-IN</div>
        <div className="font-ui" style={{ fontSize: 14, color: 'var(--text-dim)', marginTop: 6, fontStyle: 'italic' }}>Goal: <span style={{ color: 'var(--gold-2)' }}>{goalLabel}</span></div>
        {last && (<div className="font-ui" style={{ fontSize: 13, color: 'var(--text-faint)', marginTop: 10 }}>Last time ({last.date.replace(/-/g,'.')}): <span style={{ color: 'var(--text)', fontWeight: 700 }}>{last.kg} kg</span></div>)}
        <div style={{ marginTop: 16 }}>
          <input type="number" inputMode="decimal" value={kg} onChange={(e) => setKg(e.target.value)} placeholder="kg" min="20" max="400" step="0.1" autoFocus style={{ fontSize: 30 }} />
        </div>
        {delta !== null && (
          <div style={{ marginTop: 14 }}>
            <div className="font-display" style={{ fontSize: 26, fontWeight: 900, color: verdictColor }}>{delta > 0 ? '+' : ''}{delta.toFixed(1)} kg</div>
            <div className="font-ui" style={{ fontSize: 14, color: verdictColor, marginTop: 2, fontWeight: 600 }}>{verdict}</div>
          </div>
        )}
        <button type="button" className="btn glow-gold" onClick={() => valid && onSubmit(w)} disabled={!valid} style={{ width: '100%', fontSize: 14, padding: '14px', opacity: valid ? 1 : 0.4, marginTop: 18 }}>✓ LOG WEIGHT</button>
        <button type="button" className="btn btn-iron" onClick={onSkip} style={{ width: '100%', padding: '10px', fontSize: 12, marginTop: 8 }}>SKIP THIS WEEK</button>
      </div>
    </div>
  );
}

function WorkoutSummaryModal({ state, onClose }) {
  const todayStr = new Date().toISOString().slice(0, 10);
  const todayEntries = (state.history || []).filter(h => h.date === todayStr);
